apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'com.buildplay.legacyportal'
version = '1.0.0'

android {
  namespace 'com.buildplay.legacyportal'
  buildFeatures { prefab true }
  // React Native supplies these shared libraries to both the app and its test APK.
  packaging.jniLibs.excludes += ['**/libc++_shared.so', '**/libfbjni.so', '**/libjsi.so']
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
  defaultConfig {
    externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    versionCode 1
    versionName '1.0.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
}

dependencies {
  implementation 'com.google.firebase:firebase-analytics:24.0.0'
  implementation 'com.facebook.react:react-android'
  implementation 'com.facebook.fbjni:fbjni:0.7.0'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
