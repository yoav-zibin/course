name: Firestore query storage
on:
  push:
    branches: [main]
  pull_request:
jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: game_platform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pip install -r game_platform/requirements-dev.txt
      - run: npm install -g firebase-tools@15.34.1
      - run: firebase emulators:exec --only firestore --project demo-game-platform --config game_platform/firebase.scaling.json 'python -m pytest game_platform/tests/test_query_store.py game_platform/tests/test_scaling_live_budget.py -q'
      - run: node --test game_platform/tests/web/*.test.cjs
