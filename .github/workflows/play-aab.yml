name: Play AAB

on:
  workflow_dispatch:

jobs:
  android-play:
    name: BuildPlay Android (Play AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_API_URL: https://buildplay.fun
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontends/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/portal/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - run: npm ci
      - name: Prepare optional Android push configuration
        env:
          BUILDPLAY_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: node scripts/configure-notification-build.mjs
      - name: Write upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - run: npx expo prebuild --platform android --no-install --no-clean
      - name: Build signed AAB for Play
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          bash android/gradlew --project-dir android --no-daemon --max-workers=2 \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.keystore" \
            "-Pandroid.injected.signing.store.password=<redacted>" \
            "-Pandroid.injected.signing.key.alias=upload" \
            "-Pandroid.injected.signing.key.password=<redacted>" \
            :app:bundleRelease 2>&1 | tee "$GITHUB_WORKSPACE/buildplay-aab-build.log"
          cp android/app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/BuildPlay.aab"
          keytool -printcert -jarfile "$GITHUB_WORKSPACE/BuildPlay.aab" | grep -i "SHA256" | head -2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildPlay-android-aab
          path: BuildPlay.aab
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildPlay-aab-gradle-log
          path: buildplay-aab-build.log
          if-no-files-found: warn
