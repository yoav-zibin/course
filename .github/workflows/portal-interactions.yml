name: Native interaction benchmark
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Portal apps run containing the release simulator app
        type: string
        required: true
      baseline:
        description: Optional baseline commit for a same-simulator JavaScript comparison
        type: string
        required: false
      baseline_build_run:
        description: Portal apps run for the baseline when its native code differs
        type: string
        required: false
      scenario:
        description: Interactions to measure
        type: choice
        options: [board, landscape, startup, startup-video, startup-link, startup-profile, responses, responses-profile, responses-checkers, responses-checkers-profile, responses-rapid, startup-flows, startup-flows-profile]
        default: board
      video_pairs:
        description: Paired trials for recorded launches
        type: choice
        options: ['5', '1', '2', '3', '4']
        default: '5'
      simulator_host:
        description: Mac hosting the iPhone simulator
        type: choice
        options: [macos-26-intel, macos-26]
        default: macos-26-intel
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ${{ inputs.simulator_host || 'macos-26-intel' }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@v4
        with:
          name: BuildPlay-ios-simulator
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: release
      - uses: actions/download-artifact@v4
        if: inputs.baseline && inputs.baseline_build_run
        with:
          name: BuildPlay-ios-simulator
          run-id: ${{ inputs.baseline_build_run }}
          github-token: ${{ github.token }}
          path: baseline-release
      - name: Set up release fixture and iPhone
        run: |
          python3 -m pip install --only-binary=:all: av numpy pillow
          command -v xcodegen || brew install xcodegen
          (cd frontends/portal && npm ci)
          mkdir -p "$RUNNER_TEMP/interaction"
          frontends/portal/node_modules/.bin/tsx scripts/native-interactions/backgammon.ts "$RUNNER_TEMP/interaction/fixture"
          if [[ "${{ inputs.scenario }}" == responses* || "${{ inputs.scenario }}" == startup-flows* ]]; then
            frontends/portal/node_modules/.bin/tsx scripts/native-interactions/response-fixtures.ts "$RUNNER_TEMP/interaction/response-fixtures"
          fi
          ditto -x -k release/BuildPlay-simulator.zip "$RUNNER_TEMP/interaction/release"
          if [[ -f baseline-release/BuildPlay-simulator.zip ]]; then
            ditto -x -k baseline-release/BuildPlay-simulator.zip "$RUNNER_TEMP/interaction/baseline-release"
          fi
          xcrun simctl list devices available --json | jq '{devices:(.devices | with_entries(select(.key | test("iOS-(2[6-9]|[3-9][0-9])-"))))}' > "$RUNNER_TEMP/interaction/devices.json"
          python3 frontends/portal/scripts/select-ios-simulator.py "$RUNNER_TEMP/interaction/devices.json" > "$RUNNER_TEMP/interaction/phone.json"
          uname -m > "$RUNNER_TEMP/interaction/host-architecture.txt"
          echo "SIMULATOR_ID=$(jq -r .udid "$RUNNER_TEMP/interaction/phone.json")" >> "$GITHUB_ENV"
      - name: Benchmark release JavaScript on the same simulator
        env:
          BASELINE: ${{ inputs.baseline }}
          BUILD_RUN: ${{ inputs.build_run }}
          BASELINE_BUILD_RUN: ${{ inputs.baseline_build_run }}
          SCENARIO: ${{ inputs.scenario }}
          VIDEO_PAIRS: ${{ inputs.video_pairs || '5' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/interaction"
          benchmark=scripts/native-interactions/ios.sh
          if [[ "$SCENARIO" == startup* ]]; then
            export EXPO_PUBLIC_API_URL=http://localhost:18764
            benchmark=scripts/native-interactions/ios-startup.sh
            python3 - "$base" <<'PY'
          import plistlib, sys
          from pathlib import Path
          for path in Path(sys.argv[1]).glob('*release/BuildPlay.app/Info.plist'):
              info = plistlib.loads(path.read_bytes())
              policy = info.setdefault('NSAppTransportSecurity', {})
              policy['NSAllowsLocalNetworking'] = True
              policy.setdefault('NSExceptionDomains', {})['localhost'] = {'NSExceptionAllowsInsecureHTTPLoads': True}
              path.write_bytes(plistlib.dumps(info))
          PY
          fi
          revisions=(current)
          if [[ -n "$BASELINE" ]]; then
            [[ "$BASELINE" =~ ^[0-9a-f]{40}$ ]]
            revisions=(baseline current)
          fi
          for name in "${revisions[@]}"; do
            revision=$GITHUB_SHA
            app="$base/release/BuildPlay.app"
            native_run=$BUILD_RUN
            if [[ "$name" == baseline ]]; then revision=$BASELINE; fi
            if [[ "$name" == baseline && -n "$BASELINE_BUILD_RUN" ]]; then
              app="$base/baseline-release/BuildPlay.app"
              native_run=$BASELINE_BUILD_RUN
            fi
            source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$native_run" --jq '.head_sha')
            # Only replace JavaScript in an app with matching native dependencies and config.
            git diff --exit-code "$source_sha" "$revision" -- frontends/portal/{package-lock.json,app.config.ts,plugins,modules,ios}
            git worktree add --detach "$base/$name" "$revision"
            portal="$base/$name/frontends/portal"
            if [[ "$SCENARIO" == startup-profile ]]; then
              cp scripts/native-interactions/profile-launch.js "$portal/benchmark-profile.js"
              python3 - "$portal/index.ts" <<'PYPROFILE'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          p.write_text("import './benchmark-profile';\n"+p.read_text()+"\n;(globalThis as any).__finishBenchmarkEntry();\n")
          PYPROFILE
            fi
            (cd "$portal" && npm ci && CI=1 npx --no-install expo export --platform ios --output-dir "$base/js-$name")
            cp "$base/js-$name"/_expo/static/js/ios/*.hbc "$app/main.jsbundle"
            codesign --force --sign - --preserve-metadata=identifier,entitlements "$app"
            if [[ "$SCENARIO" == startup-video || "$SCENARIO" == startup-link || "$SCENARIO" == startup-profile ]]; then
              mkdir -p "$base/video-apps/$name"
              ditto "$app" "$base/video-apps/$name/BuildPlay.app"
              continue
            fi
            if [[ "$SCENARIO" == responses* || "$SCENARIO" == startup-flows* ]]; then
              measure=(python3 scripts/native-interactions/ios_responses.py "$app" "$base/response-fixtures" "$base/results/$name" "$SIMULATOR_ID")
              if [[ "$SCENARIO" == *-profile ]]; then measure+=(--profile); fi
              if [[ "$SCENARIO" == responses-checkers* ]]; then measure+=(--checker-pair); fi
              if [[ "$SCENARIO" == responses-rapid ]]; then measure+=(--rapid); fi
              if [[ "$SCENARIO" == startup-flows* ]]; then measure+=(--fresh "$base/fixture"); fi
              "${measure[@]}"
              continue
            fi
            if ! bash "$benchmark" "$app" "$base/fixture" "$base/results/$name" "$SIMULATOR_ID"; then
              if [[ "$name" == current || "$SCENARIO" == startup ]]; then exit 1; fi
              echo "::warning::Baseline verification failed. Continuing with the independent candidate."
            fi
          done
          if [[ "$SCENARIO" == startup-video || "$SCENARIO" == startup-link || "$SCENARIO" == startup-profile ]]; then
            flags=(--pairs "$VIDEO_PAIRS")
            if [[ "$SCENARIO" == startup-link || "$SCENARIO" == startup-profile ]]; then flags+=(--sender); fi
            if [[ "$SCENARIO" == startup-profile ]]; then flags+=(--profile); fi
            python3 scripts/native-interactions/startup_ios_video.py "$base/video-apps" "$base/fixture" "$base/results" "$SIMULATOR_ID" "${flags[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-interaction-metrics
          path: |
            ${{ runner.temp }}/interaction/results/*/*.xcresult
            ${{ runner.temp }}/interaction/results/*/*.json
            ${{ runner.temp }}/interaction/results/*/*.jsonl
            ${{ runner.temp }}/interaction/results/*/*.sample.txt
            ${{ runner.temp }}/interaction/results/*/*.log
            ${{ runner.temp }}/interaction/results/*/*.mov
            ${{ runner.temp }}/interaction/results/*/*.png
            ${{ runner.temp }}/interaction/phone.json
            ${{ runner.temp }}/interaction/host-architecture.txt
            ${{ runner.temp }}/interaction/fixture/pose.json
