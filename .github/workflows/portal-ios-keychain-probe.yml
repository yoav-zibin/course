name: Portal iOS simulator Keychain probe

on: workflow_dispatch

permissions:
  contents: read

jobs:
  isolated-keychain:
    name: Verify isolated simulator Keychain permissions
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build and run the tiny UIKit probe
        run: python3 scripts/probe-ios-simulator-keychain.py ios-keychain-probe-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildPlay-isolated-Keychain-probe
          path: ios-keychain-probe-results/
          if-no-files-found: warn
          retention-days: 7
