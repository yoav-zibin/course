name: Repair production admin credential permissions
on: workflow_dispatch
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'yoav-zibin/course' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore the required private mode and allow service startup
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_SSH_KEY: ${{ secrets.GCP_VM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" '
            set -eu
            key=/opt/game-platform/admin-api-key
            test "$(sudo stat -c "%F:%u" -- "$key")" = "regular file:0"
            sudo chmod 0600 -- "$key"
            sudo systemctl reset-failed game-platform.service
            sudo systemctl start game-platform.service
          '
