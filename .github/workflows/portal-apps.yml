# The repository's two native apps: BuildPlay for Android and iOS.
# Android builds/tests on Ubuntu and publishes BuildPlay.apk on main pushes.
# iOS builds and runs tests on a hosted Mac. The TestFlight job is maintainer opt-in;
# see docs/mobile-development-on-vm.md for credentials, bundle ID and access.
name: Portal apps

on:
  workflow_dispatch:
    inputs:
      ios_runner:
        description: Standard Mac runner (try the other image if capacity is delayed)
        type: choice
        required: true
        default: macos-15-intel
        options:
          - macos-15-intel
          - macos-26-intel
  push:
    branches: [main]
    paths:
      - "android/**"
      - "frontends/ios-game-portal/**"
      - ".github/workflows/portal-apps.yml"
  pull_request:
    paths:
      - "android/**"
      - "frontends/ios-game-portal/**"
      - ".github/workflows/portal-apps.yml"

jobs:
  android-portal:
    name: BuildPlay Android (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write # update the rolling portal-apps release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/buildplay-test.log"
      - name: Build debug APK (points at https://buildplay.fun)
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/buildplay-build.log"
      - name: Publish Gradle logs (summary + artifact)
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          for f in buildplay-test.log buildplay-build.log; do
            if [ -f "$f" ]; then
              { echo "## $f — last 200 lines"; echo '```'; tail -n 200 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildPlay-gradle-logs
          path: |
            buildplay-test.log
            buildplay-build.log
          if-no-files-found: ignore
      - name: Rename APK for a stable download name
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/BuildPlay.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: BuildPlay-android-apk
          path: BuildPlay.apk
          retention-days: 90
      - name: Publish APK to the rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portal-apps
          name: BuildPlay apps (latest builds)
          body: |
            Latest cloud builds of the BuildPlay apps.

            **Android (BuildPlay):** download `BuildPlay.apk` below on your phone and install it
            (allow "Install unknown apps" for your browser when asked). The app connects to
            https://buildplay.fun — sign in as a guest and play.
          prerelease: true
          make_latest: false
          files: BuildPlay.apk

  ios-portal:
    name: BuildPlay iOS (simulator build and tests)
    # The ARM runner pool has failed to acquire runners; standard Intel Macs
    # also run iOS Simulator tests without requiring a paid larger runner.
    runs-on: ${{ inputs.ios_runner || 'macos-15-intel' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build app and UI tests for the iOS Simulator (unsigned)
        id: ios-build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ios-test-results"
          set -o pipefail
          xcodebuild \
            -project frontends/ios-game-portal/GamePortal.xcodeproj \
            -scheme GamePortal \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-portal-build" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee "$GITHUB_WORKSPACE/ios-test-results/build.log"
      - name: Verify distribution metadata in the built app
        run: |
          app="$GITHUB_WORKSPACE/ios-portal-build/Build/Products/Debug-iphonesimulator/GamePortal.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = BuildPlay
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist")" = AppIcon
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$app/Info.plist"
          test -f "$app/Assets.car"
      - name: Zip the simulator app
        run: |
          cd "$GITHUB_WORKSPACE/ios-portal-build/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent GamePortal.app "$GITHUB_WORKSPACE/BuildPlay-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BuildPlay-ios-simulator
          path: BuildPlay-simulator.zip
          retention-days: 90
      - name: Test rules, persistence, cache, and mocked online store
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' }}
        run: |
          set -o pipefail
          bash frontends/ios-game-portal/scripts/test-models.sh 2>&1 \
            | tee "$GITHUB_WORKSPACE/ios-test-results/model-tests.log"
      - name: Run local gameplay and restart tests in an iPhone Simulator
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' }}
        # Leave time for diagnostics/artifacts if simulator or XCTest startup stalls.
        timeout-minutes: 15
        run: |
          set -o pipefail
          bash frontends/ios-game-portal/scripts/test-simulator.sh \
            "$GITHUB_WORKSPACE/ios-test-results" 2>&1 \
            | tee "$GITHUB_WORKSPACE/ios-test-results/simulator-tests.log"
      - name: Export test screenshots
        if: always()
        run: |
          results="$GITHUB_WORKSPACE/ios-test-results"
          mkdir -p "$results/screenshots"
          export_status=0
          if [ -d "$results/SimulatorTests.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$results/SimulatorTests.xcresult" \
              --output-path "$results/screenshots" || export_status=$?
          fi
          if [ -s "$results/simulator.udid" ]; then
            xcrun simctl io "$(cat "$results/simulator.udid")" screenshot \
              "$results/screenshots/simulator-final.png" || true
          fi
          exit "$export_status"
      - name: Upload iOS test logs and Xcode results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildPlay-ios-test-results
          path: ios-test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildPlay-ios-screenshots
          path: ios-test-results/screenshots/
          if-no-files-found: warn
          retention-days: 14

  ios-testflight:
    name: BuildPlay iOS (TestFlight upload)
    # The maintainer registers a portal bundle ID and grants Apple cloud-signing
    # access, then sets IOS_PORTAL_BUNDLE_ID and TESTFLIGHT_ENABLED=true.
    # Reuses ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID.
    if: vars.TESTFLIGHT_ENABLED == 'true' && vars.IOS_PORTAL_BUNDLE_ID != '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: ios-portal
    runs-on: ${{ inputs.ios_runner || 'macos-15-intel' }}
    defaults:
      run:
        working-directory: frontends/ios-game-portal
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Archive (signed, automatic provisioning)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PORTAL_BUNDLE_ID: ${{ vars.IOS_PORTAL_BUNDLE_ID }}
        run: |
          xcodebuild \
            -project GamePortal.xcodeproj \
            -scheme GamePortal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/GamePortal.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_PORTAL_BUNDLE_ID" \
            archive
      - name: Export the IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PORTAL_BUNDLE_ID: ${{ vars.IOS_PORTAL_BUNDLE_ID }}
        run: |
          cat > "$GITHUB_WORKSPACE/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>stripSwiftSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/GamePortal.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/export" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$GITHUB_WORKSPACE/export/GamePortal.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
