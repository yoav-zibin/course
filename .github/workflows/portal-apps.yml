# The real class portal apps, built in the cloud like the samples
# (see .github/workflows/mobile-samples.yml and mobile-samples/README.md).
#
# Android: the Playroom portal in android/ builds on a free Ubuntu runner.
# Its gradle.properties already sets portalBaseUrl=https://buildplay.fun,
# so the debug APK talks to the live server. Each successful build on main
# updates the rolling "portal-apps" release, so the newest APK is always at:
#   https://github.com/yoav-zibin/course/releases/download/portal-apps/Playroom.apk
#
# iOS: the GamePortal app in frontends/ios-game-portal/ builds on a
# GitHub-hosted Mac and the simulator build is uploaded as an artifact.
# Installing it on a real iPhone needs the Apple Developer Program plus a
# bundle ID registered to that account — the project currently uses
# edu.columbia.gameportal.starter from the class. Once the account exists,
# a TestFlight job like the one in mobile-samples.yml can be added here
# (with the bundle ID changed to one the account owns, e.g.
# fun.buildplay.portal).
name: Portal apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "frontends/ios-game-portal/**"
      - ".github/workflows/portal-apps.yml"
  pull_request:
    paths:
      - "android/**"
      - "frontends/ios-game-portal/**"
      - ".github/workflows/portal-apps.yml"

jobs:
  android-portal:
    name: Playroom Android portal (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write # update the rolling portal-apps release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build debug APK (points at https://buildplay.fun)
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Rename APK for a stable download name
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Playroom.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Playroom-android-apk
          path: Playroom.apk
          retention-days: 90
      - name: Publish APK to the rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portal-apps
          name: Portal apps (latest builds)
          body: |
            Latest cloud builds of the real BuildPlay portal apps.

            **Android (Playroom):** download `Playroom.apk` below on your phone and install it
            (allow "Install unknown apps" for your browser when asked). The app connects to
            https://buildplay.fun — sign in as a guest and play.
          prerelease: true
          make_latest: false
          files: Playroom.apk

  ios-portal:
    name: GamePortal iOS portal (simulator build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build for the iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project frontends/ios-game-portal/GamePortal.xcodeproj \
            -scheme GamePortal \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-portal-build" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Zip the simulator app
        run: |
          cd "$GITHUB_WORKSPACE/ios-portal-build/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent GamePortal.app "$GITHUB_WORKSPACE/GamePortal-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: GamePortal-ios-simulator
          path: GamePortal-simulator.zip
          retention-days: 90
