name: Portal apps
on:
  workflow_dispatch:
    inputs:
      ios_runner:
        description: Simulator runner (distribution uses the Xcode 27 runner)
        type: choice
        required: true
        default: macos-26-intel
        options: [macos-26-intel]
  push:
    branches: [main]
    paths: ['frontends/portal/**', '.github/workflows/portal-apps.yml', 'tests/fixtures/declarative/connect4-native-package.json', 'tests/performance/**']

jobs:
  shared-client:
    name: Shared portal checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android-portal:
    name: BuildPlay Android (standalone APK)
    runs-on: ubuntu-latest
    needs: shared-client
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BUILDPLAY_VARIANT: debug
      EXPO_PUBLIC_API_URL: https://buildplay.fun
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontends/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/portal/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - run: npm ci
      - name: Prepare optional Android push configuration
        env:
          BUILDPLAY_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: node scripts/configure-notification-build.mjs
      - run: npx expo prebuild --platform android --no-install --no-clean
      - name: Build APK with embedded JavaScript
        run: |
          set -o pipefail
          bash android/gradlew --project-dir android --no-daemon --max-workers=2 \
            -Pandroid.enableMinifyInReleaseBuilds=false :app:assembleRelease \
            2>&1 | tee "$GITHUB_WORKSPACE/buildplay-build.log"
          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/BuildPlay.apk"
      - name: Check Android release size
        env:
          BUILDPLAY_PERF_PLATFORM: android
          BUILDPLAY_PERF_INPUT: ${{ github.workspace }}/BuildPlay.apk
        run: node --test "$GITHUB_WORKSPACE/tests/performance/release-size.test.mjs"
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test native file storage and launch standalone app
        env:
          BUILDPLAY_PERF_PLATFORM: android
          BUILDPLAY_PERF_INPUT: ${{ github.workspace }}/android-test-results/first-draw.json
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          working-directory: frontends/portal
          script: |
            bash android/gradlew --project-dir android --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64 :legacy-portal:connectedDebugAndroidTest
            bash scripts/smoke-android.sh "$GITHUB_WORKSPACE/BuildPlay.apk" "$GITHUB_WORKSPACE/android-test-results"
            python3 "$GITHUB_WORKSPACE/tests/performance/measure-android-first-draw.py" --serial "${ANDROID_SERIAL:-emulator-5554}" "$BUILDPLAY_PERF_INPUT"
            node --test "$GITHUB_WORKSPACE/tests/performance/cold-startup.test.mjs"
            adb shell svc wifi disable
            adb shell svc data disable
            python3 scripts/native-smoke.py fun.buildplay.debug "$GITHUB_WORKSPACE/android-test-results"
            if [[ -n "${BUILDPLAY_GOOGLE_SERVICES_FILE:-}" ]]; then bash scripts/verify-native-analytics.sh android "$GITHUB_WORKSPACE/BuildPlay.apk" "${ANDROID_SERIAL:-emulator-5554}" "$GITHUB_WORKSPACE/android-test-results/analytics.json"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildPlay-android-test-results
          path: |
            android-test-results/
            frontends/portal/modules/legacy-portal/android/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildPlay-gradle-logs
          path: buildplay-build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildPlay-android-apk
          path: BuildPlay.apk
          if-no-files-found: warn
          retention-days: 90
  android-publish:
    name: Update rolling APK download
    needs: android-portal
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: portal-apps-android-download
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: BuildPlay-android-apk
          path: android-publish-input
      - name: Publish without replacing a newer source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish-android-apk.py android-publish-input/BuildPlay.apk \
            --source '${{ github.sha }}' --repo '${{ github.repository }}'

  ios-portal:
    # Expo's Swift dependencies also fail under macOS15's older Xcode26.3.
    name: BuildPlay iOS (simulator build)
    needs: shared-client
    runs-on: ${{ inputs.ios_runner || 'macos-26-intel' }}
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://buildplay.fun
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontends/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/portal/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install --no-clean
      - working-directory: frontends/portal/ios
        run: pod install
      - name: Prepare app-target simulator entitlement sections
        run: |
          python3 scripts/prepare-ios-simulator-entitlements.py \
            "$GITHUB_WORKSPACE/ios-simulator-entitlements" edu.columbia.gameportal.starter
          node scripts/configure-ios-simulator-entitlements.js \
            ios/BuildPlay.xcodeproj/project.pbxproj "$GITHUB_WORKSPACE/ios-simulator-entitlements"
      - name: Build standalone simulator app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ios-build-results"
          set -o pipefail
          xcodebuild -workspace ios/BuildPlay.xcworkspace -scheme BuildPlay \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-portal-build" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/ios-build-results/build.log"
      - name: Check bundle metadata and embedded JavaScript
        run: |
          app="$GITHUB_WORKSPACE/ios-portal-build/Build/Products/Release-iphonesimulator/BuildPlay.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = BuildPlay
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = edu.columbia.gameportal.starter
          test "$(/usr/libexec/PlistBuddy -c 'Print :FIREBASE_ANALYTICS_COLLECTION_ENABLED' "$app/Info.plist")" = false
          grep -aFq 'FIRAnalytics' "$app/BuildPlay"
          test -f "$app/main.jsbundle"
          python3 scripts/sign-ios-simulator.py "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$GITHUB_WORKSPACE/BuildPlay-simulator.zip"
      - name: Check iOS release size
        env:
          BUILDPLAY_PERF_PLATFORM: ios
          BUILDPLAY_PERF_INPUT: ${{ github.workspace }}/BuildPlay-simulator.zip
        run: node --test "$GITHUB_WORKSPACE/tests/performance/release-size.test.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildPlay-ios-simulator
          path: BuildPlay-simulator.zip
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildPlay-ios-build-results
          path: ios-build-results/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  ios-smoke:
    name: BuildPlay iOS (simulator launch)
    needs: ios-portal
    runs-on: ${{ inputs.ios_runner || 'macos-26-intel' }}
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontends/portal
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@v4
        with:
          name: BuildPlay-ios-simulator
          path: ios-smoke-input
      - name: Unpack compiled simulator app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ios-smoke-app" "$GITHUB_WORKSPACE/ios-smoke-results"
          ditto -x -k "$GITHUB_WORKSPACE/ios-smoke-input/BuildPlay-simulator.zip" "$GITHUB_WORKSPACE/ios-smoke-app"
          test -f "$GITHUB_WORKSPACE/ios-smoke-app/BuildPlay.app/main.jsbundle"
      - name: Prepare Xcode and simulator runtime caches
        timeout-minutes: 15
        run: |
          set -o pipefail
          date -u '+%Y-%m-%dT%H:%M:%SZ preparing Xcode first launch' | tee "$GITHUB_WORKSPACE/ios-smoke-results/prewarm.log"
          { time sudo xcodebuild -runFirstLaunch; } 2>&1 | tee -a "$GITHUB_WORKSPACE/ios-smoke-results/prewarm.log"
          date -u '+%Y-%m-%dT%H:%M:%SZ updating simulator runtime dyld caches' | tee -a "$GITHUB_WORKSPACE/ios-smoke-results/prewarm.log"
          { time xcrun simctl runtime dyld_shared_cache update --all; } 2>&1 | tee -a "$GITHUB_WORKSPACE/ios-smoke-results/prewarm.log"
          date -u '+%Y-%m-%dT%H:%M:%SZ simulator runtime caches ready' | tee -a "$GITHUB_WORKSPACE/ios-smoke-results/prewarm.log"
      - name: Launch simulator and capture screen
        timeout-minutes: 30
        run: |
          bash scripts/smoke-ios-simulator.sh \
            "$GITHUB_WORKSPACE/ios-smoke-app/BuildPlay.app" \
            "$GITHUB_WORKSPACE/ios-smoke-results"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/portal/package-lock.json
      - run: npm ci
      - name: Verify Firebase sign-in, screen change and sign-out on the simulator
        run: |
          bash scripts/verify-native-analytics.sh ios "$GITHUB_WORKSPACE/ios-smoke-app/BuildPlay.app" \
            "$(cat "$GITHUB_WORKSPACE/ios-smoke-results/simulator.udid")" "$GITHUB_WORKSPACE/ios-smoke-results/analytics.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildPlay-ios-test-results
          path: ios-smoke-results/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildPlay-ios-screenshots
          path: ios-smoke-results/screenshots/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  ios-testflight:
    name: BuildPlay iOS (TestFlight upload)
    if: vars.TESTFLIGHT_ENABLED == 'true' && vars.IOS_PORTAL_BUNDLE_ID != '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: ios-smoke
    # Expo SDK 58's recommended Xcode 27.1 toolchain satisfies Apple's
    # iOS 27 SDK requirement for App Store Connect uploads from April 2027.
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      IOS_PORTAL_BUNDLE_ID: ${{ vars.IOS_PORTAL_BUNDLE_ID }}
      EXPO_PUBLIC_API_URL: https://buildplay.fun
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      BUILDPLAY_IOS_PUSH_ENABLED: ${{ vars.IOS_PUSH_ENABLED == 'true' && '1' || '0' }}
    defaults:
      run:
        working-directory: frontends/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/portal/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Record distribution toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Configure the production Firebase iOS client
        env:
          BUILDPLAY_IOS_GOOGLE_SERVICES_PLIST: ${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}
        run: python3 scripts/configure-ios-analytics.py
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install --no-clean
      - working-directory: frontends/portal/ios
        run: pod install
      - name: Write existing App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Archive for distribution
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace ios/BuildPlay.xcworkspace -scheme BuildPlay \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/BuildPlay.xcarchive" \
            CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" archive
          archive_app="$GITHUB_WORKSPACE/BuildPlay.xcarchive/Products/Applications/BuildPlay.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$archive_app/Info.plist")" = "$IOS_PORTAL_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$archive_app/BuildPlayFirebase.plist")" = "$IOS_PORTAL_BUNDLE_ID"
          test ! -e "$archive_app/GoogleService-Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :FIREBASE_ANALYTICS_COLLECTION_ENABLED' "$archive_app/Info.plist")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$archive_app/Info.plist")" = "${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          python3 "$GITHUB_WORKSPACE/scripts/verify-ios-distribution-sdk.py" "$archive_app"
      - name: Export IPA with existing cloud signing access
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$GITHUB_WORKSPACE/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          <key>signingStyle</key><string>automatic</string>
          <key>stripSwiftSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$GITHUB_WORKSPACE/BuildPlay.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/export" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ipa=$(python3 -c 'import glob, os; paths = glob.glob(os.environ["GITHUB_WORKSPACE"] + "/export/*.ipa"); assert len(paths) == 1; print(paths[0])')
          test -n "$ipa"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
