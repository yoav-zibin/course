# Unit tests + Playwright UI tests on every push/PR; deploys to the Google Cloud VM
# when both pass on a push to main.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portal-web:
    name: Shared portal and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the shared device storage API
        run: python3 scripts/check-device-storage.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/portal/package-lock.json
      - run: npm --prefix frontends/portal ci
      - run: npm run typecheck:portal
      - run: npm run test:portal
      - run: npm run build:portal
      - run: tar -czf portal-web.tar.gz -C static app
      - uses: actions/upload-artifact@v4
        with:
          name: BuildPlay-web
          path: portal-web.tar.gz

  production-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: game_platform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: game_platform/requirements.txt
      - run: pip install -r game_platform/requirements.txt
      - run: python -c "import game_platform.main"

  unit-tests:
    needs: portal-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The code imports itself as `game_platform`, so check it out under that name.
          path: game_platform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: game_platform/requirements*.txt
      - run: pip install -r game_platform/requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: BuildPlay-web
          path: game_platform
      - run: tar -xzf game_platform/portal-web.tar.gz -C game_platform/static
      - run: python -m pytest game_platform/tests

  ui-tests:
    needs: portal-web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: game_platform
    steps:
      - uses: actions/checkout@v4
        with:
          path: game_platform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: game_platform/requirements*.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game_platform/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: BuildPlay-web
          path: game_platform
      - run: tar -xzf portal-web.tar.gz -C static
      - run: node --test tests/web/*.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Check web cold time to first draw
        env:
          BUILDPLAY_PERF_PLATFORM: web
          BUILDPLAY_PERF_INPUT: ${{ runner.temp }}/web-first-draw.json
        run: |
          node tests/performance/measure-web-first-draw.mjs "$BUILDPLAY_PERF_INPUT"
          node --test tests/performance/cold-startup.test.mjs
      - run: npx playwright test -c frontends/portal/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: game_platform/playwright-report/
          retention-days: 14

  deploy:
    needs: [unit-tests, ui-tests, production-runtime]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BuildPlay-web
      - name: Check the tested revision is still main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping a superseded deployment."
          fi
      - name: Deploy over SSH
        if: steps.revision.outputs.current == 'true'
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_SSH_KEY: ${{ secrets.GCP_VM_SSH_KEY }}
          VM_DEPLOY_COMMAND: ${{ secrets.GCP_VM_DEPLOY_COMMAND }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_deploy portal-web.tar.gz "$VM_USER@$VM_HOST:/tmp/buildplay-web-$GITHUB_SHA.tar.gz"
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" \
            "sudo mkdir -p /opt/game-platform/web-builds/$GITHUB_SHA && sudo tar -xzf /tmp/buildplay-web-$GITHUB_SHA.tar.gz -C /opt/game-platform/web-builds/$GITHUB_SHA && if [ -d /opt/game-platform/game_platform/static/app ] && [ ! -L /opt/game-platform/game_platform/static/app ]; then sudo mv /opt/game-platform/game_platform/static/app /opt/game-platform/web-builds/$GITHUB_SHA/previous-app; fi && sudo ln -sfnT /opt/game-platform/web-builds/$GITHUB_SHA/app /opt/game-platform/game_platform/static/app"
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" "$VM_DEPLOY_COMMAND"
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" \
            "test \"\$(sudo git -C /opt/game-platform/game_platform rev-parse HEAD)\" = \"$GITHUB_SHA\""
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" \
            "sudo ln -sfnT /opt/game-platform/web-builds/$GITHUB_SHA/app /opt/game-platform/game_platform/static/app && rm -f /tmp/buildplay-web-$GITHUB_SHA.tar.gz"
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" \
            "sudo bash /opt/game-platform/game_platform/deploy/install-account-deletion-timer.sh"
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" \
            "sudo bash /opt/game-platform/game_platform/deploy/install-invite-code-timer.sh"
      - name: Verify deployed service health
        if: steps.revision.outputs.current == 'true'
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          # First startup includes a bounded99-version Firestore recovery.
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl --fail --silent --show-error --max-time 10 https://buildplay.fun/health && \
               curl --fail --silent --show-error --max-time 10 https://buildplay.fun/portal | grep -q '/static/app/_expo/static/js/web/'; then
              curl --fail --silent --show-error --max-time 10 https://buildplay.fun/static/app/entry.json -o /tmp/buildplay-live-entry.json
              curl --fail --silent --show-error --max-time 10 https://buildplay.fun/static/app/version.json -o /tmp/buildplay-live-version.json
              python3 -c 'import json, os; assert json.load(open("/tmp/buildplay-live-version.json"))["commit"] == os.environ["EXPECTED_REVISION"]'
              asset=$(python3 -c 'import json; print(json.load(open("/tmp/buildplay-live-entry.json"))["scripts"][0])')
              case "$asset" in /static/app/_expo/static/js/web/*.js) ;; *) exit 1 ;; esac
              curl --fail --silent --show-error --max-time 30 "https://buildplay.fun$asset" -o /dev/null
              exit 0
            fi
            sleep 5
          done
          # Narrow startup diagnostics: no config, credentials or user records.
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" 'sudo systemctl is-active game-platform.service; sudo journalctl -u game-platform.service --since "5 minutes ago" --no-pager | grep -E "missing required game_schemas|Backfill these versions|ModuleNotFoundError|ImportError|Address already in use" | tail -n 3' || true
          exit 1

      - name: Keep production configuration readable on the VM
        if: steps.revision.outputs.current == 'true'
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" '
            set -eu
            config=/opt/game-platform/config.json
            test "$(sudo stat -c "%F:%u" -- "$config")" = "regular file:0"
            sudo chmod 0644 -- "$config"
          '

      - name: Report audited-game publication results
        if: steps.revision.outputs.current == 'true'
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" 'sudo journalctl -u game-platform.service --since "5 minutes ago" --no-pager | grep -E "audit-batch6:|legacy-schema-recovery:|catalog-deduplication:" | tail -n 105; if sudo test -f /var/log/game-platform/server.log; then sudo grep -E "audit-batch6:|legacy-schema-recovery:|catalog-deduplication:" /var/log/game-platform/server.log | tail -n 105; fi'

      - name: Apply the reviewed game catalog update
        if: steps.revision.outputs.current == 'true'
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" 'cd /opt/game-platform &&
            sudo bash -c "test -f release-state/game-alternative-names-v1 ||
              (.venv/bin/python -m game_platform.tools.game_alternative_names --config config.json &&
               touch release-state/game-alternative-names-v1)"'

      - name: Verify the master password and delete the retired admin key
        if: steps.revision.outputs.current == 'true'
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" 'sudo python3 -' <<'PY'
          import base64
          import http.client
          import json
          from pathlib import Path

          key_file = Path("/opt/game-platform/admin-api-key")
          if not key_file.exists():
              raise SystemExit(0)

          master = json.loads(Path("/opt/game-platform/config.json").read_text()).get("master_password")
          if not master:
              raise SystemExit("Production master password is missing")

          def admin_status(password):
              credential = base64.b64encode(("deployment:" + password).encode()).decode()
              connection = http.client.HTTPSConnection("buildplay.fun", timeout=15)
              try:
                  connection.request("GET", "/admin/bug-reports?limit=1",
                                     headers={"Authorization": "Basic " + credential})
                  return connection.getresponse().status
              finally:
                  connection.close()

          if admin_status(master) != 200:
              raise SystemExit("Production admin API rejected the master password")
          if admin_status(key_file.read_text().strip()) != 401:
              raise SystemExit("Production admin API did not reject the retired key")
          key_file.unlink()
          PY
