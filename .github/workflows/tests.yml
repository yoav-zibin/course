# Runs the backend tests on every push and pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This repository is the game_platform package, and the tests import it by
          # that name, so check it out into a directory of that name.
          path: game_platform
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: game_platform/requirements*.txt
      - run: pip install -r game_platform/requirements-dev.txt
      - run: python -m pytest game_platform/tests
