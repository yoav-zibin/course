<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6CCXZQYVE7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6CCXZQYVE7');

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="ui.page.feedback_admin">Game platform · Feedback</title>
    <link rel="stylesheet" href="/static/common.css?v=17" />
    <link rel="stylesheet" href="/static/experiments.css?v=62" />
    <script>
      // Framed mode for the /admin tabs: hide this page's own top bar.
      if (new URLSearchParams(location.search).has("frame")) {
        document.documentElement.classList.add("framed");
      }
    </script>
    <style>
      main { flex: 1; min-height: 0; overflow: auto; padding: 0 var(--space-lg) var(--space-xl); }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-md); padding: var(--space-sm) 0; }
      .toolbar label { display: flex; align-items: center; gap: 6px; font-size: var(--font-size-sm); color: var(--color-text-secondary); }
      #error { color: var(--color-error); }
      h2 { font-size: var(--font-size-md); font-weight: 600; margin: var(--space-lg) 0 var(--space-sm); }
      .panel { background: var(--color-bg-1); border: 1px solid var(--color-border-2); border-radius: var(--radius-md); padding: var(--space-md); overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; vertical-align: top; padding: 4px var(--space-sm); border-bottom: 1px solid var(--color-border-1); }
      th { font-size: var(--font-size-xs); color: var(--color-text-tertiary); white-space: nowrap; }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      td.when { white-space: nowrap; color: var(--color-text-secondary); font-size: var(--font-size-xs); }
      td.text { min-width: 220px; max-width: 520px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .type { font: var(--font-size-xs) var(--font-mono); padding: 1px 6px; border-radius: 999px; border: 1px solid var(--color-border-2); }
      .id { display: block; font: var(--font-size-xs) var(--font-mono); color: var(--color-text-tertiary); }
      .muted { color: var(--color-text-tertiary); }
      .kind { font: var(--font-size-xs) var(--font-mono); font-weight: 600; }
      .kind-bug { color: var(--color-warn); }
      .kind-suggestion { color: var(--color-ok); }
      .kind-problem { color: var(--color-error); }
      td.status { min-width: 150px; }
      .status-by { display: block; font-size: var(--font-size-xs); color: var(--color-text-tertiary); }
      .status-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
      .status-actions button { padding: 2px 8px; font-size: var(--font-size-xs); }
      button.linklike { padding: 0; border: 0; background: none; box-shadow: none; color: var(--color-accent-hover); text-decoration: underline; cursor: pointer; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1 data-i18n="ui.app_name">Game platform</h1>
    </header>
    <main>
      <div class="toolbar">
        <button id="refresh" type="button" data-i18n="ui.action.refresh">Refresh</button>
        <label><span data-i18n="ui.admin.kind">Kind</span> <select id="filter-kind"><option value="" data-i18n="ui.admin.all">All</option><option value="bug" data-i18n="ui.admin.bugs">Bugs</option><option value="suggestion" data-i18n="ui.admin.suggestions">Suggestions</option><option value="problem" data-i18n="ui.admin.problems">Problems</option></select></label>
        <label><span data-i18n="ui.admin.about">About</span> <select id="filter-type"><option value="" data-i18n="ui.admin.all">All</option><option value="user" data-i18n="ui.admin.users">Users</option><option value="game" data-i18n="ui.admin.games">Games</option><option value="match" data-i18n="ui.admin.matches">Matches</option><option value="platform" data-i18n="ui.admin.the_platform">The platform</option></select></label>
        <label><span data-i18n="ui.admin.status">Status</span> <select id="filter-status"><option value="" data-i18n="ui.admin.all">All</option><option value="open" data-i18n="ui.admin.open" selected>Open</option><option value="reviewed" data-i18n="ui.admin.reviewed">Reviewed</option><option value="dismissed" data-i18n="ui.admin.dismissed">Dismissed</option></select></label>
        <span id="target-filter"></span>
        <span id="freshness" class="muted"></span>
        <span id="error"></span>
      </div>
      <h2><span data-i18n="ui.admin.most_reported">Most reported</span> <span class="muted" data-i18n="ui.admin.problems_only">(problems only)</span></h2>
      <div class="panel"><div id="most"></div></div>
      <h2><span data-i18n="ui.admin.feedback">Feedback</span> <span id="count" class="muted"></span></h2>
      <div class="panel"><div id="feedback"></div></div>
    </main>
    <script src="/static/common.js?v=32"></script>
    <script src="/static/i18n.js?v=6"></script>
    <script src="/static/experiments.js?v=13"></script>
    <script src="/static/feedback.js?v=3"></script>
  </body>
</html>
