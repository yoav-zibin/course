<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Game platform · Statistics</title>
    <link rel="stylesheet" href="/static/common.css?v=2" />
    <style>
      main {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 0 var(--space-lg) var(--space-xl);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: var(--space-md);
        padding: var(--space-sm) 0;
      }

      h2 {
        font-size: var(--font-size-md);
        font-weight: 600;
        margin: var(--space-lg) 0 var(--space-sm);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: var(--space-md);
      }

      .card {
        background: var(--color-bg-1);
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-md);
        padding: var(--space-md);
      }

      .card .value {
        font-size: 26px;
        font-weight: 700;
      }

      .card .label {
        font-size: var(--font-size-xs);
        color: var(--color-text-tertiary);
      }

      .panels {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: var(--space-md);
      }

      .panel {
        background: var(--color-bg-1);
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-md);
        padding: var(--space-md);
      }

      .panel h3 {
        margin: 0 0 var(--space-sm);
        font-size: var(--font-size-sm);
        color: var(--color-text-secondary);
      }

      .bars {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 90px;
      }

      .bar {
        flex: 1;
        min-height: 2px;
        background: var(--color-accent);
        border-radius: 2px 2px 0 0;
      }

      .axis {
        display: flex;
        justify-content: space-between;
        font-size: var(--font-size-xs);
        color: var(--color-text-tertiary);
        margin-top: 2px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 3px var(--space-sm);
        border-bottom: 1px solid var(--color-border-1);
      }

      th {
        font-size: var(--font-size-xs);
        color: var(--color-text-tertiary);
      }

      td.num,
      th.num {
        text-align: right;
      }

      #error {
        color: var(--color-error);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>Game platform</h1>
      <nav>
        <a href="/portal">Portal</a>
        <a href="/builder">Builder</a>
        <a href="/console">API console</a>
        <a href="/browse">Browse data</a>
        <a href="/static/gamebuilder/index.html">Game Builder</a>
        <a href="/stats" aria-current="page">Statistics</a>
        <a href="/docs">OpenAPI docs</a>
      </nav>
    </header>
    <main>
      <div class="toolbar">
        <button id="refresh">Refresh</button>
        <span id="freshness" class="muted"></span>
        <span id="error"></span>
      </div>
      <div id="content"></div>
    </main>
    <script src="/static/common.js?v=2"></script>
    <script src="/static/stats.js?v=2"></script>
  </body>
</html>
