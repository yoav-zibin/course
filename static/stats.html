<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6CCXZQYVE7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6CCXZQYVE7');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game platform · Statistics</title>
    <link rel="stylesheet" href="/static/common.css?v=8" />
    <link rel="stylesheet" href="/static/experiments.css?v=1" />
    <script>
      // Framed mode for the /admin tabs: hide this page's own top bar.
      if (new URLSearchParams(location.search).has("frame")) {
        document.documentElement.classList.add("framed");
      }
    </script>
    <style>
      main {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 0 var(--space-lg) var(--space-xl);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: var(--space-md);
        padding: var(--space-sm) 0;
      }

      h2 {
        font-size: var(--font-size-md);
        font-weight: 600;
        margin: var(--space-lg) 0 var(--space-sm);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: var(--space-md);
      }

      .card {
        background: var(--color-bg-1);
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-md);
        padding: var(--space-md);
      }

      .card .value {
        font-size: 26px;
        font-weight: 700;
      }

      .card .label {
        font-size: var(--font-size-xs);
        color: var(--color-text-tertiary);
      }

      .panels {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: var(--space-md);
      }

      .panel {
        background: var(--color-bg-1);
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-md);
        padding: var(--space-md);
      }

      .chat-detail {
        margin-top: var(--space-md);
      }

      .chat-detail:empty {
        margin-top: 0;
      }

      .chat-entry {
        border-top: 1px solid var(--color-border-2);
        padding: var(--space-sm) 0;
      }

      .chat-meta {
        color: var(--color-text-tertiary);
        font-size: var(--font-size-sm);
        margin-bottom: var(--space-xs);
      }

      .chat-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .panel h3 {
        margin: 0 0 var(--space-sm);
        font-size: var(--font-size-sm);
        color: var(--color-text-secondary);
      }

      .bars {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 90px;
      }

      .bar {
        flex: 1;
        min-height: 2px;
        background: var(--color-accent);
        border-radius: 2px 2px 0 0;
      }

      .axis {
        display: flex;
        justify-content: space-between;
        font-size: var(--font-size-xs);
        color: var(--color-text-tertiary);
        margin-top: 2px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 3px var(--space-sm);
        border-bottom: 1px solid var(--color-border-1);
      }

      th {
        font-size: var(--font-size-xs);
        color: var(--color-text-tertiary);
      }

      td.num,
      th.num {
        text-align: right;
      }

      #error {
        color: var(--color-error);
      }

      .table-scroll {
        overflow-x: auto;
      }

      .experiment-results {
        grid-template-columns: minmax(0, 1fr);
      }

      .experiment-panel {
        min-width: 0;
      }

      .experiment-manager {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: var(--space-md);
        margin-top: var(--space-md);
      }

      .experiment-manager-item {
        min-width: 0;
      }

      .experiment-form {
        display: grid;
        gap: var(--space-sm);
        padding: var(--space-md);
        background: var(--color-bg-1);
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-md);
      }

      .experiment-form label {
        display: grid;
        gap: var(--space-xs);
      }

      .experiment-form [role="status"] {
        overflow-wrap: anywhere;
      }

      .experiment-help {
        margin-top: var(--space-sm);
        padding: var(--space-sm) var(--space-md);
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-md);
      }

      .experiment-help summary {
        cursor: pointer;
        font-weight: 600;
      }

      .experiment-help ol {
        padding-left: 1.5rem;
      }

      .experiment-help li + li {
        margin-top: var(--space-xs);
      }

      .variant-actions {
        white-space: nowrap;
      }

      .delete-status {
        display: block;
        white-space: normal;
        max-width: 220px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>Game platform</h1>
      <nav>
        <a href="/portal">Portal</a>
        <a href="/builder">Builder</a>
        <a href="/admin">Admin</a>
      </nav>
    </header>
    <main>
      <div class="toolbar">
        <button id="refresh">Refresh</button>
        <span id="freshness" class="muted"></span>
        <span id="error"></span>
      </div>
      <div id="content"></div>
    </main>
    <script src="/static/common.js?v=2"></script>
    <script src="/static/experiments.js?v=1"></script>
    <script src="/static/stats.js?v=8"></script>
  </body>
</html>
