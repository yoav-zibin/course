<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6CCXZQYVE7');

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="ui.page.admin">Game platform · Admin</title>
    <link rel="stylesheet" href="/static/common.css?v=17" />
  <link rel="stylesheet" href="/static/experiments.css?v=61" />
    <style>
      html,
      body {
        height: 100%;
      }

      .admin-tabs {
        display: flex;
        gap: var(--space-xs);
        padding: var(--space-sm) var(--space-lg) 0;
        border-bottom: 1px solid var(--color-border-2);
        background: var(--color-bg-1);
        overflow-x: auto;
        flex: none;
      }

      .admin-tabs button {
        border: none;
        border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        box-shadow: none;
        background: none;
        color: var(--color-text-tertiary);
        white-space: nowrap;
      }

      .admin-tabs button[aria-selected="true"] {
        background: var(--color-bg-2);
        color: var(--color-text-primary);
        font-weight: 600;
      }

      #admin-frame-wrap {
        flex: 1;
        min-height: 0;
        display: flex;
      }

      #admin-frame-wrap iframe {
        flex: 1;
        border: 0;
        background: var(--color-bg-0);
      }

      #admin-frame-wrap .empty-note {
        margin: auto;
      }
    </style>
  </head>
  <body>
    <header class="topbar" data-app-page="admin">
      <h1 data-i18n="ui.app_name">Game platform</h1>
      <span class="spacer"></span>
      <label for="admin-skin-preview"><span data-i18n="ui.quickplay.preview_label">Preview portal UI</span> <select id="admin-skin-preview" aria-label="Preview portal UI" data-i18n-aria-label="ui.quickplay.preview_label"><option value="arcade" data-i18n="ui.portal.skin_arcade">Arcade</option><option value="dolphin-cove" data-i18n="ui.quickplay.dolphin_title">Dolphin Cove</option></select></label>
      <a id="admin-open-preview" data-i18n="ui.quickplay.preview_open" href="/static/portal.html?skin=arcade" target="_blank" rel="noopener">Open preview ↗</a>
      <span id="account-menu"></span>
    </header>
    <div class="admin-tabs" role="tablist" aria-label="Admin tools" data-i18n-aria-label="ui.admin.tools_aria">
      <button type="button" role="tab" id="tab-console" aria-selected="true" data-src="/console?frame=1" data-i18n="ui.admin.tab_console">API console</button>
      <button type="button" role="tab" id="tab-browse" aria-selected="false" data-src="/browse?frame=1" data-i18n="ui.admin.tab_browse">Browse data</button>
      <button type="button" role="tab" id="tab-stats" aria-selected="false" data-src="/stats?frame=1" data-i18n="ui.admin.tab_stats">Statistics</button>
      <button type="button" role="tab" id="tab-invites" aria-selected="false" data-src="/invites?frame=1" data-i18n="ui.admin.tab_invites">Invites</button>
      <button type="button" role="tab" id="tab-feedback" aria-selected="false" data-src="/feedback?frame=1" data-i18n="ui.admin.tab_feedback">Feedback</button>
      <button type="button" role="tab" id="tab-docs" aria-selected="false" data-src="/docs" data-i18n="ui.admin.tab_docs">API docs</button>
    </div>
    <div id="admin-frame-wrap">
      <div class="empty-note" data-i18n="ui.state.loading">Loading…</div>
    </div>
    <script src="/static/common.js?v=32"></script>
    <script src="/static/i18n.js?v=6"></script>
    <script src="/static/auth.js?v=19"></script>
<script src="/static/experiments.js?v=13"></script>
    <script src="/static/admin.js?v=4"></script>
  </body>
</html>
