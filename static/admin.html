<!doctype html>
<html lang="en">
  <head>
  <script src="/static/shared/device-storage.js?v=1"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="ui.page.admin">BuildPlay · Admin</title>
    <link rel="stylesheet" href="/static/common.css?v=22" />
    <style>
      html,
      body {
        height: 100%;
      }

      .admin-tabs {
        display: flex;
        gap: var(--space-xs);
        padding: var(--space-sm) var(--space-lg) 0;
        border-bottom: 1px solid var(--color-border-2);
        background: var(--color-bg-1);
        overflow-x: auto;
        flex: none;
      }

      #account-menu { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:var(--space-sm); min-width:0; max-width:100%; }
      #admin-identity { overflow-wrap:anywhere; }

      .admin-tabs button {
        border: none;
        border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        box-shadow: none;
        background: none;
        color: var(--color-text-tertiary);
        white-space: nowrap;
      }

      .admin-tabs button[aria-selected="true"] {
        background: var(--color-bg-2);
        color: var(--color-text-primary);
        font-weight: 600;
      }

      #admin-frame-wrap {
        flex: 1;
        min-height: 0;
        display: flex;
      }

      #admin-frame-wrap iframe {
        flex: 1;
        border: 0;
        background: var(--color-bg-0);
      }

      #admin-frame-wrap .empty-note {
        margin: auto;
      }
    </style>
  </head>
  <body>
    <header class="topbar" data-app-page="admin">
      <h1 data-i18n="ui.app_name">BuildPlay</h1>
      <span class="spacer"></span>
      <span id="account-menu"></span>
    </header>
    <div class="admin-tabs" role="tablist" aria-label="Admin tools" data-i18n-aria-label="ui.admin.tools_aria">
      <button type="button" role="tab" id="tab-console" aria-selected="true" data-src="/console?frame=1" data-i18n="ui.admin.tab_console">API console</button>
      <button type="button" role="tab" id="tab-browse" aria-selected="false" data-src="/browse?frame=1" data-i18n="ui.admin.tab_browse">Browse data</button>
      <button type="button" role="tab" id="tab-stats" aria-selected="false" data-src="/stats?frame=1" data-i18n="ui.admin.tab_stats">Statistics</button>
      <button type="button" role="tab" id="tab-students" aria-selected="false" data-src="/admin/students?frame=1" data-i18n="ui.admin.tab_students">Students leaderboard</button>
      <button type="button" role="tab" id="tab-invites" aria-selected="false" data-src="/admin/referrals?frame=1" data-i18n="ui.admin.tab_referrals">Referrals</button>
      <button type="button" role="tab" id="tab-bug-reports" aria-selected="false" data-src="/bug-reports?frame=1" data-i18n="ui.admin.tab_bug_reports">Bug reports</button>
      <button type="button" role="tab" id="tab-feedback" aria-selected="false" data-src="/feedback?frame=1" data-i18n="ui.admin.tab_legacy_feedback">Legacy feedback</button>
      <button type="button" role="tab" id="tab-docs" aria-selected="false" data-src="/docs" data-i18n="ui.admin.tab_docs">API docs</button>
    </div>
    <div id="admin-frame-wrap">
      <div class="empty-note" data-i18n="ui.state.loading">Loading…</div>
    </div>
    <script src="/static/common.js?v=42"></script>
    <script src="/static/i18n.js?v=11"></script>
    <script src="/static/auth.js?v=31"></script>
    <script defer fetchpriority="low" src="/static/analytics.js?v=5"></script>
    <script defer src="/static/admin.js?v=9"></script>
  </body>
</html>
