<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Game platform · Browse data</title>
    <link rel="stylesheet" href="/static/common.css?v=2" />
    <style>
      main {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 0 var(--space-lg) var(--space-xl);
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: var(--space-md);
        padding: var(--space-sm) 0;
        background: var(--color-bg-0);
      }

      #filter {
        width: 320px;
      }

      #freshness {
        font-size: var(--font-size-xs);
      }

      section h2 {
        display: flex;
        align-items: baseline;
        gap: var(--space-sm);
        font-size: var(--font-size-md);
        font-weight: 600;
        margin: var(--space-lg) 0 var(--space-sm);
      }

      section h2 .count {
        font-size: var(--font-size-xs);
        font-weight: 400;
        color: var(--color-text-tertiary);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--color-bg-1);
        border: 1px solid var(--color-border-2);
      }

      th,
      td {
        text-align: left;
        padding: 3px var(--space-sm);
        border-bottom: 1px solid var(--color-border-1);
        vertical-align: top;
        white-space: nowrap;
      }

      th {
        position: sticky;
        top: 41px;
        z-index: 1;
        background: var(--color-bg-2);
        font-size: var(--font-size-xs);
        font-weight: 600;
        color: var(--color-text-tertiary);
        border-bottom: 1px solid var(--color-border-3);
      }

      td.num,
      th.num {
        text-align: right;
      }

      td.wrap {
        white-space: normal;
      }

      td.time {
        font-family: var(--font-mono);
        font-size: var(--font-size-xs);
        color: var(--color-text-secondary);
      }

      tr.row {
        cursor: pointer;
      }

      tr.row:hover > td {
        background: var(--color-bg-2);
      }

      tr.row.expanded > td {
        background: var(--color-bg-3);
      }

      tr.row td:first-child::before {
        content: "▸";
        display: inline-block;
        width: 14px;
        color: var(--color-text-quaternary);
      }

      tr.row.expanded td:first-child::before {
        content: "▾";
      }

      tr.detail > td {
        background: var(--color-bg-0);
        padding: var(--space-md) var(--space-lg);
        white-space: normal;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
        gap: var(--space-lg);
      }

      .detail-title {
        font-size: var(--font-size-xs);
        font-weight: 600;
        text-transform: uppercase;
        color: var(--color-text-quaternary);
        margin-bottom: var(--space-xs);
      }

      .json {
        background: var(--color-bg-1);
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-sm);
        padding: var(--space-sm);
        max-height: 360px;
        overflow: auto;
      }

      .tag {
        display: inline-block;
        padding: 0 6px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--color-border-3);
        font-size: var(--font-size-xs);
        color: var(--color-text-secondary);
      }

      .tag.ongoing {
        color: var(--color-ok);
        border-color: currentColor;
      }

      .tag.waiting_for_players {
        color: var(--color-warn);
        border-color: currentColor;
      }

      .tag.deleted {
        color: var(--color-error);
        border-color: currentColor;
      }

      .seat.turn {
        font-weight: 700;
        text-decoration: underline;
      }

      .empty {
        padding: var(--space-md);
        color: var(--color-text-tertiary);
      }

      #error {
        color: var(--color-error);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>Game platform</h1>
      <nav>
        <a href="/portal">Portal</a>
        <a href="/builder">Builder</a>
        <a href="/console">API console</a>
        <a href="/browse" aria-current="page">Browse data</a>
        <a href="/static/gamebuilder/index.html">Game Builder</a>
        <a href="/stats">Statistics</a>
        <a href="/docs">OpenAPI docs</a>
      </nav>
    </header>
    <main>
      <div class="toolbar">
        <input id="filter" placeholder="Filter rows (any text, e.g. a name, id or status)" spellcheck="false" />
        <button id="refresh">Refresh</button>
        <label class="inline"><input type="checkbox" id="auto-refresh" /> Auto-refresh (2s)</label>
        <span id="freshness" class="muted"></span>
        <span id="error"></span>
      </div>
      <section>
        <h2>Users <span id="users-count" class="count"></span></h2>
        <div id="users"></div>
      </section>
      <section>
        <h2>Games <span id="games-count" class="count"></span></h2>
        <div id="games"></div>
      </section>
      <section>
        <h2>Matches <span id="matches-count" class="count"></span></h2>
        <div id="matches"></div>
      </section>
    </main>
    <script src="/static/common.js?v=2"></script>
    <script src="/static/browse.js?v=2"></script>
  </body>
</html>
