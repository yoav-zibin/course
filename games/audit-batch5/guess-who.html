<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#bfe9ff,#fef6d8);color:#222;padding-bottom:140px}header{position:sticky;top:0;z-index:5;background:#6c5ce7;color:#fff;padding:10px 12px;text-align:center;border-radius:0 0 16px 16px}header h1{margin:0;font-size:18px}#turn{font-size:13px;opacity:.95;margin-top:2px}#wrap{max-width:900px;margin:0 auto;padding:10px}#secretBox{background:#fff;border-radius:14px;padding:8px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);margin-bottom:10px}#secretBox .mini{width:64px;height:76px;flex:none;border-radius:10px;overflow:hidden;border:2px solid #6c5ce7}#controls{position:sticky;top:64px;z-index:4;background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.18);margin-bottom:10px}#controls select{width:100%;font-size:16px;padding:10px;border-radius:10px;border:2px solid #6c5ce7;margin-bottom:8px}.row{display:flex;gap:8px}.row button{flex:1;font-size:16px;font-weight:700;padding:12px;border-radius:12px;border:0;cursor:pointer}#ask{background:#6c5ce7;color:#fff}#guessBtn{background:#e17055;color:#fff}button:disabled{opacity:.4}#togRow{margin-top:8px;font-size:14px;display:flex;gap:8px;align-items:center;justify-content:space-between}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(min-width:700px){#grid{grid-template-columns:repeat(6,1fr)}}.card{perspective:600px;cursor:pointer;user-select:none}.inner{position:relative;width:100%;padding-top:128%;transform-style:preserve-3d;transition:transform .45s}.card.down .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;flex-direction:column}.f '22' width='16' height='60' rx='8' fill='"+hairC+"'/><rect x='72' y='22' width='16' height='60' rx='8' fill='"+hairC+"'/>"}else if(c.len==="medium"){backHair="<rect x='14' y='26' width='13' height='36' rx='6' fill='"+hairC+"'/><rect x='73' y='26' width='13' height='36' rx='6' fill='"+hairC+"'/>"}var topHair;if(c.hat){topHair="<ellipse cx='50' cy='30' rx='30' ry='12' fill='"+hairC+"'/>"}else if(c.len==="short"){topHair="<path d='M18 48 Q18 12 50 12 Q82 12 82 48 L76 40 Q74 26 50 24 Q26 26 24 40 Z' fill='"+hairC+"'/>"}else{topHair="<ellipse cx='50' cy='26' rx='32' ry='16' fill='"+hairC+"'/>"}var hat="";if(c.hat){hat="<ellipse cx='50' cy='30' rx='38' ry='9' fill='#2d3436'/><rect x='28' y='6' width='44' height='24' rx='5' fill='#e17055' stroke='#2d3436' stroke-width='2.5'/><rect x='28' y='22' width='44' height='7' fill='#fdcb6e' stroke='#2d3436' stroke-width='1.5'/>"}var beard="";if(c.be){beard="<path d='M28 56 Q30 86 50 86 Q70 86 72 56 Q70 74 50 76 Q30 74 28 56' fill='#3e2723' stroke='#211613' stroke-width='2'/>"}var gl="";if(c.gl){gl="<g><rect x='24' y='42' width='22' height='18' rx='6' fill='rgba(255,255,255,0.35)' stroke='#111' stroke-width='3.5'/><rect x='54' y='42' width='22' height='18' rx='6' fill='rgba(255,255,255,0.35)' stroke='#111' stroke-width='3.5'/><rect x='46' y='48' width='8' height='4' fill='#111'/></g>"}var ear="";if(c.ear){ear="<circle cx='19' cy='60' r='4.5' fill='#fdcb6e' stroke='#b7791f' stroke-width='2'/><circle cx='81' cy='60' r='4.5' fill='#fdcb6e' stroke='#b7791f' stroke-width='2'/>"}return "<svg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'><rect width='100' height='100' fill='"+c.shirt+"' opacity='0.22'/>"+backHair+"<rect x='30' y='78' width='40' height='22' rx='7' fill='"+c.shirt+"' stroke='rgba(0,0,0,0.25)' stroke-width='1.5'/><ellipse cx='50' cy='55' rx='30' ry='32' fill='"+c.skin+"' stroke='rgba(0,0,0,0.2)' stroke-width='1.5'/>"+topHair+"<ellipse cx='50' cy='66' rx='6.5' ry='4' fill='#a14a4a'/><circle cx='36' cy='52' r='5.5' fill='#fff'/><circle cx='64' cy='52' r='5.5' fill='#fff'/><circle cx='36' cy='53' r='3.2' fill='"+eyeC+"'/><circle cx='64' cy='53' r='3.2' fill='"+eyeC+"'/><circle cx='37' cy='52' r='1.1' fill='#fff'/><circle cx='65' cy='52' r='1.1' fill='#fff'/>"+beard+gl+ear+hat+"</svg>"}var latest=null,pending=false,flipped={},selGuess=null;var qSel=document.getElementById("q"),grid=document.getElementById("grid");QS.forEach(function(q,i){var o=document.createElement("option");o.value=i;o.textContent=q.t;qSel.appendChild(o)});CH.forEach(function(c,i){var d=document.createElement("div");d.className="card";d.id="c"+i;d.innerHTML="<div class='inner'><div class='face front'>"+pic(c)+"<div class='nm'>"+c.n+"</div></div><div class='face back'>?</div></div>";d.onclick=function(){if(latest&&latest.status==="over")return;flipped[i]=!flipped[i];paint()};grid.appendChild(d)});function paint(){CH.forEach(function(c,i){var el=document.getElementById("c"+i);el.classList.toggle("down",!!flipped[i]);el.classList.toggle("elim",!!flipped[i])})}document.getElementById("reset").onclick=function(){flipped={};paint()};function canAct(){return latest&&latest.view&&!pending&&latest.status==="ongoing"&&latest.my_player_index!=null&&latest.acting_for_player_index===latest.my_player_index}function askedQuestions(){var asked={};if(latest&&latest.view)(latest.view.hist||[]).forEach(function(h){if(h.by===latest.my_player_index&&h.q!=null)asked[h.q]=true});return asked}function canAsk(){var q=Number(qSel.value);return canAct()&&Number.isInteger(q)&&q>=0&&q<QS.length&&!askedQuestions()[q]}function syncControls(){var asked=askedQuestions();for(var i=0;i<qSel.children.length;i++){var o=qSel.children[i];o.disabled=!!asked[o.value]}var q=Number(qSel.value);if(!Number.isInteger(q)||q<0||q>=QS.length||asked[q]){var next=-1;for(var j=0;j<QS.length;j++)if(!asked[j]){next=j;break}qSel.value=next<0?"":String(next)}var en=canAct();document.getElementById("ask").disabled=!canAsk();document.getElementById("guessBtn").disabled=!en;qSel.disabled=!en||qSel.value==="";document.getElementById("confirm").disabled=!en}qSel.onchange=syncControls;function sendMove(m){if(!canAct())return;pending=true;syncControls();parent.postMessage({type:"make_move",move:m},"*")}document.getElementById("ask").onclick=function(){if(!canAsk())return;sendMove({kind:"ask",q:+qSel.value})};document.getElementById("guessBtn").onclick=function(){if(!canAct())return;selGuess=null;var g=document.getElementById("ggrid");g.innerHTML="";CH.forEach(function(c,i){var b=document.createElement("button");b.innerHTML=pic(c)+"<br>"+c.n;b.onclick=function(){selGuess=i;var all=g.querySelectorAll("button");for(var k=0;k<all.length;k++)all[k].classList.remove("sel");b.classList.add("sel")};g.appendChild(b)});document.getElementById("modal").style.display="flex"};document.getElementById("cancel").onclick=function(){document.getElementById("modal").style.display="none"};document.getElementById("confirm").onclick=function(){if(selGuess===null||selGuess===undefined)return;document.getElementById("modal").style.display="none";if(!canAct())return;sendMove({kind:"guess",idx:selGuess})};function applyAuto(view,me){if(!document.getElementById("auto").checked)return;if(me===null||me===undefined)return;view.hist.forEach(function(h){if(h.q===undefined||h.q===null)return;if(h.by!==me)return;var ans=h.ans;CH.forEach(function(c,i){if(flipped[i])return;var v=attrLocal(i,h.q);if(v!==ans)flipped[i]=true})});paint()}function attrLocal(ci,qi){var c=CH[ci],id=QS[qi].id;if(id==="gl")return !!c.gl;if(id==="hat")return !!c.hat;if(id==="be")return !!c.be;if(id==="ear")return !!c.ear;if(id==="blonde")return c.hair==="blonde";if(id==="brownH")return c.hair==="brown";if(id==="blackH")return c.hair==="black";if(id==="redH")return c.hair==="red";if(id==="grayH")return c.hair==="gray";if(id==="long")return c.len==="long";if(id==="short")return c.len==="short";if(id==="blue")return c.eye==="blue";if(id==="brownE")return c.eye==="brown";if(id==="greenE")return c.eye==="green";return false}addEventListener("message",function(e){if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;pending=false;latest=e.data;var view=latest.view,me=latest.my_player_index;if(!view){document.getElementById("turn").textContent="Waiting…";syncControls();return}var myS=(view.mySecret!==null&&view.mySecret!==undefined)?view.mySecret:0;document.getElementById("secretName").textContent=(me===null)?"? (spectating)":CH[myS].n;document.getElementById("secretPic").innerHTML=(me===null)?"":pic(CH[myS]);var hl=document.getElementById("hlist");hl.innerHTML="";if(!view.hist.length)hl.innerHTML="<i>No questions yet.</i>";view.hist.forEach(function(h){var d=document.createElement("div");var nm=(latest.players[h.by]&&latest.players[h.by].name)||("Player "+(h.by+1));if(h.q!==undefined&&h.q!==null){d.textContent=nm+": "+QS[h.q].t+" → "+(h.ans?"YES ✅":"NO ❌")}else{d.textContent=nm+" guessed "+CH[h.guess].n+(h.correct?" ✅":" ❌")}hl.appendChild(d)});applyAuto(view,me);paint();var over=latest.status==="over"||(view.winner!==null&&view.winner!==undefined);var tEl=document.getElementById("turn");if(over){var w=view.winner;tEl.textContent=(w!==null&&latest.players[w])?("🏆 "+latest.players[w].name+" wins!"):"Game over"}else{var a=latest.acting_for_player_index;if(a===null||a===undefined){tEl.textContent="Waiting…"}else{var an=(latest.players[a]&&latest.players[a].name)||("Player "+(a+1));tEl.textContent=an+"'s turn"+(a===me?" (you!)":"")}}syncControls();if(over){var w2=document.getElementById("win");w2.style.display="flex";var wn=(view.winner!==null&&latest.players[view.winner])?latest.players[view.winner].name:"?";document.getElementById("winT").textContent="🏆 "+wn+" wins!";var pics="";if(view.reveal&&view.reveal.length===2){pics="<div><div style='width:90px'>"+pic(CH[view.reveal[0]])+"</div><small>"+((latest.players[0]&&latest.players[0].name)||"P1")+": "+CH[view.reveal[0]].n+"</small></div><div><div style='width:90px'>"+pic(CH[view.reveal[1]])+"</div><small>"+((latest.players[1]&&latest.players[1].name)||"P2")+": "+CH[view.reveal[1]].n+"</small></div>"}else if(view.mySecret!==null&&view.oppSecret!==null&&view.oppSecret!==undefined){pics="<div><div style='width:90px'>"+pic(CH[view.mySecret])+"</div><small>You: "+CH[view.mySecret].n+"</small></div><div><div style='width:90px'>"+pic(CH[view.oppSecret])+"</div><small>Foe: "+CH[view.oppSecret].n+"</small></div>"}document.getElementById("winPics").innerHTML=pics;document.getElementById("winS").textContent=(view.winner===me)?"You guessed it! 🎉":"Better luck next time!"}else{document.getElementById("win").style.display="none"}});</script></body></html>
