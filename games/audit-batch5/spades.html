<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><style>body{margin:0;font-family:system-ui,sans-serif;background:#0b5d2e;color:#fff;display:flex;justify-content:center;min-height:100vh}#wrap{width:680px;max-width:96vw;padding:8px}#table{background:#178040;border:8px solid #5a3a1e;border-radius:18px;padding:8px;position:relative;min-height:640px}#topbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;background:rgba(0,0,0,.35);border-radius:8px;padding:6px 8px;margin-bottom:6px}#aimode button{border:0;border-radius:6px;padding:4px 8px;margin-left:4px;font-weight:bold;opacity:.6}#aimode button.on{opacity:1;background:gold}#center{position:relative;height:400px;background:rgba(0,0,0,.15);border-radius:12px;margin-bottom:6px;overflow:hidden}#felt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:230px;height:120px;border:2px dashed rgba(255,255,255,.35);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px}.seat{position:absolute;text-align:center;font-size:12px;width:180px;margin-left:-90px;z-index:3;pointer-events:none}.seat .nm{background:rgba(0,0,0,.55);border-radius:6px;padding:2px 6px;display:inline-block}.seat .pts{background:#fff;color:#111;border-radius:6px;padding:1px 6px;margin-top:2px;display:inline-block;font-weight:bold}#s0{left:50%;bottom:8px}#s1{left:12%;top:44%}#s2{left:50%;top:8px}#s3{left:88%;top:44%}#pile{position:absolute;left:50%;top:50%;width:0;height:0;z-index:2}.trickcard{position:absolute;width:64px;height:86px;background:#fff;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 4px 10px rgba(0,0,0,.55);border:1px solid #999;margin-left:-32px;margin-top:-43px}.trickcard small{font-size:10px;font-weight:normal;color:#333}.trickcard.win{outline:3px solid gold}.card{background:#fff;color:#111;border-radius:7px;width:52px;height:72px;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;border:2px solid #999;margin:2px;font-size:15px}.card.red{color:#c00}.card.playable{cursor:pointer}#hand{text-align:center;min-height:150px;background:rgba(0,0,0,.25);border-radius:10px;padding:6px}#counts{display:flex;justify-content:center;gap:8px;font-size:12px;margin:4px}#counts span{background:rgba(0,0,0,.4);border-radius:6px;padding:3px 8px}#msg{min-height:22px;text-align:center;font-weight:bold;margin:4px}button#newgame{padding:6px 12px;border-radius:8px;border:0;background:gold;font-weight:bold;cursor:pointer}#score{background:rgba(0,0,0,.4);border-radius:8px;padding:6px;font-size:12px;margin-top:6px;text-align:center}.overlay{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;border-radius:12px;z-index:10}.overlay div{background:#fff;color:#111;border-radius:10px;padding:16px;text-align:center}.overlay button{padding:8px 14px;border-radius:8px;border:0;background:#178040;color:#fff;font-weight:bold;margin-top:8px}</style></head><body><div id='wrap'><div id='table'><div id='topbar'><span id='tScore'></span><span id='aimode'><span id='aiLabel'></span> <button id='bRand'></button><button id='bSmart'></button></span><button id='newgame'></button></div><div id='msg' role='status' aria-live='polite'></div><div id='center'><div id='felt'></div><div id='pile'></div></div><div id='counts'></div><div id='hand'></div><div id='score'></div><div id='over' style='display:none' class='overlay'><div><h2 id='winT'></h2><p id='winP'></p><p id='again'></p></div></div></div></div><script type="application/json" id="i18n-strings">
{
"ai_label": "AI:",
"ai_random": "Random",
"ai_smart": "Smart",
"new_game": "New Game",
"center_pile": "center pile",
"play_again_hint": "Use the portal controls to start another match.",
"waiting": "Waiting",
"seat": "P{n}",
"piles_top": "Piles {list}",
"score_compact": "{name}:{count}",
"seat_piles": "{count} piles",
"wins": "{name} wins",
"tie": "Tie",
"takes_pile": "{name} takes the pile...",
"your_turn": "Your turn - play any card",
"turn_of": "{name} turn",
"with_last_pile": "{text} - {name} took last pile.",
"cards_left": "{name}: {count} left",
"piles_line": "Piles - {list}",

}
</script>
<script>

// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}

let L=null,tm=null,pending=false;const SU={S:'\u2660',H:'\u2665',D:'\u2666',C:'\u2663'};function R(r){return r==14?'A':r==13?'K':r==12?'Q':r==11?'J':''+r}function rk(c){return parseInt(c.slice(0,-1))}function st(c){return c.slice(-1)}function red(s){return s=='H'||s=='D'}function canAct(){return L&&!pending&&L.status==='ongoing'&&L.view&&!L.view.over&&L.my_player_index!=null&&L.acting_for_player_index===L.my_player_index}function send(move){if(!canAct())return;pending=true;render();parent.postMessage({type:'make_move',move:move},'*')}function mySeat(){if(!L)return 0;return L.my_player_index==null?0:L.my_player_index}function V(){return L?L.view:null}addEventListener('message',function(ev){if(ev.source!==parent||!ev.data||ev.data.type!=='state_changed')return;pending=false;applyLocale(ev.data);L=ev.data;if(tm){clearTimeout(tm);tm=null}render();if(L.status!=='ongoing')return;let v=V();if(!v||v.over)return;if(!canAct())return;if(v.pendingWin!=null&&L.acting_for_player_index===v.pendingWin){let a=L.acting_for_player_index;tm=setTimeout(function(){send({collect:true})},2000)}});function el(tag,text,cls,parent){let e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=text;if(cls)e.className=cls;if(parent)parent.appendChild(e);return e}
function pn(seat){return L.players[seat]?L.players[seat].name:t('seat',{n:seat+1})}
function staticTexts(){document.getElementById('aiLabel').textContent=t('ai_label');document.getElementById('bRand').textContent=t('ai_random');document.getElementById('bSmart').textContent=t('ai_smart');document.getElementById('newgame').textContent=t('new_game');document.getElementById('felt').textContent=t('center_pile');document.getElementById('again').textContent=t('play_again_hint')}
staticTexts();document.getElementById('msg').textContent=t('waiting');
function render(){let v=V();staticTexts();for(const id of ['bRand','bSmart','newgame'])document.getElementById(id).disabled=!canAct();document.getElementById('newgame').title=v&&v.over?t('play_again_hint'):'';if(!v){document.getElementById('msg').textContent=t('waiting');return}let me=mySeat();document.getElementById('tScore').textContent=t('piles_top',{list:v.tricksWon.map(function(n,i){return t('score_compact',{name:L.players[i].name,count:n})}).join(' | ')});document.getElementById('bRand').className=v.aiMode=='random'?'on':'';document.getElementById('bSmart').className=v.aiMode!='random'?'on':'';let c=document.getElementById('center');let olds=c.querySelectorAll('.seat');for(let i=0;i<olds.length;i++)olds[i].remove();let order=[me,(me+1)%4,(me+2)%4,(me+3)%4];let pos=['s0','s1','s2','s3'];let off={s0:[50,92],s1:[12,50],s2:[50,0],s3:[88,50]};order.forEach(function(seat,i){let d=el('div',null,'seat',c);d.id=pos[i];d.style.left=off[pos[i]][0]+'%';d.style.top=off[pos[i]][1]+'%';el('span',pn(seat),'nm',d);el('br',null,null,d);el('span',t('seat_piles',{count:v.tricksWon[seat]}),'pts',d)});let pile=document.getElementById('pile');pile.replaceChildren();document.getElementById('felt').style.display=v.trick.length?'none':(v.over?'none':'flex');let offs=[[-5,95],[-115,0],[-5,-95],[105,0]];let im={};order.forEach(function(s,i){im[s]=i});v.trick.forEach(function(p){let tc=el('div',null,'trickcard'+(v.pendingWin!=null&&p.seat===v.pendingWin?' win':''),pile);let o=offs[im[p.seat]]||[0,0];tc.style.left=o[0]+'px';tc.style.top=o[1]+'px';tc.style.color=red(st(p.card))?'#c00':'#111';el('span',R(rk(p.card))+SU[st(p.card)],null,tc);el('small',L.players[p.seat]?L.players[p.seat].name:'',null,tc)});let msg=document.getElementById('msg');if(v.over){let m=Math.max.apply(null,v.tricksWon);let w=v.tricksWon.map(function(n,i){return n==m?i:-1}).filter(function(i){return i>=0});msg.textContent=w.length==1?t('wins',{name:L.players[w[0]].name}):t('tie')}else if(v.pendingWin!=null){msg.textContent=t('takes_pile',{name:L.players[v.pendingWin].name})}else{let a=L.acting_for_player_index;let text=t('waiting');if(a!=null)text=(a==me)?t('your_turn'):t('turn_of',{name:L.players[a].name});if(a!=null&&v.lastWin!=null)text=t('with_last_pile',{text:text,name:L.players[v.lastWin].name});msg.textContent=text;}let h=document.getElementById('hand');h.replaceChildren();let my=v.hand||[];let isT=canAct()&&v.pendingWin==null;my.forEach(function(card){let d=el('span',R(rk(card))+SU[st(card)],'card'+(red(st(card))?' red':'')+(isT?' playable':''),h);if(isT)d.onclick=function(){send({card:card})}});let ob=document.getElementById('counts');ob.replaceChildren();order.slice(1).forEach(function(seat){el('span',t('cards_left',{name:pn(seat),count:v.counts[seat]}),null,ob)});document.getElementById('score').textContent=t('piles_line',{list:v.tricksWon.map(function(n,i){return t('score_spaced',{name:pn(i),count:n})}).join(' | ')});let ov=document.getElementById('over');if(v.over){ov.style.display='flex';let m=Math.max.apply(null,v.tricksWon);let w=v.tricksWon.map(function(n,i){return n==m?i:-1}).filter(function(i){return i>=0});document.getElementById('winT').textContent=w.length>1?t('tie_game'):t('wins',{name:L.players[w[0]].name});document.getElementById('winP').textContent=v.tricksWon.map(function(n,i){return t('result_item',{name:pn(i),count:n})}).join(' - ');}else ov.style.display='none'}document.getElementById('bRand').onclick=function(){send({aiMode:'random'})};document.getElementById('bSmart').onclick=function(){send({aiMode:'smart'})};document.getElementById('newgame').onclick=function(){send({newGame:true})};</script></body></html>
