<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solo Countdown</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui;text-align:center}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}#stars{font-size:48px;letter-spacing:6px;margin:16px 0;min-height:60px}button{font:inherit;font-size:19px;min-height:56px;padding:0 26px;border:1px solid #64748b;border-radius:10px;background:#25344e;color:white;cursor:pointer}button:disabled{cursor:default;opacity:.5}.rules{font-size:14px;color:#bec9dc;max-width:420px;margin:0 auto}</style></head><body><script type="application/json" id="i18n-strings">
{
 "page_title": "Solo Countdown",
 "heading": "Solo Countdown",
 "rules": "Three stars. Take one at a time until none are left.",
 "take": "Take a star ⭐",
 "complete": "Countdown complete! 🎉",
 "saving_short": "Saving…",
 "waiting": "Waiting…",
 "stars_left": "{count} stars left — take one",
 "one_star_left": "1 star left — take one",
 "server_match_over": "match over",
 "server_no_stars_left": "no stars left",
 "server_move_must_be_take_1": "move must be {take:1}"
}
</script><h1>Solo Countdown</h1><p class="rules">Three stars. Take one at a time until none are left.</p><div id="status">Waiting for the platform…</div><div id="stars"></div><button id="take">Take a star ⭐</button><script>
"use strict";
// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// A text the game's SERVER wrote (a log line, a hand name in the match state): finds its template
// among the `server_` texts of the table (the most specific that fits, each {name} standing for
// any text) and shows it in the viewer's language with the same values; any other text is
// returned as written.
const SERVER_TEMPLATES = Object.keys(SOURCE_STRINGS)
  .filter((key) => key.startsWith("server_") && SOURCE_STRINGS[key])
  .map((key) => {
    const names = [];
    let literal = 0;
    const source = SOURCE_STRINGS[key]
      .split(/\{(\w+)\}/)
      .map((piece, index) => {
        if (index % 2) { names.push(piece); return "([\\s\\S]+?)"; }
        literal += piece.length;
        return piece.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      })
      .join("");
    return { key, names, literal, pattern: new RegExp("^" + source + "$") };
  })
  .sort((a, b) => b.literal - a.literal || a.names.length - b.names.length || (a.key > b.key ? 1 : a.key === b.key ? 0 : -1));

function tx(text) {
  if (typeof text !== "string") return text;
  for (const template of SERVER_TEMPLATES) {
    const found = template.pattern.exec(text);
    if (found) {
      const params = {};
      template.names.forEach((name, index) => { if (!(name in params)) params[name] = found[index + 1]; });
      return t(template.key, params);
    }
  }
  return text;
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}
let latest=null,sentFor=-1;
function applyStaticTexts(){
 document.title=t("page_title");
 document.querySelector("h1").textContent=t("heading");
 document.querySelector(".rules").textContent=t("rules");
 $("take").textContent=t("take");
}
const $=id=>document.getElementById(id);
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function send(){if(!myTurn()||sentFor===moveCount())return;sentFor=moveCount();parent.postMessage({type:"make_move",move:{take:1}},"*");render();}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status");
 if(!v){status.textContent=t("waiting");return;}
 const row="⭐".repeat(v.stars)+"☆".repeat(Math.max(0,3-v.stars));
 $("stars").textContent=row;
 const over=latest.status==="over"||(v.winner!==null&&v.winner!==undefined);
 if(over)status.textContent=t("complete");
 else if(sentFor===moveCount())status.textContent=t("saving_short");
 else if(v.stars===1)status.textContent=t("one_star_left");
 else status.textContent=t("stars_left",{count:v.stars});
 $("take").disabled=!myTurn()||sentFor===moveCount()||over;
}
$("take").onclick=send;
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;applyLocale(e.data);applyStaticTexts();latest=e.data;render();});
</script></body></html>
