<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nine Stars</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}#stars{font-size:40px;letter-spacing:4px;margin:16px 0;min-height:52px}.row{display:flex;gap:10px}button{font:inherit;min-height:52px;padding:0 22px;border:1px solid #64748b;border-radius:8px;background:#25344e;color:white;cursor:pointer}button:disabled{cursor:default;opacity:.5}.rules{font-size:14px;color:#bec9dc;max-width:420px}</style></head><body><h1>Nine Stars</h1><p class="rules">Nine stars on the table. On your turn take 1 or 2 stars. Whoever takes the last star wins.</p><div id="status">Waiting for the platform…</div><div id="stars"></div><div class="row"><button id="take1">Take 1 ⭐</button><button id="take2">Take 2 ⭐⭐</button></div><script>
"use strict";
let latest=null,sentFor=-1;
const $=id=>document.getElementById(id);
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function send(take){if(!myTurn()||sentFor===moveCount())return;sentFor=moveCount();parent.postMessage({type:"make_move",move:{take}},"*");render();}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status");
 const name=i=>(latest.players&&latest.players[i]&&latest.players[i].name)||("Player "+(i+1));
 const nameById=id=>{const p=(latest.players||[]).find(p=>p.id===id);return p?p.name:"A player";};
 if(!v){status.textContent="Waiting…";return;}
 $("stars").textContent="⭐".repeat(v.stars);
 const over=latest.status==="over"||v.winnerId!==null&&v.winnerId!==undefined;
 if(over)status.textContent=nameById(v.winnerId)+" took the last star and wins! 🏆";
 else if(sentFor===moveCount())status.textContent="Saving move…";
 else if(myTurn())status.textContent=name(latest.acting_for_player_index)+" — your turn";
 else{const t=latest.turn_of_player_indices||latest.turn;status.textContent=t&&t.length?("Waiting for "+t.map(name).join(", ")):"Waiting…";}
 const can=myTurn()&&sentFor!==moveCount()&&!over;
 $("take1").disabled=!can||v.stars<1;
 $("take2").disabled=!can||v.stars<2;
}
$("take1").onclick=()=>send(1);$("take2").onclick=()=>send(2);
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;latest=e.data;render();});
</script></body></html>
