<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gomoku</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}.board{display:grid;grid-template-columns:repeat(15,26px);gap:2px}button.cell{height:26px;border:1px solid #475569;border-radius:50%;background:#25344e;cursor:pointer;padding:0;font-size:15px;line-height:1}button.cell:disabled{cursor:default}button.cell.black{background:#0b1120;border-color:#94a3b8}button.cell.white{background:#f8fafc;border-color:#94a3b8}button.cell.win{outline:2px solid #22c55e}button.cell.last{outline:2px solid #fcd34d}.rules{font-size:14px;color:#bec9dc;max-width:430px}</style></head><body><script type="application/json" id="i18n-strings">
{
 "page_title": "Gomoku",
 "heading": "Gomoku",
 "rules": "Five stones in a row wins. Black (Player 1) plays first. Click an empty intersection to place your stone.",
 "wins": "{name} wins!",
 "draw": "Draw — the board is full!",
 "match_ended": "Match ended.",
 "cell": "Row {row}, column {column}",
 "waiting": "Waiting…",
 "saving": "Saving move…",
 "your_turn": "{name} — your turn",
 "waiting_for": "Waiting for {names}",
 "player_n": "Player {number}",
 "server_game_over": "game over",
 "server_not_seated": "not seated",
 "server_not_your_turn": "not your turn",
 "server_bad_move": "bad move",
 "server_off_board": "off board",
 "server_occupied": "occupied",
 "server_no_moves": "no moves"
}
</script><h1>Gomoku</h1><p class="rules">Five stones in a row wins. Black (Player 1) plays first. Click an empty intersection to place your stone.</p><div id="status">Waiting for the platform…</div><div class="board" id="board"></div><script>
"use strict";
// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// A text the game's SERVER wrote (a log line, a hand name in the match state): finds its template
// among the `server_` texts of the table (the most specific that fits, each {name} standing for
// any text) and shows it in the viewer's language with the same values; any other text is
// returned as written.
const SERVER_TEMPLATES = Object.keys(SOURCE_STRINGS)
  .filter((key) => key.startsWith("server_") && SOURCE_STRINGS[key])
  .map((key) => {
    const names = [];
    let literal = 0;
    const source = SOURCE_STRINGS[key]
      .split(/\{(\w+)\}/)
      .map((piece, index) => {
        if (index % 2) { names.push(piece); return "([\\s\\S]+?)"; }
        literal += piece.length;
        return piece.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      })
      .join("");
    return { key, names, literal, pattern: new RegExp("^" + source + "$") };
  })
  .sort((a, b) => b.literal - a.literal || a.names.length - b.names.length || (a.key > b.key ? 1 : a.key === b.key ? 0 : -1));

function tx(text) {
  if (typeof text !== "string") return text;
  for (const template of SERVER_TEMPLATES) {
    const found = template.pattern.exec(text);
    if (found) {
      const params = {};
      template.names.forEach((name, index) => { if (!(name in params)) params[name] = found[index + 1]; });
      return t(template.key, params);
    }
  }
  return text;
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}
let latest=null,sentFor=-1;
function applyStaticTexts(){
 document.title=t("page_title");
 document.querySelector("h1").textContent=t("heading");
 document.querySelector(".rules").textContent=t("rules");
}
const $=id=>document.getElementById(id);
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function send(cell){if(!myTurn()||sentFor===moveCount())return;sentFor=moveCount();parent.postMessage({type:"make_move",move:{cell}},"*");render();}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status"),board=$("board");
 const name=i=>(latest.players&&latest.players[i]&&latest.players[i].name)||t("player_n",{number:i+1});
 if(!v){status.textContent=t("waiting");board.replaceChildren();return;}
 if(latest.status==="over"||(v.winner!==null&&v.winner!==undefined)){
   if(v.winner===-1)status.textContent=t("draw");
   else if(typeof v.winner==="number")status.textContent=t("wins",{name:name(v.winner)});
   else status.textContent=t("match_ended");
 }else if(sentFor===moveCount())status.textContent=t("saving");
 else if(myTurn())status.textContent=t("your_turn",{name:name(latest.acting_for_player_index)});
 else{const turns=latest.turn_of_player_indices||latest.turn;status.textContent=turns&&turns.length?t("waiting_for",{names:turns.map(name).join(", ")}):t("waiting");}
 board.replaceChildren();
 const win=v.winLine||[];
 for(let i=0;i<225;i++){
   const b=document.createElement("button");
   const s=v.board[i];
   b.className="cell"+(s===1?" black":s===2?" white":"")+(win.includes(i)?" win":"")+(v.last===i?" last":"");
   b.disabled=!myTurn()||sentFor===moveCount()||s!==0;
   b.setAttribute("aria-label",t("cell",{row:Math.floor(i/15)+1,column:i%15+1}));b.onclick=()=>send(i);board.append(b);
 }
}
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;applyLocale(e.data);applyStaticTexts();latest=e.data;render();});
</script></body></html>
