<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOS</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin:0; padding:16px; background:#f6f7fb; color:#1e2430; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:520px; background:#fff; border-radius:16px; padding:16px 16px 18px; box-shadow:0 6px 24px rgba(0,0,0,.08); }
  h2 { margin:0 0 2px; letter-spacing:.5px; }
  .sub { margin:0 0 10px; color:#667085; font-size:13px; }
  #status { font-weight:700; background:#eef2ff; border:1px solid #dbe2ff; padding:8px 10px; border-radius:10px; min-height:38px; display:flex; align-items:center; }
  .scores { display:flex; gap:8px; margin:10px 0; }
  .score { flex:1; border:2px solid #e5e7eb; border-radius:12px; padding:8px; text-align:center; }
  .score.active { border-color:#4f46e5; background:#eef2ff; }
  .score .nm { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .score .pt { font-size:22px; font-weight:800; }
  .controls { display:flex; gap:8px; align-items:center; margin:6px 0 10px; }
  .letters { display:flex; gap:8px; }
  .letters button { width:52px; height:44px; font-size:20px; font-weight:800; border-radius:10px; border:2px solid #d1d5db; background:#fff; cursor:pointer; }
  .letters button.sel-S { border-color:#0ea5e9; background:#e0f2fe; }
  .letters button.sel-O { border-color:#f59e0b; background:#fef3c7; }
  .letters button:disabled { opacity:.45; cursor:default; }
  .hint { font-size:12px; color:#667085; }
  #board { display:grid; gap:6px; margin-top:4px; }
  .cell { aspect-ratio:1/1; font-size:clamp(18px,5.5vw,28px); font-weight:800; border-radius:10px; border:2px solid #e5e7eb; background:#f8fafc; cursor:pointer; transition:transform .05s; }
  .cell:not(:disabled):hover { transform:scale(1.04); border-color:#4f46e5; background:#fff; }
  .cell:disabled { cursor:default; }
  .cell.filled-S { background:#e0f2fe; border-color:#7dd3fc; color:#0369a1; }
  .cell.filled-O { background:#fef3c7; border-color:#fcd34d; color:#92400e; }
  .cell.win { background:#bbf7d0 !important; border-color:#22c55e !important; color:#14532d !important; }
  .cell.last { outline:3px solid #4f46e5; outline-offset:-1px; }
  .rules { font-size:12px; color:#667085; margin-top:10px; line-height:1.5; }
</style>
</head>
<body><script type="application/json" id="i18n-strings">
{
 "page_title": "SOS",
 "sub": "Like Tic-Tac-Toe — make S-O-S lines in any direction to score. Scoring gives another turn!",
 "rules": "Form {pattern} horizontally, vertically or diagonally. Each new SOS = 1 point + you go again. Most points when full wins.",
 "hint_pick": "Pick a letter, then tap an empty square.",
 "hint_over": "Game over — well played!",
 "hint_computer": "Computer is moving…",
 "draw": "Draw! Scores tied.",
 "wins": "🏆 {name} wins!",
 "game_over": "Game over.",
 "waiting_other": "Waiting for another player…",
 "computer_thinking": "{name} (computer) is thinking…",
 "turn_place": "{name}'s turn — place {letter}",
 "turn_place_you": "{name} (you)'s turn — place {letter}",
 "turn_wait": "{name}'s turn…",
 "turn_wait_you": "{name} (you)'s turn…",
 "player_short": "P{number}",
 "server_unknown_player": "unknown player",
 "server_game_is_over": "game is over",
 "server_place_s_or_o_on_an_empty_square": "place S or O on an empty square",
 "server_square_out_of_bounds": "square out of bounds",
 "server_square_already_taken": "square already taken",
 "server_board_is_full": "board is full"
}
</script>
<div class="wrap">
  <h2>SOS</h2>
  <p class="sub">Like Tic-Tac-Toe — make S-O-S lines in any direction to score. Scoring gives another turn!</p>
  <div id="status">Waiting for the platform…</div>
  <div class="scores" id="scores"></div>
  <div class="controls">
    <div class="letters">
      <button id="btnS">S</button>
      <button id="btnO">O</button>
    </div>
    <div class="hint" id="turnHint">Pick a letter, then tap an empty square.</div>
  </div>
  <div id="board"></div>
  <div class="rules">Form <b>S → O → S</b> horizontally, vertically or diagonally. Each new SOS = 1 point + you go again. Most points when full wins.</div>
</div>
<script>
// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// A text the game's SERVER wrote (a log line, a hand name in the match state): finds its template
// among the `server_` texts of the table (the most specific that fits, each {name} standing for
// any text) and shows it in the viewer's language with the same values; any other text is
// returned as written.
const SERVER_TEMPLATES = Object.keys(SOURCE_STRINGS)
  .filter((key) => key.startsWith("server_") && SOURCE_STRINGS[key])
  .map((key) => {
    const names = [];
    let literal = 0;
    const source = SOURCE_STRINGS[key]
      .split(/\{(\w+)\}/)
      .map((piece, index) => {
        if (index % 2) { names.push(piece); return "([\\s\\S]+?)"; }
        literal += piece.length;
        return piece.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      })
      .join("");
    return { key, names, literal, pattern: new RegExp("^" + source + "$") };
  })
  .sort((a, b) => b.literal - a.literal || a.names.length - b.names.length || (a.key > b.key ? 1 : a.key === b.key ? 0 : -1));

function tx(text) {
  if (typeof text !== "string") return text;
  for (const template of SERVER_TEMPLATES) {
    const found = template.pattern.exec(text);
    if (found) {
      const params = {};
      template.names.forEach((name, index) => { if (!(name in params)) params[name] = found[index + 1]; });
      return t(template.key, params);
    }
  }
  return text;
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}
var N = 6;
function applyStaticTexts() {
  document.title = t("page_title");
  document.querySelector(".sub").textContent = t("sub");
  var parts = t("rules", { pattern: "" }).split("");
  var rules = document.querySelector(".rules");
  rules.replaceChildren();
  rules.append(parts[0]);
  if (parts.length > 1) {
    var bold = document.createElement("b");
    bold.textContent = "S → O → S";
    rules.append(bold, parts.slice(1).join(""));
  }
}
var CELLS = N * N;
var latest = null;
function actingSeat(){if(!latest||latest.status!=="ongoing"||!latest.turn_of_player_indices?.length)return null;const turn=latest.turn_of_player_indices[0];if(turn===latest.my_player_index)return turn;const humans=(latest.players||[]).filter(p=>p.kind==="human");if(latest.my_player_index!==null&&humans.length===1&&latest.players[turn]?.kind==="computer")return turn;return null;}
var selected = "S";
var sentForMove = -1;

var boardEl = document.getElementById("board");
boardEl.style.gridTemplateColumns = "repeat(" + N + ", 1fr)";
var statusEl = document.getElementById("status");
var scoresEl = document.getElementById("scores");
var btnS = document.getElementById("btnS");
var btnO = document.getElementById("btnO");
var hintEl = document.getElementById("turnHint");

btnS.onclick = function(){ selected = "S"; refreshLetterButtons(); render(); };
btnO.onclick = function(){ selected = "O"; refreshLetterButtons(); render(); };
function refreshLetterButtons() {
  btnS.className = selected === "S" ? "sel-S" : "";
  btnO.className = selected === "O" ? "sel-O" : "";
}
refreshLetterButtons();

function view() {
  if (!latest) return null;
  return latest.view || latest.state || null;
}
function normState(s, numPlayers) {
  var base = { board: [], scores: [], lines: [], lastMove: -1, winner: null };
  var i;
  for (i=0;i<CELLS;i++) base.board.push("");
  for (i=0;i<numPlayers;i++) base.scores.push(0);
  if (!s) return base;
  var b = (Array.isArray(s.board) && s.board.length===CELLS) ? s.board.slice() : base.board.slice();
  var sc = [];
  for (i=0;i<numPlayers;i++) sc.push((s.scores && typeof s.scores[i]==="number") ? s.scores[i] : 0);
  var ln = Array.isArray(s.lines) ? s.lines.filter(function(l){ return Array.isArray(l)&&l.length===3; }) : [];
  return { board: b, scores: sc, lines: ln, lastMove: (typeof s.lastMove==="number"?s.lastMove:-1), winner: ((typeof s.winner==="number"||s.winner===null)?s.winner:null) };
}

function doMove(idx) {
  if (!latest || latest.status !== "ongoing") return;
  var acting = actingSeat();
  if (acting === null || acting === undefined) return;
  if (sentForMove === latest.move_count) return;
  var st = normState(view(), latest.players.length);
  if (idx<0 || idx>=CELLS || st.board[idx] !== "") return;
  if (selected !== "S" && selected !== "O") return;
  sentForMove = latest.move_count;
  parent.postMessage({ type: "make_move", move: { idx: idx, letter: selected } }, "*");
  render();
}

function render() {
  if (!latest) return;
  var st = normState(view(), latest.players.length);
  var acting = actingSeat();
  var isOver = latest.status === "over";
  var canAct = !isOver && acting !== null && acting !== undefined && acting === latest.my_player_index && sentForMove !== latest.move_count;
  if (isOver) {
    if (st.winner === -1) statusEl.textContent = t("draw");
    else if (typeof st.winner === "number" && latest.players[st.winner]) statusEl.textContent = t("wins", { name: latest.players[st.winner].name });
    else statusEl.textContent = t("game_over");
  } else if (acting === null || acting === undefined) {
    statusEl.textContent = t("waiting_other");
  } else {
    var p = latest.players[acting];
    var isYou = acting === latest.my_player_index;
    if (p.kind === "computer") statusEl.textContent = t("computer_thinking", { name: p.name });
    else if (canAct) statusEl.textContent = isYou ? t("turn_place_you", { name: p.name, letter: selected }) : t("turn_place", { name: p.name, letter: selected });
    else statusEl.textContent = isYou ? t("turn_wait_you", { name: p.name }) : t("turn_wait", { name: p.name });
  }
  scoresEl.innerHTML = "";
  latest.players.forEach(function(p,i){
    var d = document.createElement("div");
    d.className = "score" + ((acting===i && !isOver) ? " active" : "");
    var nm = document.createElement("div"); nm.className = "nm";
    var marks = (p.kind==="computer"?" \uD83E\uDD16":"") + (i===latest.my_player_index?" \u2022":"");
    nm.textContent = (p.name || t("player_short", { number: i + 1 })) + marks;
    var pt = document.createElement("div"); pt.className = "pt"; pt.textContent = st.scores[i] || 0;
    d.appendChild(nm); d.appendChild(pt); scoresEl.appendChild(d);
  });
  btnS.disabled = !canAct;
  btnO.disabled = !canAct;
  refreshLetterButtons();
  var computerMoving = !canAct && acting!==null && latest.players[acting] && latest.players[acting].kind==="computer";
  hintEl.textContent = isOver ? t("hint_over") : (computerMoving ? t("hint_computer") : t("hint_pick"));
  var winSet = {};
  st.lines.forEach(function(t){ winSet[t[0]]=1; winSet[t[1]]=1; winSet[t[2]]=1; });
  boardEl.innerHTML = "";
  for (var i=0;i<CELLS;i++) {
    (function(i){
      var b = document.createElement("button");
      b.className = "cell";
      var v = st.board[i];
      b.textContent = v;
      if (v) b.classList.add(v==="S"?"filled-S":"filled-O");
      if (winSet[i]) b.classList.add("win");
      if (st.lastMove===i) b.classList.add("last");
      b.disabled = !canAct || v !== "";
      b.onclick = function(){ doMove(i); };
      boardEl.appendChild(b);
    })(i);
  }
}

addEventListener("message", function(event){
  if (event.source !== parent || !event.data || event.data.type !== "state_changed") return;
  applyLocale(event.data);
  applyStaticTexts();
  latest = event.data;
  sentForMove = -1;
  render();
});
</script>
</body>
</html>
