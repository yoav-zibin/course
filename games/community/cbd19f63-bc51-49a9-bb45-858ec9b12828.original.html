<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chutes &amp; Ladders</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:15px system-ui}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:10px 0;color:#8ee7cd}.board{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:520px}.sq{aspect-ratio:1;background:#1d2942;border-radius:4px;font-size:10px;color:#8ea0bd;padding:2px;position:relative;overflow:hidden}.sq .pcs{font-size:14px;line-height:1.1}.sq.lad{box-shadow:inset 0 0 0 2px #22c55e}.sq.chu{box-shadow:inset 0 0 0 2px #f97316}button{font:inherit;min-height:48px;padding:0 20px;border:1px solid #64748b;border-radius:8px;background:#25344e;color:white;cursor:pointer}button:disabled{cursor:default;opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}#log{font-size:13px;color:#bec9dc;max-height:110px;overflow:auto;white-space:pre-line}.rules{font-size:14px;color:#bec9dc;max-width:520px}</style></head><body><h1>Chutes &amp; Ladders</h1><p class="rules">First to square 100 wins — you need the exact spin to land on it. Green squares start a ladder 🪜, orange squares start a chute 🛝. First, everyone spins once to decide the turn order, then the last-place player picks a game piece first.</p><div id="status">Waiting for the platform…</div><div class="board" id="board"></div><div class="row" id="actions"></div><div id="log"></div><script>
"use strict";
let latest=null,sentFor=-1;
const $=id=>document.getElementById(id);
const LADDERS={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100};
const CHUTES={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78};
const PIECES=["👑","🎩","🚢","🐶","🎒","🚗"];
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function send(move){if(sentFor===moveCount())return;sentFor=moveCount();parent.postMessage({type:"make_move",move},"*");render();}
function name(i){return (latest.players&&latest.players[i]&&latest.players[i].name)||("Player "+(i+1));}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status"),board=$("board"),actions=$("actions");
 if(!v){status.textContent="Waiting…";board.replaceChildren();return;}
 const over=latest.status==="over"||(v.winner!==null&&v.winner!==undefined);
 if(over)status.textContent="🏆 "+name(v.winner)+" wins!";
 else if(v.phase==="rolloff")status.textContent="Roll-off: "+(myTurn()?"spin to decide the turn order!":"waiting for "+name((latest.turn_of_player_indices||[])[0])+" to spin")+(v.lastSpin?" · last spin: "+v.lastSpin:"");
 else if(v.phase==="select")status.textContent="Piece draft: "+(myTurn()?"pick your piece!":"waiting for a piece pick")+(v.lastSpin?"":"");
 else status.textContent=(myTurn()?name(latest.acting_for_player_index)+" — spin!":"Waiting for "+name((latest.turn_of_player_indices||[])[0])+" to spin")+(v.lastSpin?" · last spin: "+v.lastSpin:"");
 // board: rows top(100..91) to bottom(1..10), boustrophedon
 board.replaceChildren();
 const at={};
 (v.positions||[]).forEach((p,i)=>{if(p>0){(at[p]=at[p]||[]).push((v.pieces&&v.pieces[i])||"●");}});
 for(let row=9;row>=0;row--){
   const ltr=row%2===0;
   for(let k=0;k<10;k++){
     const n=row*10+(ltr?k+1:10-k);
     const d=document.createElement("div");
     d.className="sq"+(LADDERS[n]?" lad":CHUTES[n]?" chu":"");
     d.innerHTML=n+(LADDERS[n]?" 🪜":CHUTES[n]?" 🛝":"")+"<div class='pcs'>"+(at[n]?at[n].join(""):"")+"</div>";
     board.append(d);
   }
 }
 actions.replaceChildren();
 const can=myTurn()&&sentFor!==moveCount()&&!over;
 if(!over&&v.phase==="select"){
   const taken=new Set(Object.values(v.pieces||{}));
   for(const e of PIECES){
     const b=document.createElement("button");b.textContent=e;b.disabled=!can||taken.has(e);
     b.onclick=()=>send({kind:"select",emoji:e});actions.append(b);
   }
 }else if(!over){
   const b=document.createElement("button");b.textContent="🎲 Spin";b.disabled=!can;
   b.onclick=()=>send({kind:"spin"});actions.append(b);
 }
 const off=(v.positions||[]).map((p,i)=>p===0?name(i)+": start":"").filter(Boolean);
 $("log").textContent=((v.log||[]).slice(-6).join("\n"))+(off.length?"\nOff board — "+off.join(", "):"");
}
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;latest=e.data;render();});
</script></body></html>
