<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solo Countdown</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui;text-align:center}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}#stars{font-size:48px;letter-spacing:6px;margin:16px 0;min-height:60px}button{font:inherit;font-size:19px;min-height:56px;padding:0 26px;border:1px solid #64748b;border-radius:10px;background:#25344e;color:white;cursor:pointer}button:disabled{cursor:default;opacity:.5}.rules{font-size:14px;color:#bec9dc;max-width:420px;margin:0 auto}</style></head><body><h1>Solo Countdown</h1><p class="rules">Three stars. Take one at a time until none are left.</p><div id="status">Waiting for the platform…</div><div id="stars"></div><button id="take">Take a star ⭐</button><script>
"use strict";
let latest=null,sentFor=-1;
const $=id=>document.getElementById(id);
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function send(){if(!myTurn()||sentFor===moveCount())return;sentFor=moveCount();parent.postMessage({type:"make_move",move:{take:1}},"*");render();}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status");
 if(!v){status.textContent="Waiting…";return;}
 $("stars").textContent="⭐".repeat(v.stars)+"☆".repeat(Math.max(0,3-v.stars));
 const over=latest.status==="over"||(v.winner!==null&&v.winner!==undefined);
 if(over)status.textContent="Countdown complete! 🎉";
 else if(sentFor===moveCount())status.textContent="Saving…";
 else status.textContent=v.stars+" star"+(v.stars===1?"":"s")+" left — take one";
 $("take").disabled=!myTurn()||sentFor===moveCount()||over;
}
$("take").onclick=send;
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;latest=e.data;render();});
</script></body></html>
