<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chutes &amp; Ladders</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:15px system-ui}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:10px 0;color:#8ee7cd}.board{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:520px}.sq{aspect-ratio:1;background:#1d2942;border-radius:4px;font-size:10px;color:#8ea0bd;padding:2px;position:relative;overflow:hidden}.sq .pcs{font-size:14px;line-height:1.1}.sq.lad{box-shadow:inset 0 0 0 2px #22c55e}.sq.chu{box-shadow:inset 0 0 0 2px #f97316}button{font:inherit;min-height:48px;padding:0 20px;border:1px solid #64748b;border-radius:8px;background:#25344e;color:white;cursor:pointer}button:disabled{cursor:default;opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}#log{font-size:13px;color:#bec9dc;max-height:110px;overflow:auto;white-space:pre-line}.rules{font-size:14px;color:#bec9dc;max-width:520px}</style></head><body><script type="application/json" id="i18n-strings">
{
 "page_title": "Chutes & Ladders",
 "heading": "Chutes & Ladders",
 "rules": "First to square 100 wins — you need the exact spin to land on it. Green squares start a ladder 🪜, orange squares start a chute 🛝. First, everyone spins once to decide the turn order, then the last-place player picks a game piece first.",
 "waiting": "Waiting…",
 "player_n": "Player {number}",
 "wins": "🏆 {name} wins!",
 "rolloff_mine": "Roll-off: spin to decide the turn order!",
 "rolloff_wait": "Roll-off: waiting for {name} to spin",
 "select_mine": "Piece draft: pick your piece!",
 "select_wait": "Piece draft: waiting for a piece pick",
 "spin_mine": "{name} — spin!",
 "spin_wait": "Waiting for {name} to spin",
 "last_spin": "{status} · last spin: {spin}",
 "spin": "🎲 Spin",
 "start_line": "{name}: start",
 "off_board": "Off board — {players}",
 "server_not_seated": "not seated",
 "server_game_over": "game over",
 "server_spin_to_roll_off": "spin to roll off",
 "server_not_your_roll_off_turn": "not your roll-off turn",
 "server_already_rolled": "already rolled",
 "server_pick_a_piece": "pick a piece",
 "server_selection_order_error": "selection order error",
 "server_not_your_pick": "not your pick",
 "server_bad_piece": "bad piece",
 "server_piece_taken": "piece taken",
 "server_spin_on_your_turn": "spin on your turn",
 "server_not_your_turn": "not your turn",
 "server_unknown_phase": "unknown phase",
 "server_rolled_for_first_turn": "{p1} rolled {p2} for first turn",
 "server_spun_but_needs_exact_to_reach_100_stays": "{p1} {p2} spun {p3} but needs exact to reach 100 - stays on {p4}",
 "server_spun_climbs_to": "{p1} {p2} spun {p3}: {p4} climbs to {p5} ({p6})",
 "server_spun_slides_to": "{p1} {p2} spun {p3}: {p4} slides to {p5} ({p6})",
 "server_spun": "{p1} {p2} spun {p3}: {p4} -> {p5}"
}
</script><h1>Chutes &amp; Ladders</h1><p class="rules">First to square 100 wins — you need the exact spin to land on it. Green squares start a ladder 🪜, orange squares start a chute 🛝. First, everyone spins once to decide the turn order, then the last-place player picks a game piece first.</p><div id="status">Waiting for the platform…</div><div class="board" id="board"></div><div class="row" id="actions"></div><div id="log"></div><script>
"use strict";
// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// A text the game's SERVER wrote (a log line, a hand name in the match state): finds its template
// among the `server_` texts of the table (the most specific that fits, each {name} standing for
// any text) and shows it in the viewer's language with the same values; any other text is
// returned as written.
const SERVER_TEMPLATES = Object.keys(SOURCE_STRINGS)
  .filter((key) => key.startsWith("server_") && SOURCE_STRINGS[key])
  .map((key) => {
    const names = [];
    let literal = 0;
    const source = SOURCE_STRINGS[key]
      .split(/\{(\w+)\}/)
      .map((piece, index) => {
        if (index % 2) { names.push(piece); return "([\\s\\S]+?)"; }
        literal += piece.length;
        return piece.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      })
      .join("");
    return { key, names, literal, pattern: new RegExp("^" + source + "$") };
  })
  .sort((a, b) => b.literal - a.literal || a.names.length - b.names.length || (a.key > b.key ? 1 : a.key === b.key ? 0 : -1));

function tx(text) {
  if (typeof text !== "string") return text;
  for (const template of SERVER_TEMPLATES) {
    const found = template.pattern.exec(text);
    if (found) {
      const params = {};
      template.names.forEach((name, index) => { if (!(name in params)) params[name] = found[index + 1]; });
      return t(template.key, params);
    }
  }
  return text;
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}
let latest=null,sentFor=-1;
function applyStaticTexts(){
 document.title=t("page_title");
 document.querySelector("h1").textContent=t("heading");
 document.querySelector(".rules").textContent=t("rules");
}
const $=id=>document.getElementById(id);
const LADDERS={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100};
const CHUTES={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78};
const PIECES=["👑","🎩","🚢","🐶","🎒","🚗"];
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function send(move){if(sentFor===moveCount())return;sentFor=moveCount();parent.postMessage({type:"make_move",move},"*");render();}
function name(i){return (latest.players&&latest.players[i]&&latest.players[i].name)||t("player_n",{number:i+1});}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status"),board=$("board"),actions=$("actions");
 if(!v){status.textContent=t("waiting");board.replaceChildren();return;}
 const over=latest.status==="over"||(v.winner!==null&&v.winner!==undefined);
 const spinNote=text=>v.lastSpin?t("last_spin",{status:text,spin:v.lastSpin}):text;
 const turnFirst=(latest.turn_of_player_indices||[])[0];
 if(over)status.textContent=t("wins",{name:name(v.winner)});
 else if(v.phase==="rolloff")status.textContent=spinNote(myTurn()?t("rolloff_mine"):t("rolloff_wait",{name:name(turnFirst)}));
 else if(v.phase==="select")status.textContent=myTurn()?t("select_mine"):t("select_wait");
 else status.textContent=spinNote(myTurn()?t("spin_mine",{name:name(latest.acting_for_player_index)}):t("spin_wait",{name:name(turnFirst)}));
 // board: rows top(100..91) to bottom(1..10), boustrophedon
 board.replaceChildren();
 const at={};
 (v.positions||[]).forEach((p,i)=>{if(p>0){(at[p]=at[p]||[]).push((v.pieces&&v.pieces[i])||"●");}});
 for(let row=9;row>=0;row--){
   const ltr=row%2===0;
   for(let k=0;k<10;k++){
     const n=row*10+(ltr?k+1:10-k);
     const d=document.createElement("div");
     d.className="sq"+(LADDERS[n]?" lad":CHUTES[n]?" chu":"");
     d.append(n+(LADDERS[n]?" 🪜":CHUTES[n]?" 🛝":""));
     const pcs=document.createElement("div");pcs.className="pcs";pcs.textContent=at[n]?at[n].join(""):"";d.append(pcs);
     board.append(d);
   }
 }
 actions.replaceChildren();
 const can=myTurn()&&sentFor!==moveCount()&&!over;
 if(!over&&v.phase==="select"){
   const taken=new Set(Object.values(v.pieces||{}));
   for(const e of PIECES){
     const b=document.createElement("button");b.textContent=e;b.disabled=!can||taken.has(e);
     b.onclick=()=>send({kind:"select",emoji:e});actions.append(b);
   }
 }else if(!over){
   const b=document.createElement("button");b.textContent=t("spin");b.disabled=!can;
   b.onclick=()=>send({kind:"spin"});actions.append(b);
 }
 const off=(v.positions||[]).map((p,i)=>p===0?t("start_line",{name:name(i)}):"").filter(Boolean);
 let logText=(v.log||[]).slice(-6).map(tx).join("\n");
 if(off.length)logText+="\n"+t("off_board",{players:off.join(", ")});
 $("log").textContent=logText;
}
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;applyLocale(e.data);applyStaticTexts();latest=e.data;render();});
</script></body></html>
