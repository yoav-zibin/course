<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Count</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui;text-align:center}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}#stars{font-size:44px;letter-spacing:6px;margin:16px 0;min-height:56px}button{font:inherit;font-size:20px;min-height:56px;padding:0 28px;border:1px solid #64748b;border-radius:10px;background:#25344e;color:white;cursor:pointer}button:disabled{cursor:default;opacity:.5}.rules{font-size:14px;color:#bec9dc;max-width:420px;margin:0 auto}</style></head><body><script type="application/json" id="i18n-strings">
{
 "page_title": "Star Count",
 "heading": "⭐ Star Count",
 "rules": "Tap the star to add one. Reach 5 stars to finish.",
 "add": "⭐ Add a star",
 "done": "You reached 5 stars! 🎉",
 "saving_short": "Saving…",
 "waiting": "Waiting…",
 "count_status": "Count: {count} of 5 — tap to add"
}
</script><h1>⭐ Star Count</h1><p class="rules">Tap the star to add one. Reach 5 stars to finish.</p><div id="status">Waiting for the platform…</div><div id="stars"></div><button id="add">⭐ Add a star</button><script>
"use strict";
// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}
let latest=null,sentFor=-1;
function applyStaticTexts(){
 document.title=t("page_title");
 document.querySelector("h1").textContent=t("heading");
 document.querySelector(".rules").textContent=t("rules");
 $("add").textContent=t("add");
}
const $=id=>document.getElementById(id);
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function send(){if(!myTurn()||sentFor===moveCount())return;sentFor=moveCount();parent.postMessage({type:"make_move",move:{add:1}},"*");render();}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status");
 if(!v){status.textContent=t("waiting");return;}
 const row="⭐".repeat(v.count)+"☆".repeat(Math.max(0,5-v.count));
 $("stars").textContent=row;
 const over=latest.status==="over"||v.count>=5;
 if(over)status.textContent=t("done");
 else if(sentFor===moveCount())status.textContent=t("saving_short");
 else status.textContent=t("count_status",{count:v.count});
 $("add").disabled=!myTurn()||sentFor===moveCount()||over;
}
$("add").onclick=send;
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;applyLocale(e.data);applyStaticTexts();latest=e.data;render();});
</script></body></html>
