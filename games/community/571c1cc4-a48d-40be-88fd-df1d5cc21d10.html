<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIM - Strategy Game</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; min-height: 100vh; background: #0b1220; color: #eaf1ff; font-family: Arial, sans-serif; text-align: center; }
h1 { color: #7db8ff; font-size: 40px; letter-spacing: 6px; margin: 12px 0 8px; }
.subtitle, .rules { color: #9aacc8; line-height: 1.6; }
#status { margin: 24px 0; font-size: 20px; font-weight: bold; }
.pile { background: #18243a; border: 1px solid #344763; border-radius: 15px; padding: 18px; margin: 15px auto; max-width: 480px; }
.pile h3 { color: #a8d5ff; margin: 5px 0; }
.stones { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
.stone { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg,#b5dcff,#3478ce); border: 2px solid #d4eaff; cursor: pointer; }
.stone.selected { background: #ffca70; border-color: #fff0c7; transform: scale(1.1); }
button.action { padding: 12px 25px; background: #448ce0; color: white; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; }
button:disabled { opacity: 0.4; cursor: default; }
#message { color: #ffca70; min-height: 24px; margin-top: 15px; }
.rules { max-width: 480px; margin: 25px auto; font-size: 13px; }
@media (max-width: 480px) { body { padding: 12px; } .pile { padding: 12px; } .stone { width: 33px; height: 33px; } }
</style>
</head>
<body><script type="application/json" id="i18n-strings">
{
 "page_title": "NIM - Strategy Game",
 "heading": "NIM",
 "subtitle": "A classic mathematical strategy game",
 "rules": "Remove one or more stones from ONE pile per turn. The player who takes the last stone wins.",
 "player_n": "Player {number}",
 "computer_name": "{name} (Computer)",
 "submitting": "Submitting move...",
 "waiting_opponent": "Waiting for opponent...",
 "wins": "{name} wins!",
 "game_over": "Game over!",
 "your_turn": "Your turn, {name}!",
 "their_turn": "{name}'s turn",
 "waiting_players": "Waiting for players...",
 "pile": "Pile {number} — {count} stones",
 "select_n": "Select {count} stones",
 "take_n": "Take {count} stones",
 "select_stones": "Select stones",
 "server_unknown_player": "Unknown player.",
 "server_game_is_over": "Game is over.",
 "server_pick_one_of_the_piles": "Pick one of the piles.",
 "server_take_at_least_1_stone": "Take at least 1 stone.",
 "server_that_pile_only_has_stones": "That pile only has {p1} stones.",
 "server_no_moves_left": "No moves left."
}
</script>
<h1>NIM</h1>
<p class="subtitle">A classic mathematical strategy game</p>
<div id="status">Waiting for the platform...</div>
<div id="board"></div>
<div id="message"></div>
<div class="rules">Remove one or more stones from ONE pile per turn. The player who takes the last stone wins.</div>
<script>
// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// A text the game's SERVER wrote (a log line, a hand name in the match state): finds its template
// among the `server_` texts of the table (the most specific that fits, each {name} standing for
// any text) and shows it in the viewer's language with the same values; any other text is
// returned as written.
const SERVER_TEMPLATES = Object.keys(SOURCE_STRINGS)
  .filter((key) => key.startsWith("server_") && SOURCE_STRINGS[key])
  .map((key) => {
    const names = [];
    let literal = 0;
    const source = SOURCE_STRINGS[key]
      .split(/\{(\w+)\}/)
      .map((piece, index) => {
        if (index % 2) { names.push(piece); return "([\\s\\S]+?)"; }
        literal += piece.length;
        return piece.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      })
      .join("");
    return { key, names, literal, pattern: new RegExp("^" + source + "$") };
  })
  .sort((a, b) => b.literal - a.literal || a.names.length - b.names.length || (a.key > b.key ? 1 : a.key === b.key ? 0 : -1));

function tx(text) {
  if (typeof text !== "string") return text;
  for (const template of SERVER_TEMPLATES) {
    const found = template.pattern.exec(text);
    if (found) {
      const params = {};
      template.names.forEach((name, index) => { if (!(name in params)) params[name] = found[index + 1]; });
      return t(template.key, params);
    }
  }
  return text;
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}
let latest = null;
function actingSeat(){if(!latest||latest.status!=="ongoing"||!latest.turn_of_player_indices?.length)return null;const turn=latest.turn_of_player_indices[0];if(turn===latest.my_player_index)return turn;const humans=(latest.players||[]).filter(p=>p.kind==="human");if(latest.my_player_index!==null&&humans.length===1&&latest.players[turn]?.kind==="computer")return turn;return null;}
function applyStaticTexts() {
  document.title = t("page_title");
  document.querySelector("h1").textContent = t("heading");
  document.querySelector(".subtitle").textContent = t("subtitle");
  document.querySelector(".rules").textContent = t("rules");
}
let selectedPile = -1;
let selectedCount = 0;
let moveSent = false;

function getView() {
  if (latest && latest.view && Array.isArray(latest.view.piles)) return latest.view;
  return { piles: [3,5,7], winnerIndex: null };
}
function canAct() {
  return !!(latest && latest.status === "ongoing" && actingSeat() !== null && actingSeat() !== undefined && !moveSent);
}
function nameOf(i) {
  if (latest && latest.players && latest.players[i]) {
    const p = latest.players[i];
    const base = p.name || t("player_n", { number: i + 1 });
    return p.kind === "computer" ? t("computer_name", { name: base }) : base;
  }
  return t("player_n", { number: i + 1 });
}
function sendMove(pile, count) {
  if (!canAct()) return;
  moveSent = true;
  parent.postMessage({ type: "make_move", move: { pile: pile, count: count } }, "*");
  document.getElementById("message").textContent = t("submitting");
  render();
}
function render() {
  if (!latest) return;
  const view = getView();
  const status = document.getElementById("status");
  const board = document.getElementById("board");
  const humanTurn = canAct();
  const hasWinner = view.winnerIndex !== null && view.winnerIndex !== undefined;
  if (latest.status === "over" || hasWinner) {
    if (hasWinner) status.textContent = t("wins", { name: nameOf(view.winnerIndex) });
    else status.textContent = t("game_over");
  } else {
    const turns = latest.turn_of_player_indices || [];
    if (turns.length > 0) {
      const first = turns[0];
      if (actingSeat() !== null && actingSeat() !== undefined) status.textContent = t("your_turn", { name: nameOf(first) });
      else status.textContent = t("their_turn", { name: nameOf(first) });
    } else status.textContent = t("waiting_players");
  }
  board.innerHTML = "";
  view.piles.forEach((amount, pileIndex) => {
    const section = document.createElement("div");
    section.className = "pile";
    const heading = document.createElement("h3");
    heading.textContent = t("pile", { number: pileIndex + 1, count: amount });
    section.appendChild(heading);
    const stones = document.createElement("div");
    stones.className = "stones";
    for (let j = 1; j <= amount; j++) {
      const count = amount - j + 1;
      const stone = document.createElement("button");
      stone.className = "stone";
      stone.disabled = !humanTurn || amount <= 0;
      stone.setAttribute("aria-label", t("select_n", { count: count }));
      if (selectedPile === pileIndex && j > amount - selectedCount) stone.classList.add("selected");
      stone.onclick = () => { if (!canAct()) return; selectedPile = pileIndex; selectedCount = count; render(); };
      stones.appendChild(stone);
    }
    section.appendChild(stones);
    const take = document.createElement("button");
    take.className = "action";
    take.textContent = selectedPile === pileIndex ? t("take_n", { count: selectedCount }) : t("select_stones");
    take.disabled = !humanTurn || selectedPile !== pileIndex || selectedCount < 1 || selectedCount > amount;
    take.onclick = () => { if (!canAct()) return; sendMove(pileIndex, selectedCount); };
    section.appendChild(take);
    board.appendChild(section);
  });
}
window.addEventListener("message", event => {
  if (event.source !== parent) return;
  const data = event.data;
  if (!data || data.type !== "state_changed") return;
  applyLocale(data);
  applyStaticTexts();
  latest = data;
  moveSent = false;
  selectedPile = -1;
  selectedCount = 0;
  const msg = document.getElementById("message");
  if (canAct()) msg.textContent = "";
  else if (latest.status === "ongoing" && latest.turn_of_player_indices && latest.turn_of_player_indices.length) msg.textContent = t("waiting_opponent");
  else msg.textContent = "";
  render();
});
</script>
</body>
</html>
