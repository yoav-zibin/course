<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gomoku</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}.board{display:grid;grid-template-columns:repeat(15,26px);gap:2px}button.cell{height:26px;border:1px solid #475569;border-radius:50%;background:#25344e;cursor:pointer;padding:0;font-size:15px;line-height:1}button.cell:disabled{cursor:default}button.cell.black{background:#0b1120;border-color:#94a3b8}button.cell.white{background:#f8fafc;border-color:#94a3b8}button.cell.win{outline:2px solid #22c55e}button.cell.last{outline:2px solid #fcd34d}.rules{font-size:14px;color:#bec9dc;max-width:430px}</style></head><body><h1>Gomoku</h1><p class="rules">Five stones in a row wins. Black (Player 1) plays first. Click an empty intersection to place your stone.</p><div id="status">Waiting for the platform…</div><div class="board" id="board"></div><script>
"use strict";
let latest=null,sentFor=-1;
const $=id=>document.getElementById(id);
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function send(cell){if(!myTurn()||sentFor===moveCount())return;sentFor=moveCount();parent.postMessage({type:"make_move",move:{cell}},"*");render();}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status"),board=$("board");
 const name=i=>(latest.players&&latest.players[i]&&latest.players[i].name)||("Player "+(i+1));
 if(!v){status.textContent="Waiting…";board.replaceChildren();return;}
 if(latest.status==="over"||(v.winner!==null&&v.winner!==undefined)){
   if(v.winner===-1)status.textContent="Draw — the board is full!";
   else if(typeof v.winner==="number")status.textContent=name(v.winner)+" wins!";
   else status.textContent="Match ended.";
 }else if(sentFor===moveCount())status.textContent="Saving move…";
 else if(myTurn())status.textContent=name(latest.acting_for_player_index)+" — your turn";
 else{const t=latest.turn_of_player_indices||latest.turn;status.textContent=t&&t.length?("Waiting for "+t.map(name).join(", ")):"Waiting…";}
 board.replaceChildren();
 const win=v.winLine||[];
 for(let i=0;i<225;i++){
   const b=document.createElement("button");
   const s=v.board[i];
   b.className="cell"+(s===1?" black":s===2?" white":"")+(win.includes(i)?" win":"")+(v.last===i?" last":"");
   b.disabled=!myTurn()||sentFor===moveCount()||s!==0;
   b.setAttribute("aria-label","Row "+(Math.floor(i/15)+1)+", column "+(i%15+1));b.onclick=()=>send(i);board.append(b);
 }
}
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;latest=e.data;render();});
</script></body></html>
