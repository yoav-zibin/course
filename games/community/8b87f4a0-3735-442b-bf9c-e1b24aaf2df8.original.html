<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragonimo — Race to 10</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}#total{font-size:64px;font-weight:800;margin:18px 0}.row{display:flex;gap:10px}button{font:inherit;min-height:52px;padding:0 22px;border:1px solid #64748b;border-radius:8px;background:#25344e;color:white;cursor:pointer}button:disabled{cursor:default;opacity:.5}.rules{font-size:14px;color:#bec9dc;max-width:420px}</style></head><body><h1>🐉 Dragonimo</h1><p class="rules">Race to 10. On your turn, add 1 or 2 to the shared total. Whoever reaches 10 or more wins.</p><div id="status">Waiting for the platform…</div><div id="total">0</div><div class="row"><button id="add1">+1</button><button id="add2">+2</button></div><script>
"use strict";
let latest=null,sentFor=-1;
const $=id=>document.getElementById(id);
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function send(add){if(!myTurn()||sentFor===moveCount())return;sentFor=moveCount();parent.postMessage({type:"make_move",move:{add}},"*");render();}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status");
 const name=i=>(latest.players&&latest.players[i]&&latest.players[i].name)||("Player "+(i+1));
 if(!v){status.textContent="Waiting…";return;}
 $("total").textContent=v.total+" / 10";
 const over=latest.status==="over"||(v.winner!==null&&v.winner!==undefined);
 if(over)status.textContent=v.winner!==null&&v.winner!==undefined?(name(v.winner)+" wins! 🏆"):"Match ended.";
 else if(sentFor===moveCount())status.textContent="Saving move…";
 else if(myTurn())status.textContent=name(latest.acting_for_player_index)+" — your turn";
 else{const t=latest.turn_of_player_indices||latest.turn;status.textContent=t&&t.length?("Waiting for "+t.map(name).join(", ")):"Waiting…";}
 const can=myTurn()&&sentFor!==moveCount()&&!over;
 $("add1").disabled=!can;$("add2").disabled=!can;
}
$("add1").onclick=()=>send(1);$("add2").onclick=()=>send(2);
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;latest=e.data;render();});
</script></body></html>
