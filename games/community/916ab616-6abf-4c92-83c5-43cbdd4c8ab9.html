<!doctype html>
<html>
<head><meta charset="utf-8"><style>body{font-family:sans-serif;padding:16px;max-width:560px;margin:auto}table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border:1px solid #ccc;padding:4px 8px;text-align:center}input{font-size:18px;width:120px;letter-spacing:2px;text-align:center}button{font-size:15px;padding:6px 12px;margin:4px}small{color:#555}.mine{background:#f0f7ff}</style></head>
<body><script type="application/json" id="i18n-strings">
{
 "heading": "🐂 Bulls and Cows",
 "choose_secret": "Choose your secret 4-digit number:",
 "secret_hint": "4 distinct digits, first digit ≠ 0",
 "set_secret": "Set secret",
 "secret_saved": "Your secret is saved — waiting for opponent…",
 "your_number": "Your number: {value}",
 "opponent_number": "Opponent number: {value}",
 "guess_placeholder": "guess",
 "guess": "Guess",
 "my_guesses": "My guesses (their number)",
 "opponent_guesses": "Opponent guesses (my number)",
 "col_guess": "Guess",
 "win_you": "🏆 You guessed the number first — you win!",
 "win_other": "🏆 {name} guessed the number first and wins!",
 "choosing_secrets": "Choosing secret numbers… waiting for {names}.",
 "your_turn_guess": "Your turn ({name}) — guess!",
 "their_turn_guess": "{name}'s turn to guess.",
 "need_digits": "Need 4 distinct digits, first ≠ 0.",
 "invalid": "Invalid.",
 "server_unknown_player": "unknown player",
 "server_set_your_secret_number_first": "set your secret number first",
 "server_secret_already_set": "secret already set",
 "server_secret_must_be_4_distinct_digits_first_0": "secret must be 4 distinct digits, first != 0",
 "server_game_over": "game over",
 "server_send_a_guess": "send a guess",
 "server_guess_must_be_4_distinct_digits_first_0": "guess must be 4 distinct digits, first != 0",
 "server_opponent_secret_not_set": "opponent secret not set"
}
</script>
<h2>🐂 Bulls and Cows</h2>
<p id="status">Waiting…</p>
<div id="setupDiv" style="display:none">
<p>Choose your secret 4-digit number:<br><small>4 distinct digits, first digit ≠ 0</small></p>
<input id="secretInput" maxlength="4" inputmode="numeric" placeholder="1234">
<button id="secretBtn">Set secret</button>
<p id="setupErr" style="color:red"></p>
</div>
<div id="waitDiv" style="display:none"><p><i>Your secret is saved — waiting for opponent…</i></p></div>
<div id="playDiv" style="display:none">
<p>Your number: <b id="mySecret"></b> &nbsp;|&nbsp; Opponent number: <b id="oppSecret">****</b></p>
<div id="guessRow">
<input id="guessInput" maxlength="4" inputmode="numeric">
<button id="guessBtn">Guess</button>
<span id="guessErr" style="color:red"></span>
</div>
<h3>My guesses (their number)</h3>
<table id="myTable"></table>
<h3>Opponent guesses (my number)</h3>
<table id="oppTable"></table>
</div>
<script>
// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// A text the game's SERVER wrote (a log line, a hand name in the match state): finds its template
// among the `server_` texts of the table (the most specific that fits, each {name} standing for
// any text) and shows it in the viewer's language with the same values; any other text is
// returned as written.
const SERVER_TEMPLATES = Object.keys(SOURCE_STRINGS)
  .filter((key) => key.startsWith("server_") && SOURCE_STRINGS[key])
  .map((key) => {
    const names = [];
    let literal = 0;
    const source = SOURCE_STRINGS[key]
      .split(/\{(\w+)\}/)
      .map((piece, index) => {
        if (index % 2) { names.push(piece); return "([\\s\\S]+?)"; }
        literal += piece.length;
        return piece.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      })
      .join("");
    return { key, names, literal, pattern: new RegExp("^" + source + "$") };
  })
  .sort((a, b) => b.literal - a.literal || a.names.length - b.names.length || (a.key > b.key ? 1 : a.key === b.key ? 0 : -1));

function tx(text) {
  if (typeof text !== "string") return text;
  for (const template of SERVER_TEMPLATES) {
    const found = template.pattern.exec(text);
    if (found) {
      const params = {};
      template.names.forEach((name, index) => { if (!(name in params)) params[name] = found[index + 1]; });
      return t(template.key, params);
    }
  }
  return text;
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}
let L=null;
function actingSeat(){if(!L||L.status!=="ongoing"||!L.turn_of_player_indices?.length)return null;const turn=L.turn_of_player_indices[0];if(turn===L.my_player_index)return turn;const humans=(L.players||[]).filter(p=>p.kind==="human");if(L.my_player_index!==null&&humans.length===1&&L.players[turn]?.kind==="computer")return turn;return null;}
function row(cells,className,tag){
  const tr=document.createElement('tr');
  if(className)tr.className=className;
  for(const cell of cells){const td=document.createElement(tag);td.textContent=cell;tr.append(td);}
  return tr;
}
function head(table){
  const body=document.createElement('tbody');
  body.append(row(['#',t("col_guess"),'🐂','🐄'],'','th'));
  table.replaceChildren(body);
  return body;
}
function applyStaticTexts(){
  document.querySelector('h2').textContent=t("heading");
  const marker='\u0001';
  const choose=document.querySelector('#setupDiv p');
  choose.replaceChildren(t("choose_secret"),document.createElement('br'));
  const small=document.createElement('small');small.textContent=t("secret_hint");choose.append(small);
  document.getElementById('secretInput').placeholder='1234';
  document.getElementById('secretBtn').textContent=t("set_secret");
  document.querySelector('#waitDiv i').textContent=t("secret_saved");
  const mineParts=t("your_number",{value:marker}).split(marker);
  const oppParts=t("opponent_number",{value:marker}).split(marker);
  const numbers=document.querySelector('#playDiv p');
  const mineEl=document.getElementById('mySecret'),oppEl=document.getElementById('oppSecret');
  numbers.replaceChildren();
  if(mineParts[0])numbers.append(mineParts[0]);
  numbers.append(mineEl);
  numbers.append(mineParts.slice(1).join('')+'  |  '+oppParts[0]);
  numbers.append(oppEl);
  if(oppParts.slice(1).join(''))numbers.append(oppParts.slice(1).join(''));
  document.getElementById('guessInput').placeholder=t("guess_placeholder");
  document.getElementById('guessBtn').textContent=t("guess");
  const titles=document.querySelectorAll('#playDiv h3');
  titles[0].textContent=t("my_guesses");
  titles[1].textContent=t("opponent_guesses");
}
function valid(s){return /^[1-9][0-9]{3}$/.test(s)&&new Set(s).size===4;}
function sendMove(m){parent.postMessage({type:'make_move',move:m},'*');}
addEventListener('message',ev=>{
if(ev.source!==parent||!ev.data||ev.data.type!=='state_changed')return;
applyLocale(ev.data);
applyStaticTexts();
L=ev.data;
const v=L.view||{};
const me=L.my_player_index;
const acting=actingSeat();
const status=document.getElementById('status');
const setupDiv=document.getElementById('setupDiv'),playDiv=document.getElementById('playDiv'),waitDiv=document.getElementById('waitDiv');
if(L.status==='over'&&v.winner!==null&&v.winner!==undefined){
 if(v.winner===me)status.textContent=t("win_you");
 else status.textContent=t("win_other",{name:L.players[v.winner].name});
}else if(!v.phase||v.phase==='setup'){
 const who=(L.turn_of_player_indices&&L.turn_of_player_indices.length)?L.turn_of_player_indices.map(i=>L.players[i].name).join(', '):'—';
 status.textContent=t("choosing_secrets",{names:who});
}else{
 const an=acting!==null?L.players[acting].name:'—';
 if(acting===me)status.textContent=t("your_turn_guess",{name:an});
 else status.textContent=t("their_turn_guess",{name:an});
}
if(v.phase==='setup'||!v.phase){
 playDiv.style.display='none';
 const needSet = v.mySecret?false:true;
 const canAct = acting===me;
 setupDiv.style.display=(canAct&&needSet)?'block':'none';
 waitDiv.style.display=(needSet&&!canAct)||(!needSet)?'block':'none';
 if(!needSet) setupDiv.style.display='none';
 if(me===null){setupDiv.style.display='none';waitDiv.style.display='none';}
}else{
 setupDiv.style.display='none';waitDiv.style.display='none';playDiv.style.display='block';
 document.getElementById('mySecret').textContent=v.mySecret||'****';
 document.getElementById('oppSecret').textContent=v.oppSecret||'****';
 const mt=document.getElementById('myTable'),ot=document.getElementById('oppTable');
 const myBody=head(mt),oppBody=head(ot);
 (v.myGuesses||[]).forEach((g,i)=>{myBody.append(row([i+1,g,v.myFeedback[i].b,v.myFeedback[i].c],'mine','td'));});
 (v.oppGuesses||[]).forEach((g,i)=>{oppBody.append(row([i+1,g,v.oppFeedback[i].b,v.oppFeedback[i].c],'','td'));});
 const canAct=acting===me&&L.status==='ongoing';
 document.getElementById('guessInput').disabled=!canAct;
 document.getElementById('guessBtn').disabled=!canAct;
}
});
document.getElementById('secretBtn').onclick=()=>{const v=document.getElementById('secretInput').value.trim();if(!valid(v)){document.getElementById('setupErr').textContent=t("need_digits");return;}document.getElementById('setupErr').textContent='';sendMove({kind:'set_secret',secret:v});};
document.getElementById('guessBtn').onclick=()=>{const v=document.getElementById('guessInput').value.trim();if(!valid(v)){document.getElementById('guessErr').textContent=t("invalid");return;}document.getElementById('guessErr').textContent='';document.getElementById('guessInput').value='';sendMove({kind:'guess',guess:v});};
</script>
</body>
</html>
