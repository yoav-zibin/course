<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:16px;background:#1a1d24;color:#f2f3f5;display:flex;justify-content:center}
  .wrap{width:100%;max-width:560px}
  h2{margin:0 0 4px}
  .sub{opacity:.7;margin:0 0 12px;font-size:13px}
  .card{background:#262b36;border-radius:14px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #status{font-weight:700;min-height:24px;margin:0 0 10px}
  .players{display:flex;gap:8px;margin-bottom:10px}
  .p{flex:1;display:flex;align-items:center;gap:8px;background:#1c2029;border:2px solid transparent;border-radius:10px;padding:8px 10px;font-size:14px}
  .p.active{border-color:#ffb84d}
  .stone{width:22px;height:22px;border-radius:50%;flex-shrink:0}
  .stone.b{background:radial-gradient(circle at 30% 30%,#666,#000 70%);border:1px solid #000}
  .stone.w{background:radial-gradient(circle at 30% 30%,#fff,#c9c9c9 75%);border:1px solid #888}
  .p small{display:block;opacity:.65;font-weight:400}
  #boardWrap{background:#e0b25f;border-radius:10px;padding:10px;box-shadow:inset 0 0 0 2px #b9853a}
  #board{display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);aspect-ratio:1/1;background:
    linear-gradient(#a67c33,#a67c33),linear-gradient(#a67c33,#a67c33),#e0b25f;
    border-radius:6px;overflow:hidden;touch-action:manipulation}
  .cell{position:relative;border:0;background:transparent;padding:0;cursor:pointer}
  .cell::before,.cell::after{content:"";position:absolute;background:#7a5a26}
  .cell::before{left:50%;top:0;bottom:0;width:1px}
  .cell::after{top:50%;left:0;right:0;height:1px}
  .cell span.st{position:absolute;inset:8%;border-radius:50%;z-index:2;display:block}
  .cell span.st.black{background:radial-gradient(circle at 32% 30%,#6b6b6b,#0a0a0a 68%);box-shadow:0 2px 4px rgba(0,0,0,.5)}
  .cell span.st.white{background:radial-gradient(circle at 32% 30%,#fff,#c4c4c4 75%);box-shadow:0 2px 4px rgba(0,0,0,.45);border:1px solid #777}
  .cell.last span.st::after{content:"";position:absolute;left:50%;top:50%;width:34%;height:34%;transform:translate(-50%,-50%);border-radius:50%;background:#e53935}
  .cell.win span.st{outline:3px solid #e53935;outline-offset:1px}
  .cell.playable:hover::before,.cell.playable:hover::after{background:#5d441d}
  .cell.playable:hover span.preview{position:absolute;inset:12%;border-radius:50%;z-index:2;opacity:.55;display:block}
  .footer{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;opacity:.8}
  .hint{font-size:12px;opacity:.65;margin-top:8px}
</style>
</head>
<body><script type="application/json" id="i18n-strings">
{
 "heading": "⚫ Gomoku",
 "sub": "Five in a row wins. Black moves first.",
 "seat_black": "Player 1 • Black",
 "seat_white": "Player 2 • White",
 "hint": "Tap an intersection to place. Computers move automatically.",
 "cell": "row {row} col {column}",
 "black": "Black",
 "white": "White",
 "black_named": "{name} (Black)",
 "white_named": "{name} (White)",
 "move_count": "Move {count}",
 "spectating": "Spectating",
 "you_black": "You: {name} (Black)",
 "you_white": "You: {name} (White)",
 "waiting_platform": "Waiting for the platform…",
 "wins": "🏆 {name} wins with five in a row!",
 "draw": "🤝 Draw — board is full.",
 "game_over": "Game over.",
 "to_move_wait": "⏳ {name} to move",
 "waiting_other": "Waiting for another player…",
 "black_to_move": "⚫ {name} to move (Black)",
 "white_to_move": "⚪ {name} to move (White)",
 "player_n": "Player {number}"
}
</script>
<div class="wrap">
<h2>⚫ Gomoku</h2>
<p class="sub">Five in a row wins. Black moves first.</p>
<div class="card">
<p id="status">Waiting for the platform…</p>
<div class="players">
<div class="p" id="p0"><div class="stone b"></div><div><b id="n0">Black</b><small>Player 1 • Black</small></div></div>
<div class="p" id="p1"><div class="stone w"></div><div><b id="n1">White</b><small>Player 2 • White</small></div></div>
</div>
<div id="boardWrap"><div id="board"></div></div>
<div class="footer"><span id="moveInfo">Move 0</span><span id="youInfo"></span></div>
<div class="hint">Tap an intersection to place. Computers move automatically.</div>
</div>
</div>
<script>
// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// A text the game's SERVER wrote (a log line, a hand name in the match state): finds its template
// among the `server_` texts of the table (the most specific that fits, each {name} standing for
// any text) and shows it in the viewer's language with the same values; any other text is
// returned as written.
const SERVER_TEMPLATES = Object.keys(SOURCE_STRINGS)
  .filter((key) => key.startsWith("server_") && SOURCE_STRINGS[key])
  .map((key) => {
    const names = [];
    let literal = 0;
    const source = SOURCE_STRINGS[key]
      .split(/\{(\w+)\}/)
      .map((piece, index) => {
        if (index % 2) { names.push(piece); return "([\\s\\S]+?)"; }
        literal += piece.length;
        return piece.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      })
      .join("");
    return { key, names, literal, pattern: new RegExp("^" + source + "$") };
  })
  .sort((a, b) => b.literal - a.literal || a.names.length - b.names.length || (a.key > b.key ? 1 : a.key === b.key ? 0 : -1));

function tx(text) {
  if (typeof text !== "string") return text;
  for (const template of SERVER_TEMPLATES) {
    const found = template.pattern.exec(text);
    if (found) {
      const params = {};
      template.names.forEach((name, index) => { if (!(name in params)) params[name] = found[index + 1]; });
      return t(template.key, params);
    }
  }
  return text;
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}
var SIZE=15;
function applyStaticTexts(){
  document.querySelector('h2').textContent=t("heading");
  document.querySelector('.sub').textContent=t("sub");
  document.querySelector('#p0 small').textContent=t("seat_black");
  document.querySelector('#p1 small').textContent=t("seat_white");
  document.querySelector('.hint').textContent=t("hint");
}
var latest=null;
function actingSeat(){if(!latest||latest.status!=="ongoing"||!latest.turn_of_player_indices?.length)return null;const turn=latest.turn_of_player_indices[0];if(turn===latest.my_player_index)return turn;const humans=(latest.players||[]).filter(p=>p.kind==="human");if(latest.my_player_index!==null&&humans.length===1&&latest.players[turn]?.kind==="computer")return turn;return null;}
var boardEl=document.getElementById('board');
var cells=[];
for(var r=0;r<SIZE;r++){cells.push([]);for(var c=0;c<SIZE;c++){(function(rr,cc){
  var b=document.createElement('button');b.className='cell';b.setAttribute('aria-label',t("cell",{row:rr+1,column:cc+1}));
  var stoneEl=document.createElement('span');stoneEl.className='st';stoneEl.style.display='none';
  var previewEl=document.createElement('span');previewEl.className='preview';previewEl.style.display='none';
  b.append(stoneEl,previewEl);
  b.addEventListener('click',function(){tryPlace(rr,cc);});
  b.addEventListener('mouseenter',function(){preview(rr,cc,true);});
  b.addEventListener('mouseleave',function(){preview(rr,cc,false);});
  boardEl.appendChild(b);cells[rr][cc]=b;})(r,c);}}

function emptyBoard(){var b=[];for(var i=0;i<SIZE;i++){b.push([]);for(var j=0;j<SIZE;j++)b[i].push(0);}return b;}
function getView(){return (latest&&latest.view)?latest.view:{board:emptyBoard(),last:null,winner:null,winLine:null,draw:false};}
function canHumanMove(){
  if(!latest||latest.status!=='ongoing')return false;
  return actingSeat()!==null&&actingSeat()!==undefined;
}
function preview(r,c,on){
  if(!on||!canHumanMove()){if(cells[r]&&cells[r][c])cells[r][c].querySelector('.preview').style.display='none';return;}
  var s=getView();if(s.board[r][c]!==0||s.winner!==null||s.winner!==undefined&&s.winner!==null)return;
  if(s.winner!==null&&s.winner!==undefined&&s.winner!==null)return;
  var seat=actingSeat();
  var el=cells[r][c].querySelector('.preview');
  el.style.display='block';
  el.style.background=seat===0?'#111':'#fafafa';
  el.style.border=seat===0?'none':'1px solid #777';
}
function tryPlace(r,c){
  if(!canHumanMove())return;
  var s=getView();
  if(s.winner!==null&&s.winner!==undefined)return;
  if(s.draw)return;
  if(s.board[r][c]!==0)return;
  parent.postMessage({type:'make_move',move:{r:r,c:c}},'*');
}
function render(){
  var s=getView();
  var winSet={};
  if(s.winLine)for(var i=0;i<s.winLine.length;i++)winSet[s.winLine[i].r+','+s.winLine[i].c]=true;
  var playable=canHumanMove();
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
    var cell=cells[r][c];var v=s.board[r][c];
    cell.setAttribute('aria-label',t("cell",{row:r+1,column:c+1}));
    var st=cell.querySelector('.st');
    if(v===0){st.style.display='none';}
    else{st.style.display='block';st.className='st '+(v===1?'black':'white');}
    cell.classList.toggle('last',!!(s.last&&s.last.r===r&&s.last.c===c));
    cell.classList.toggle('win',!!winSet[r+','+c]);
    cell.classList.toggle('playable',playable&&v===0);
    cell.disabled=!playable||v!==0;
    if(!playable||v!==0)cell.querySelector('.preview').style.display='none';
  }
  var statusEl=document.getElementById('status');
  var p0=document.getElementById('p0'),p1=document.getElementById('p1');
  document.getElementById('n0').textContent=latest&&latest.players[0]?t("black_named",{name:latest.players[0].name}):t("black");
  document.getElementById('n1').textContent=latest&&latest.players[1]?t("white_named",{name:latest.players[1].name}):t("white");
  p0.classList.remove('active');p1.classList.remove('active');
  document.getElementById('moveInfo').textContent=t("move_count",{count:latest?latest.move_count:0});
  var you='';
  if(latest){
    if(latest.my_player_index===null||latest.my_player_index===undefined)you=t("spectating");
    else if(latest.my_player_index===0)you=t("you_black",{name:latest.players[latest.my_player_index].name});
    else you=t("you_white",{name:latest.players[latest.my_player_index].name});
  }
  document.getElementById('youInfo').textContent=you;
  if(!latest){statusEl.textContent=t("waiting_platform");return;}
  if(s.winner!==null&&s.winner!==undefined){var w=latest.players[s.winner]?latest.players[s.winner].name:t("player_n",{number:s.winner+1});statusEl.textContent=t("wins",{name:w});return;}
  if(s.draw){statusEl.textContent=t("draw");return;}
  if(latest.status==='over'){statusEl.textContent=t("game_over");return;}
  var a=actingSeat();
  if(a===null||a===undefined){var turns=latest.turn_of_player_indices;if(turns&&turns.length){var nm2=latest.players[turns[0]]?latest.players[turns[0]].name:t("player_n",{number:turns[0]+1});statusEl.textContent=t("to_move_wait",{name:nm2});if(turns[0]===0)p0.classList.add('active');else if(turns[0]===1)p1.classList.add('active');}else{statusEl.textContent=t("waiting_other");}return;}
  var nm=latest.players[a]?latest.players[a].name:t("player_n",{number:a+1});
  statusEl.textContent=a===0?t("black_to_move",{name:nm}):t("white_to_move",{name:nm});
  if(a===0)p0.classList.add('active');else p1.classList.add('active');
}
addEventListener('message',function(event){
  if(event.source!==parent||!event.data||event.data.type!=='state_changed')return;
  applyLocale(event.data);
  applyStaticTexts();
  latest=event.data;
  render();
});
</script>
</body>
</html>
