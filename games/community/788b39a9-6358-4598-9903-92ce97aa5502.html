<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nine Stars</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}#stars{font-size:40px;letter-spacing:4px;margin:16px 0;min-height:52px}.row{display:flex;gap:10px}button{font:inherit;min-height:52px;padding:0 22px;border:1px solid #64748b;border-radius:8px;background:#25344e;color:white;cursor:pointer}button:disabled{cursor:default;opacity:.5}.rules{font-size:14px;color:#bec9dc;max-width:420px}</style></head><body><script type="application/json" id="i18n-strings">
{
 "page_title": "Nine Stars",
 "heading": "Nine Stars",
 "rules": "Nine stars on the table. On your turn take 1 or 2 stars. Whoever takes the last star wins.",
 "take1": "Take 1 ⭐",
 "take2": "Take 2 ⭐⭐",
 "wins": "{name} took the last star and wins! 🏆",
 "a_player": "A player",
 "waiting": "Waiting…",
 "saving": "Saving move…",
 "your_turn": "{name} — your turn",
 "waiting_for": "Waiting for {names}",
 "player_n": "Player {number}",
 "server_game_is_over": "game is over",
 "server_take_1_or_2_stars": "take 1 or 2 stars",
 "server_not_enough_stars": "not enough stars"
}
</script><h1>Nine Stars</h1><p class="rules">Nine stars on the table. On your turn take 1 or 2 stars. Whoever takes the last star wins.</p><div id="status">Waiting for the platform…</div><div id="stars"></div><div class="row"><button id="take1">Take 1 ⭐</button><button id="take2">Take 2 ⭐⭐</button></div><script>
"use strict";
// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// A text the game's SERVER wrote (a log line, a hand name in the match state): finds its template
// among the `server_` texts of the table (the most specific that fits, each {name} standing for
// any text) and shows it in the viewer's language with the same values; any other text is
// returned as written.
const SERVER_TEMPLATES = Object.keys(SOURCE_STRINGS)
  .filter((key) => key.startsWith("server_") && SOURCE_STRINGS[key])
  .map((key) => {
    const names = [];
    let literal = 0;
    const source = SOURCE_STRINGS[key]
      .split(/\{(\w+)\}/)
      .map((piece, index) => {
        if (index % 2) { names.push(piece); return "([\\s\\S]+?)"; }
        literal += piece.length;
        return piece.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      })
      .join("");
    return { key, names, literal, pattern: new RegExp("^" + source + "$") };
  })
  .sort((a, b) => b.literal - a.literal || a.names.length - b.names.length || (a.key > b.key ? 1 : a.key === b.key ? 0 : -1));

function tx(text) {
  if (typeof text !== "string") return text;
  for (const template of SERVER_TEMPLATES) {
    const found = template.pattern.exec(text);
    if (found) {
      const params = {};
      template.names.forEach((name, index) => { if (!(name in params)) params[name] = found[index + 1]; });
      return t(template.key, params);
    }
  }
  return text;
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}
let latest=null,sentFor=-1;
function actingSeat(){if(!latest||latest.status!=="ongoing"||!latest.turn_of_player_indices?.length)return null;const turn=latest.turn_of_player_indices[0];if(turn===latest.my_player_index)return turn;const humans=(latest.players||[]).filter(p=>p.kind==="human");if(latest.my_player_index!==null&&humans.length===1&&latest.players[turn]?.kind==="computer")return turn;return null;}
function applyStaticTexts(){
 document.title=t("page_title");
 document.querySelector("h1").textContent=t("heading");
 document.querySelector(".rules").textContent=t("rules");
 $("take1").textContent=t("take1");
 $("take2").textContent=t("take2");
}
const $=id=>document.getElementById(id);
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return actingSeat()!==null;}
function send(take){if(!myTurn()||sentFor===moveCount())return;sentFor=moveCount();parent.postMessage({type:"make_move",move:{take}},"*");render();}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status");
 const name=i=>(latest.players&&latest.players[i]&&latest.players[i].name)||t("player_n",{number:i+1});
 const nameById=id=>{const p=(latest.players||[]).find(p=>p.id===id);return p?p.name:t("a_player");};
 if(!v){status.textContent=t("waiting");return;}
 $("stars").textContent="⭐".repeat(v.stars);
 const over=latest.status==="over"||v.winnerId!==null&&v.winnerId!==undefined;
 if(over)status.textContent=t("wins",{name:nameById(v.winnerId)});
 else if(sentFor===moveCount())status.textContent=t("saving");
 else if(myTurn())status.textContent=t("your_turn",{name:name(actingSeat())});
 else{const turns=latest.turn_of_player_indices||latest.turn;status.textContent=turns&&turns.length?t("waiting_for",{names:turns.map(name).join(", ")}):t("waiting");}
 const can=myTurn()&&sentFor!==moveCount()&&!over;
 $("take1").disabled=!can||v.stars<1;
 $("take2").disabled=!can||v.stars<2;
}
$("take1").onclick=()=>send(1);$("take2").onclick=()=>send(2);
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;applyLocale(e.data);applyStaticTexts();latest=e.data;render();});
</script></body></html>
