<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d4a33;color:#fff;min-height:100vh}
#wrap{max-width:960px;margin:0 auto;padding:12px 12px 30px}
h1{margin:6px 0 2px;font-size:22px;letter-spacing:.5px}
#sub{opacity:.85;font-size:13px;margin:0 0 10px}
#status{background:#093626;border:1px solid #ffffff22;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
#status b{color:#ffe27a}
.panel{background:#0a3a29;border:1px solid #ffffff1e;border-radius:12px;padding:8px;margin-bottom:10px}
.panel h3{margin:2px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;opacity:.9}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.expcol{flex:1;min-width:105px;background:#00000033;border-radius:10px;padding:6px;border:2px solid transparent}
.expcol.target{border-color:#ffe27a;cursor:pointer;box-shadow:0 0 10px #ffe27a66}
.expcol.invalid{opacity:.6}
.expcol h4{margin:0 0 6px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:middle;border:1px solid #0006}
.stack{display:flex;flex-direction:column;gap:3px;min-height:44px}
.mini{background:#fff;color:#222;border-radius:6px;padding:2px 0;text-align:center;font-weight:800;font-size:14px;line-height:22px;box-shadow:0 1px 0 #0006}
.empty{background:#ffffff14;border:1px dashed #ffffff44;border-radius:6px;text-align:center;font-size:12px;padding:8px 2px;opacity:.7}
#centerPiles{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.pile{flex:1;min-width:105px;background:#00000033;border-radius:10px;padding:6px;text-align:center;border:2px solid transparent}
.pile.clickable{border-color:#7CFC9A;cursor:pointer;box-shadow:0 0 8px #7CFC9A66}
.pile.hint-dest{border-color:#ffe27a;cursor:pointer;box-shadow:0 0 10px #ffe27a88}
.pile h4{margin:0 0 6px;font-size:12px}
.card{width:64px;height:88px;border-radius:10px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:24px;box-shadow:0 3px 6px #0008;border:2px solid #00000033;cursor:pointer;user-select:none;margin:3px;transition:transform .12s,outline .12s,box-shadow .12s}
.card small{font-size:11px;font-weight:700;opacity:.8}
.card.back{background:repeating-linear-gradient(45deg,#1a3a8a,#1a3a8a 6px,#244bb5 6px,#244bb5 12px);color:#fff;border-color:#fff3;font-size:18px}
.card.selected{outline:3px solid #ffe27a;transform:translateY(-8px) scale(1.05);box-shadow:0 8px 16px #000a,0 0 12px #ffe27a}
.card.dim{opacity:.45;cursor:default}
#hand{display:flex;flex-wrap:wrap;justify-content:center;min-height:94px}
#deckCard{width:80px;height:100px;border-radius:10px;background:#102a5a;border:2px dashed #fff6;display:inline-flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;font-weight:800}
#deckCard.clickable{border:2px solid #7CFC9A;background:#173a7d;cursor:pointer}
#deckCard.disabled{opacity:.4;cursor:default}
.hint{font-size:13px;background:#ffe27a22;border:1px solid #ffe27a55;padding:6px 10px;border-radius:8px;margin:6px 0}
.hint.error{background:#ff525222;border-color:#ff5252;color:#ffd0d0}
.scoreTable{font-size:13px;border-collapse:collapse;margin-top:6px}
.scoreTable td,.scoreTable th{padding:2px 8px;border-bottom:1px solid #ffffff22}
.opp{flex:1;min-width:260px}
</style>
</head>
<body>
<div id="wrap">
<h1 id="title"></h1>
<p id="sub"></p>
<div id="status" role="status" aria-live="polite"></div>
<div id="hint" class="hint" style="display:none"></div>
<div class="panel"><h3 id="oppTitle"></h3><div id="opps" class="row"></div></div>
<div class="panel"><h3 id="centerTitle"></h3><div id="centerPiles"></div></div>
<div class="panel"><h3 id="myExpTitle"></h3><div id="myExps" class="row"></div></div>
<div class="panel"><h3 id="handTitle"></h3><div id="hand"></div><div id="handHint" style="font-size:12px;opacity:.8;margin-top:4px"></div></div>
<div class="panel" id="scorePanel" style="display:none"><h3 id="scoresTitle"></h3><div id="scores"></div></div>
</div>
<script type="application/json" id="i18n-strings">
{
"title": "🏔️ Lost Cities",
"subtitle": "Play expeditions in ascending order. Sum − 20 per started color. Highest total wins.",
"waiting_platform": "Waiting for platform…",
"dealing": "Dealing cards…",
"scores": "Scores",
"color_red": "Red",
"color_blue": "Blue",
"color_green": "Green",
"color_yellow": "Yellow",
"color_white": "White",
"wins": "🏆 {name} wins! ({scores})",
"score_item": "{name}: {score}",
"your_turn_play": "Your turn {name} — STEP 1: play or discard 1 card (deck {deck})",
"your_turn_draw": "Your turn {name} — STEP 2: draw 1 card (deck {deck})",
"their_turn_play": "{name}'s turn — STEP 1: play or discard 1 card (deck {deck})",
"their_turn_draw": "{name}'s turn — STEP 2: draw 1 card (deck {deck})",
"error_select_card": "Step 1: select a card in your hand first.",
"error_select_discard": "Select a hand card first, then click a discard pile.",
"error_retry": "{text} (retry)",
"hint_selected": "Selected {value} {color} — now click YOUR {color} expedition to PLAY, or the matching discard to DISCARD.",
"hint_step1": "STEP 1: Click a hand card to select it.",
"hint_step2": "STEP 2: Click the DECK or a DISCARD top to DRAW back to 8.",
"hint_waiting": "Waiting for {name}…",
"center_title": "Center — Deck & Discards ({count} left)",
"players_spectating": "Players (you are spectating)",
"opponents": "Opponents",
"opponent": "Opponent",
"solo": "Solo",
"no_opponents": "No opponents",
"deck_title": "🃏 Deck ({count})",
"deck_left": "{count} left",
"pile_title": "{color} ({count})",
"empty": "empty",
"my_exps_title": "My Expeditions (live: {score} pts)",
"spectator_exps_title": "{name}'s Expeditions (live: {score} pts)",
"exp_empty": "empty (-20 to start)",
"my_hand_title": "My Hand ({count} cards)",
"spectator_hand_title": "{name}'s Hand ({count} cards)",
"no_cards": "No cards",
"hand_locked": "Hand locked — not your turn.",
"hand_selected": "Selected {value} {color} — click expedition to PLAY or discard to DISCARD.",
"hand_select": "Select a card from your hand.",
"hand_draw": "Draw to finish your turn and pass.",
"col_player": "Player",
"col_total": "Total",
"winner_row": "{name} 🏆",
"opp_info": "• {count} cards • {score} pts",
"server_not_seated": "not seated",
"server_game_over": "game over",
"server_not_your_turn": "not your turn",
"server_bad_move": "bad move",
"server_must_draw": "must draw",
"server_bad_card": "bad card",
"server_must_match_color": "must match color",
"server_must_be_ascending": "must be ascending",
"server_bad_destination": "bad destination",
"server_must_play_first": "must play first",
"server_deck_empty": "deck empty",
"server_pile_empty": "pile empty",
"server_bad_source": "bad source",
"server_unknown_move": "unknown move",
"server_played": "{p1} played {p2} {p3}",
"server_discarded": "{p1} discarded {p2} {p3}",
"server_drew_from_deck": "{p1} drew from deck",
"server_drew_from_discard": "{p1} drew {p2} {p3} from discard"
}
</script>
<script>

// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// A text the game's SERVER wrote (a log line, a hand name in the match state): finds its template
// among the `server_` texts of the table (the most specific that fits, each {name} standing for
// any text) and shows it in the viewer's language with the same values; any other text is
// returned as written.
const SERVER_TEMPLATES = Object.keys(SOURCE_STRINGS)
  .filter((key) => key.startsWith("server_") && SOURCE_STRINGS[key])
  .map((key) => {
    const names = [];
    let literal = 0;
    const source = SOURCE_STRINGS[key]
      .split(/\{(\w+)\}/)
      .map((piece, index) => {
        if (index % 2) { names.push(piece); return "([\\s\\S]+?)"; }
        literal += piece.length;
        return piece.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      })
      .join("");
    return { key, names, literal, pattern: new RegExp("^" + source + "$") };
  })
  .sort((a, b) => b.literal - a.literal || a.names.length - b.names.length || (a.key > b.key ? 1 : a.key === b.key ? 0 : -1));

function tx(text) {
  if (typeof text !== "string") return text;
  for (const template of SERVER_TEMPLATES) {
    const found = template.pattern.exec(text);
    if (found) {
      const params = {};
      template.names.forEach((name, index) => { if (!(name in params)) params[name] = found[index + 1]; });
      return t(template.key, params);
    }
  }
  return text;
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}


var COLORS=[
 {id:'red',name:function(){return t('color_red');},bg:'#e74c3c',fg:'#fff'},
 {id:'blue',name:function(){return t('color_blue');},bg:'#3498db',fg:'#fff'},
 {id:'green',name:function(){return t('color_green');},bg:'#27ae60',fg:'#fff'},
 {id:'yellow',name:function(){return t('color_yellow');},bg:'#f1c40f',fg:'#333'},
 {id:'white',name:function(){return t('color_white');},bg:'#f2f2f2',fg:'#333'}
];
function cname(id){ return CMAP[id]?CMAP[id].name():id; }
function el(tag,text,cls,parent){ var e=document.createElement(tag); if(text!==undefined&&text!==null) e.textContent=text; if(cls) e.className=cls; if(parent) parent.appendChild(e); return e; }
function dot(cid,parent){ var d=el('span',null,'dot',parent); d.style.background=CMAP[cid].bg; return d; }
var CIDS=COLORS.map(function(c){return c.id;});
var CMAP={};COLORS.forEach(function(c){CMAP[c.id]=c;});
var latest=null, selected=-1, errorKey='';
function sendMove(move){ parent.postMessage({type:'make_move',move:move},'*'); }
function canPlay(col,card){ if(!col||col.length===0) return true; return card.v>col[col.length-1].v; }
function liveScores(view,players){
 if(view.scores) return view.scores;
 var out=[];
 for(var i=0;i<players.length;i++){ var e=view.exps[i]||{}; var t=0;
  CIDS.forEach(function(c){ var a=e[c]||[]; if(a.length){ var s=0; for(var k=0;k<a.length;k++) s+=a[k].v; t+=s-20; } });
  out.push(t);
 }
 return out;
}
function winnerOf(scores){ var m=-Infinity,w=0; scores.forEach(function(s,i){ if(s>m){m=s;w=i;} }); return w; }
addEventListener('message',function(ev){
 if(ev.source!==parent||!ev.data||ev.data.type!=='state_changed') return;
 var prevPhase=latest&&latest.view?latest.view.phase:null;
 applyLocale(ev.data);
 latest=ev.data;
 if(!latest.view||latest.view.phase!==prevPhase){ selected=-1; errorKey=''; }
 else if(selected>=0 && latest.view && latest.view.hand && selected>=latest.view.hand.length) selected=-1;
 render();
});
function tryPlayExp(cid){
 if(!latest||!latest.view) return;
 var v=latest.view;
 if(selected<0){ errorKey='select_card'; render(); return; }
 var card=v.hand[selected];
 if(!card) return;
 errorKey='';
 sendMove({kind:'play',handIndex:selected,dest:'exp',color:cid});
}
function tryDiscard(cid){
 if(!latest||!latest.view) return;
 var v=latest.view;
 if(selected<0){ errorKey='select_discard'; render(); return; }
 if(!v.hand[selected]) return;
 errorKey='';
 sendMove({kind:'play',handIndex:selected,dest:'discard',color:cid});
}
function tryDraw(src){
 errorKey='';
 sendMove({kind:'draw',source:src});
}
function cardDiv(card,opts){
 opts=opts||{};
 var d=document.createElement('div');
 var col=CMAP[card.c];
 d.className='card'+(opts.selected?' selected':'')+(opts.dim?' dim':'');
 d.style.background=col.bg; d.style.color=col.fg;
 d.textContent=card.v; el('small',col.name(),null,d);
 if(opts.onClick) d.onclick=opts.onClick;
 return d;
}
function render(){
 document.getElementById('title').textContent=t('title');
 document.getElementById('sub').textContent=t('subtitle');
 document.getElementById('scoresTitle').textContent=t('scores');
 var statusEl=document.getElementById('status'), hintEl=document.getElementById('hint');
 if(!latest){ statusEl.textContent=t('waiting_platform'); return; }
 var players=latest.players, view=latest.view;
 if(!view){ statusEl.textContent=t('dealing'); return; }
 var my=latest.my_player_index;
 var turnIdx=(latest.turn_of_player_indices&&latest.turn_of_player_indices.length)?latest.turn_of_player_indices[0]:null;
 var acting=latest.acting_for_player_index;
 var canAct=acting!==null&&acting!==undefined&&latest.status!=='over'&&view.phase!=='over';
 var myIdx=(my!==null&&my!==undefined)?my:(typeof view.myIndex==='number'?view.myIndex:0);
 var cur=typeof view.current==='number'?view.current:turnIdx;
 var scores=liveScores(view,players);
 var turnName=(turnIdx!=null&&players[turnIdx])?players[turnIdx].name:'—';
 var status;
 if(latest.status==='over'||view.phase==='over'){
  var w=(view.winner!=null)?view.winner:winnerOf(scores);
  status=t('wins',{name:players[w]?players[w].name:'?',scores:scores.map(function(s,i){return t('score_item',{name:players[i].name,score:s});}).join(' • ')});
 } else {
  var q={name:(canAct&&players[myIdx])?players[myIdx].name:turnName,deck:view.deckCount};
  if(view.phase==='play') status=canAct?t('your_turn_play',q):t('their_turn_play',q);
  else status=canAct?t('your_turn_draw',q):t('their_turn_draw',q);
 }
 statusEl.textContent=status;
 if(!(latest.status==='over'||view.phase==='over')&&view.last){ el('span',' • '+tx(view.last.text),null,statusEl).style.opacity='.7'; }
 hintEl.style.display='none'; hintEl.classList.remove('error');
 var selCard=(selected>=0&&view.hand)?view.hand[selected]:null;
 if(errorKey){ hintEl.style.display='block'; hintEl.classList.add('error'); hintEl.textContent=t('error_retry',{text:errorKey==='select_card'?t('error_select_card'):t('error_select_discard')}); }
 else if(view.phase!=='over'&&latest.status!=='over'){
  if(canAct){
   hintEl.style.display='block';
   if(view.phase==='play') { var hp=selCard?{value:selCard.v,color:cname(selCard.c)}:{}; hintEl.textContent=selected>=0?t('hint_selected',hp):t('hint_step1'); }
   else hintEl.textContent=t('hint_step2');
  } else if(latest.status==='ongoing'){ hintEl.style.display='block'; hintEl.textContent=t('hint_waiting',{name:turnName}); }
 }
 document.getElementById('centerTitle').textContent=t('center_title',{count:view.deckCount});
 var oppsEl=document.getElementById('opps'); oppsEl.replaceChildren();
 var oppIdxs=players.map(function(_,i){return i;}).filter(function(i){return i!==myIdx;});
 document.getElementById('oppTitle').textContent=(my===null)?t('players_spectating'):(oppIdxs.length>1?t('opponents'):oppIdxs.length?t('opponent'):t('solo'));
 oppIdxs.forEach(function(i){ oppsEl.appendChild(oppPanel(i,players[i],view,scores)); });
 if(!oppIdxs.length) el('span',t('no_opponents'),null,oppsEl).style.opacity='.7';
 var cEl=document.getElementById('centerPiles'); cEl.replaceChildren();
 var deckPile=el('div',null,'pile');
 el('h4',t('deck_title',{count:view.deckCount}),null,deckPile);
 var dc=el('div',null,null); dc.id='deckCard';
 el('div','🂠',null,dc).style.fontSize='28px'; el('div',t('deck_left',{count:view.deckCount}),null,dc);
 var canDrawDeck=canAct&&view.phase==='draw'&&view.deckCount>0;
 dc.className=canDrawDeck?'clickable':'disabled';
 if(canDrawDeck) dc.onclick=function(){tryDraw('deck');};
 else dc.style.cursor='default';
 deckPile.appendChild(dc); cEl.appendChild(deckPile);
 CIDS.forEach(function(cid){
  var pile=el('div',null,'pile');
  var arr=view.discards[cid]||[];
  var top=arr.length?arr[arr.length-1]:null;
  var h4=el('h4',null,null,pile); dot(cid,h4); el('span',t('pile_title',{color:cname(cid),count:arr.length}),null,h4);
  if(top){ var clickable=canAct&&view.phase==='draw'; pile.appendChild(cardDiv(top,{dim:!clickable,onClick:clickable?(function(c){return function(){tryDraw(c);};})(cid):null})); }
  else { el('div',t('empty'),'empty',pile); }
  if(canAct&&view.phase==='play'&&selected>=0){
   var sel=view.hand[selected];
   if(sel&&sel.c===cid){ pile.classList.add('hint-dest'); pile.onclick=function(){tryDiscard(cid);}; }
  } else if(canAct&&view.phase==='draw'&&top){ pile.classList.add('clickable'); pile.onclick=(function(c){return function(){tryDraw(c);};})(cid); }
  cEl.appendChild(pile);
 });
 var myEx=document.getElementById('myExps'); myEx.replaceChildren();
 var expOwnerName=players[myIdx]?players[myIdx].name:'';
 document.getElementById('myExpTitle').textContent=(my===null)?t('spectator_exps_title',{name:expOwnerName,score:scores[myIdx]}):t('my_exps_title',{score:scores[myIdx]});
 CIDS.forEach(function(cid){
  var col=el('div',null,'expcol');
  var arr=(view.exps[myIdx]&&view.exps[myIdx][cid])||[];
  var sum=arr.reduce(function(s,x){return s+x.v;},0);
  var h4=el('h4',null,null,col); var left=el('span',null,null,h4); dot(cid,left); el('span',cname(cid),null,left);
  el('span',arr.length?' '+(sum-20):' —',null,h4);
  var stack=el('div',null,'stack',col);
  if(!arr.length){ el('div',t('exp_empty'),'empty',stack); }
  else arr.forEach(function(c){ var m=el('div',c.v,'mini',stack); m.style.borderLeft='8px solid '+CMAP[cid].bg; });
  if(canAct&&view.phase==='play'&&selected>=0){
   var s2=view.hand[selected];
   if(s2&&s2.c===cid){
    if(canPlay(arr,s2)){ col.classList.add('target'); col.onclick=function(){tryPlayExp(cid);}; }
    else { col.classList.add('invalid'); col.onclick=function(){tryPlayExp(cid);}; }
   }
  }
  myEx.appendChild(col);
 });
 var hEl=document.getElementById('hand'); hEl.replaceChildren();
 var hh=document.getElementById('handHint');
 var hand=view.hand||[];
 document.getElementById('handTitle').textContent=(my===null)?t('spectator_hand_title',{name:expOwnerName,count:hand.length}):t('my_hand_title',{count:hand.length});
 hand.forEach(function(c,i){
  var isSel=i===selected;
  var d=cardDiv(c,{selected:isSel,dim:!(canAct&&view.phase==='play')});
  if(canAct&&view.phase==='play'){ d.onclick=function(){ errorKey=''; selected=(selected===i?-1:i); render(); }; }
  hEl.appendChild(d);
 });
 if(!hand.length) el('span',t('no_cards'),null,hEl).style.opacity='.7';
 if(!canAct) hh.textContent=t('hand_locked');
 else if(view.phase==='play') hh.textContent=selected>=0?t('hand_selected',{value:hand[selected].v,color:cname(hand[selected].c)}):t('hand_select');
 else hh.textContent=t('hand_draw');
 var sp=document.getElementById('scorePanel');
 sp.style.display='block';
 var scoresEl=document.getElementById('scores'); scoresEl.replaceChildren();
 if(view.phase==='over'||latest.status==='over'||view.scores){
  var sc2=view.scores||scores; var w2=(view.winner!=null)?view.winner:winnerOf(sc2);
  var table=el('table',null,'scoreTable');
  var head=el('tr',null,null,table); el('th',t('col_player'),null,head);
  CIDS.forEach(function(c){ el('th',cname(c),null,head); });
  el('th',t('col_total'),null,head);
  players.forEach(function(p,i){
   var tr=el('tr',null,null,table);
   el('td',i===w2?t('winner_row',{name:p.name}):p.name,null,tr);
   CIDS.forEach(function(cid){ var a=(view.exps[i]&&view.exps[i][cid])||[]; el('td',String(a.length?(a.reduce(function(s,x){return s+x.v;},0)-20):'0'),null,tr); });
   el('td',null,null,tr).appendChild(el('b',String(sc2[i])));
  });
  scoresEl.appendChild(table);
 } else {
  scoresEl.textContent=players.map(function(p,i){ return t('score_item',{name:p.name,score:scores[i]}); }).join(' • ');
 }
}
function oppPanel(i,p,view,scores){
 var d=el('div',null,'opp panel'); d.style.margin='0';
 var hc=view.handCounts?view.handCounts[i]:0;
 var head=el('div',null,null,d); head.style.fontSize='13px'; head.style.marginBottom='6px';
 el('b',p.name,null,head); el('span',' '+t('opp_info',{count:hc,score:scores[i]}),null,head).style.opacity='.7';
 var r=el('div',null,'row');
 CIDS.forEach(function(cid){
  var col=el('div',null,'expcol'); col.style.minWidth='52px';
  var arr=(view.exps[i]&&view.exps[i][cid])||[];
  el('h4',cname(cid),null,col).style.fontSize='11px';
  var stack=el('div',null,'stack',col);
  if(!arr.length){ el('div','–','empty',stack).style.fontSize='11px'; }
  else arr.forEach(function(c){ var m=el('div',c.v,'mini',stack); m.style.borderLeft='6px solid '+CMAP[cid].bg; m.style.fontSize='12px'; });
  r.appendChild(col);
 });
 var hr=el('div'); hr.style.marginTop='6px'; hr.style.display='flex'; hr.style.gap='4px'; hr.style.flexWrap='wrap';
 for(var k=0;k<hc;k++){ var b=el('div','•','card back',hr); b.style.width='26px'; b.style.height='36px'; b.style.fontSize='12px'; b.style.margin='0'; }
 d.appendChild(r); d.appendChild(hr);
 return d;
}
render();
</script>
</body>
</html>
