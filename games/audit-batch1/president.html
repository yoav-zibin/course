<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>President</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}.hand{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.card{min-width:46px;min-height:60px;padding:5px;border-radius:8px;border:1px solid #64748b;background:#f8fafc;color:#0f172a;font-weight:700;font-size:16px;cursor:pointer}.card.red{color:#dc2626}.card.sel{outline:3px solid #fcd34d;transform:translateY(-6px)}.card:disabled{cursor:default;opacity:.5}.pile{display:flex;gap:6px;margin:8px 0;min-height:60px}.meta{font-size:14px;color:#bec9dc}button.act{font:inherit;min-height:48px;padding:0 20px;border:1px solid #64748b;border-radius:8px;background:#25344e;color:white;cursor:pointer;margin-right:8px}button.act:disabled{opacity:.5;cursor:default}.rules{font-size:14px;color:#bec9dc;max-width:480px}</style></head><body><h1 id="title"></h1><p class="rules" id="rules"></p><div id="status" role="status" aria-live="polite"></div><div class="meta" id="meta"></div><div id="pileLabel"></div><div class="pile" id="pile"></div><div id="handLabel"></div><div class="hand" id="hand"></div><div><button class="act" id="play"></button><button class="act" id="pass"></button></div><script type="application/json" id="i18n-strings">
{
"title": "President",
"rules": "Climb the pile: play cards of a single rank, matching the pile's count and beating its rank (3 is low, 2 is high, jokers highest). Playing the same rank skips the next player; completing a set of four — or playing a 2 — clears the pile. Finish your hand to score; first to 6 points wins the match. Between rounds, the top finishers tax the bottom finishers' best cards.",
"waiting_platform": "Waiting for the platform…",
"waiting": "Waiting…",
"player_n": "Player {n}",
"pile": "Pile:",
"your_hand": "Your hand — tap cards to select:",
"pass": "Pass",
"play_selected": "Play selected",
"play_selected_count": "Play selected ({count})",
"joker_small": "🃏 small",
"joker_big": "🃏 BIG",
"round_line": "Round {round} · first to {target} pts",
"player_line": "{name}: {score} pts · {count} cards",
"player_line_finished": "{name}: {score} pts · {count} cards · finished #{place}",
"player_line_passed": "{name}: {score} pts · {count} cards · passed",
"player_line_finished_passed": "{name}: {score} pts · {count} cards · finished #{place} · passed",
"tax_line": "Tax: {info}",
"wins_match": "{name} wins the match! 🏆",
"saving": "Saving move…",
"your_turn_pile_many": "{name} — your turn (pile: {count} cards of rank {rank})",
"your_turn_pile_one": "{name} — your turn (pile: 1 card of rank {rank})",
"your_turn_lead": "{name} — your turn (you lead)",
"waiting_for": "Waiting for {names}",
"pile_empty": "(empty — next player leads)",
"server_unknown": "unknown",
"server_bad_seat": "bad seat",
"server_over": "over",
"server_out": "out",
"server_nothing_to_pass": "nothing to pass",
"server_select_cards": "select cards",
"server_bad_card": "bad card",
"server_card_not_in_hand": "card not in hand",
"server_same_rank": "same rank",
"server_need_1": "need 1",
"server_no_beat": "no beat",
"server_need": "need {p1}"
}
</script>
<script>
"use strict";

// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// A text the game's SERVER wrote (a log line, a hand name in the match state): finds its template
// among the `server_` texts of the table (the most specific that fits, each {name} standing for
// any text) and shows it in the viewer's language with the same values; any other text is
// returned as written.
const SERVER_TEMPLATES = Object.keys(SOURCE_STRINGS)
  .filter((key) => key.startsWith("server_") && SOURCE_STRINGS[key])
  .map((key) => {
    const names = [];
    let literal = 0;
    const source = SOURCE_STRINGS[key]
      .split(/\{(\w+)\}/)
      .map((piece, index) => {
        if (index % 2) { names.push(piece); return "([\\s\\S]+?)"; }
        literal += piece.length;
        return piece.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      })
      .join("");
    return { key, names, literal, pattern: new RegExp("^" + source + "$") };
  })
  .sort((a, b) => b.literal - a.literal || a.names.length - b.names.length || (a.key > b.key ? 1 : a.key === b.key ? 0 : -1));

function tx(text) {
  if (typeof text !== "string") return text;
  for (const template of SERVER_TEMPLATES) {
    const found = template.pattern.exec(text);
    if (found) {
      const params = {};
      template.names.forEach((name, index) => { if (!(name in params)) params[name] = found[index + 1]; });
      return t(template.key, params);
    }
  }
  return text;
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}


let latest=null,sentFor=-1,sel=new Set();
function actingSeat(){if(!latest||latest.status!=="ongoing"||!latest.turn_of_player_indices?.length)return null;const turn=latest.turn_of_player_indices[0];if(turn===latest.my_player_index)return turn;const humans=(latest.players||[]).filter(p=>p.kind==="human");if(latest.my_player_index!==null&&humans.length===1&&latest.players[turn]?.kind==="computer")return turn;return null;}
const $=id=>document.getElementById(id);
$("status").textContent=t("waiting_platform");
const SUITS={C:"♣",D:"♦",H:"♥",S:"♠"};
const RLBL={11:"J",12:"Q",13:"K",14:"A",15:"2"};
function label(c){if(c.r===16)return t("joker_small");if(c.r===17)return t("joker_big");return (RLBL[c.r]||String(c.r))+(SUITS[c.s]||"");}
function red(c){return c.s==="H"||c.s==="D";}
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return actingSeat()!==null;}
function send(move){if(!myTurn()||sentFor===moveCount())return;sentFor=moveCount();sel.clear();parent.postMessage({type:"make_move",move},"*");render();}
function render(){
 $("title").textContent=t("title");$("rules").textContent=t("rules");$("pileLabel").textContent=t("pile");$("handLabel").textContent=t("your_hand");
 $("pass").textContent=t("pass");
 if(!latest){$("play").textContent=t("play_selected");return;}
 const v=latest.view,status=$("status");
 const name=i=>(latest.players&&latest.players[i]&&latest.players[i].name)||t("player_n",{n:i+1});
 if(!v){status.textContent=t("waiting");$("play").textContent=t("play_selected");return;}
 const over=latest.status==="over"||(v.matchWinner!==null&&v.matchWinner!==undefined);
 const lines=[t("round_line",{round:v.round,target:v.target})];
 (latest.players||[]).forEach((p,i)=>{
   const q={name:p.name,score:v.scores[i],count:v.counts[i],place:v.finished.indexOf(i)+1};
   const fin=v.finished.includes(i),pas=!!v.passed[i];
   lines.push(fin&&pas?t("player_line_finished_passed",q):fin?t("player_line_finished",q):pas?t("player_line_passed",q):t("player_line",q));
 });
 if(v.lastEvent)lines.push(v.lastEvent);
 if(v.tradeInfo)lines.push(t("tax_line",{info:v.tradeInfo}));
 $("meta").replaceChildren(...lines.map(l=>{const d=document.createElement("div");d.textContent=l;return d;}));
 if(over)status.textContent=t("wins_match",{name:name(v.matchWinner)});
 else if(sentFor===moveCount())status.textContent=t("saving");
 else if(myTurn()){
   const q={name:name(actingSeat()),count:v.pileCount,rank:RLBL[v.pileRank]||v.pileRank};
   status.textContent=v.pileCount>1?t("your_turn_pile_many",q):v.pileCount?t("your_turn_pile_one",q):t("your_turn_lead",q);
 }
 else{const turn=latest.turn_of_player_indices||latest.turn;status.textContent=turn&&turn.length?t("waiting_for",{names:turn.map(name).join(", ")}):t("waiting");}
 const pile=$("pile");pile.replaceChildren();
 for(const c of (v.pile||[])){const d=document.createElement("button");d.className="card"+(red(c)?" red":"");d.textContent=label(c);d.disabled=true;pile.append(d);}
 if(!(v.pile||[]).length)pile.textContent=t("pile_empty");
 const hand=$("hand");hand.replaceChildren();
 (v.hand||[]).forEach((c,i)=>{
   const b=document.createElement("button");
   b.className="card"+(red(c)?" red":"")+(sel.has(i)?" sel":"");
   b.textContent=label(c);b.disabled=!myTurn()||over;
   b.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i);render();};
   hand.append(b);
 });
 const selCards=[...sel].map(i=>(v.hand||[])[i]).filter(Boolean);
 const sameRank=selCards.length>0&&selCards.every(c=>c.r===selCards[0].r);
 $("play").disabled=!myTurn()||over||sentFor===moveCount()||!sameRank;
 $("play").textContent=selCards.length?t("play_selected_count",{count:selCards.length}):t("play_selected");
 $("pass").disabled=!myTurn()||over||sentFor===moveCount()||!(v.pileCount>0);
}
$("play").onclick=()=>{const v=latest.view;const cards=[...sel].map(i=>v.hand[i]).filter(Boolean);if(cards.length)send({cards});};
$("pass").onclick=()=>send({pass:true});
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;applyLocale(e.data);latest=e.data;sel.clear();render();});
</script></body></html>
