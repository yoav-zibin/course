<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crazy Eights</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}.hand{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.card{min-width:52px;min-height:66px;padding:6px;border-radius:8px;border:1px solid #64748b;background:#f8fafc;color:#0f172a;font-weight:700;font-size:17px;cursor:pointer}.card.red{color:#dc2626}.card:disabled{cursor:default;opacity:.45}.card.ok{outline:3px solid #22c55e}.pile{font-size:30px;margin:8px 0}.meta{font-size:14px;color:#bec9dc}button.act{font:inherit;min-height:48px;padding:0 20px;border:1px solid #64748b;border-radius:8px;background:#25344e;color:white;cursor:pointer}button.act:disabled{opacity:.5;cursor:default}.rules{font-size:14px;color:#bec9dc;max-width:460px}</style></head><body><h1>Crazy Eights</h1><p class="rules">Match the top card by suit or rank. Eights are wild — play one anytime and name the new suit. No match? Draw a card. First to empty their hand wins; if the deck runs out, lowest hand points wins (8s count 50).</p><div id="status">Waiting for the platform…</div><div class="meta" id="meta"></div><div class="pile" id="pile"></div><div class="hand" id="hand"></div><div id="actions"></div><script>
"use strict";
let latest=null,sentFor=-1,pending8=null;
const $=id=>document.getElementById(id);
const SUITS=["♠","♥","♣","♦"],RED={1:1,3:1};
const RANKS={1:"A",11:"J",12:"Q",13:"K"};
const label=c=>(RANKS[c%13+1]||String(c%13+1))+SUITS[Math.floor(c/13)];
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function send(move){if(!myTurn()||sentFor===moveCount())return;
 if(move!=="draw"){
   const v=latest.view;
   if(!v||!(v.hand||[]).includes(move.card)||!(v.playable||[]).includes(move.card))return;
   if((move.card%13+1)===8&&(!Number.isInteger(move.chosenSuit)||move.chosenSuit<0||move.chosenSuit>3))return;
 }
 sentFor=moveCount();pending8=null;parent.postMessage({type:"make_move",move},"*");render();}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status");
 const name=i=>(latest.players&&latest.players[i]&&latest.players[i].name)||("Player "+(i+1));
 if(!v){status.textContent="Waiting…";return;}
 $("meta").textContent=(latest.players||[]).map((p,i)=>p.name+": "+(v.counts[i]??0)+" cards").join(" · ")+" · deck: "+v.deckCount;
 $("pile").textContent="Top: "+label(v.top)+" · suit in play: "+SUITS[v.suit];
 const over=latest.status==="over"||v.done;
 if(over)status.textContent=v.winner!==null&&v.winner!==undefined?(name(v.winner)+" wins! 🏆"):"Round over — tied on points.";
 else if(sentFor===moveCount())status.textContent="Saving move…";
 else if(myTurn())status.textContent=name(latest.acting_for_player_index)+" — your turn";
 else status.textContent="Waiting for "+name(v.turnIdx)+"…";
 const hand=$("hand");hand.replaceChildren();
 const playable=new Set(v.playable||[]);
 for(const c of (v.hand||[])){
   const b=document.createElement("button");
   b.className="card"+(RED[Math.floor(c/13)]?" red":"")+((myTurn()&&playable.has(c))?" ok":"");
   b.textContent=label(c);
   b.disabled=!myTurn()||sentFor===moveCount()||over||!playable.has(c);
   b.onclick=()=>{if(b.disabled)return;if((c%13+1)===8){pending8=c;render();}else send({card:c});};
   hand.append(b);
 }
 const actions=$("actions");actions.replaceChildren();
 if(myTurn()&&!over){
   if(pending8!==null){
     const t=document.createElement("span");t.textContent="Name a suit for your 8: ";actions.append(t);
     SUITS.forEach((s,si)=>{const b=document.createElement("button");b.className="act";b.textContent=s;b.onclick=()=>send({card:pending8,chosenSuit:si});actions.append(b);});
   }else{
     const d=document.createElement("button");d.className="act";d.textContent="Draw a card";d.disabled=sentFor===moveCount();d.onclick=()=>send("draw");actions.append(d);
   }
 }
}
addEventListener("message",e=>{
 if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;
 // The portal refreshes this authoritative state after a rejection too;
 // its move count stays unchanged, but the player must be able to retry.
 latest=e.data;sentFor=-1;pending8=null;render();
});
</script></body></html>
