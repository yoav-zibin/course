<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crazy Eights</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}.hand{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.card{min-width:52px;min-height:66px;padding:6px;border-radius:8px;border:1px solid #64748b;background:#f8fafc;color:#0f172a;font-weight:700;font-size:17px;cursor:pointer}.card.red{color:#dc2626}.card:disabled{cursor:default;opacity:.45}.card.ok{outline:3px solid #22c55e}.pile{font-size:30px;margin:8px 0}.meta{font-size:14px;color:#bec9dc;display:flex;flex-wrap:wrap;gap:4px 14px}button.act{font:inherit;min-height:48px;padding:0 20px;border:1px solid #64748b;border-radius:8px;background:#25344e;color:white;cursor:pointer}button.act:disabled{opacity:.5;cursor:default}.rules{font-size:14px;color:#bec9dc;max-width:460px}</style></head><body><h1 id="title"></h1><p class="rules" id="rules"></p><div id="status" role="status" aria-live="polite"></div><div class="meta" id="meta"></div><div class="pile" id="pile"></div><div class="hand" id="hand"></div><div id="actions"></div><script type="application/json" id="i18n-strings">
{
"title": "Crazy Eights",
"rules": "Match the top card by suit or rank. Eights are wild — play one anytime and name the new suit. No match? Draw a card. First to empty their hand wins; if the deck runs out, lowest hand points wins (8s count 50).",
"waiting_platform": "Waiting for the platform…",
"waiting": "Waiting…",
"player_n": "Player {n}",
"player_cards": "{name}: {count} cards",
"deck_count": "Deck: {count}",
"top_card": "Top: {card} · suit in play: {suit}",
"wins": "{name} wins! 🏆",
"tied": "Round over — tied on points.",
"saving": "Saving move…",
"your_turn": "{name} — your turn",
"waiting_for": "Waiting for {name}…",
"name_suit": "Name a suit for your 8:",
"draw": "Draw a card"
}
</script>
<script>
"use strict";

// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}


let latest=null,sentFor=-1,pending8=null;
const $=id=>document.getElementById(id);
$("status").textContent=t("waiting_platform");$("title").textContent=t("title");$("rules").textContent=t("rules");
const SUITS=["♠","♥","♣","♦"],RED={1:1,3:1};
const RANKS={1:"A",11:"J",12:"Q",13:"K"};
const label=c=>(RANKS[c%13+1]||String(c%13+1))+SUITS[Math.floor(c/13)];
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function send(move){if(!myTurn()||sentFor===moveCount())return;
 if(move!=="draw"){
   const v=latest.view;
   if(!v||!(v.hand||[]).includes(move.card)||!(v.playable||[]).includes(move.card))return;
   if((move.card%13+1)===8&&(!Number.isInteger(move.chosenSuit)||move.chosenSuit<0||move.chosenSuit>3))return;
 }
 sentFor=moveCount();pending8=null;parent.postMessage({type:"make_move",move},"*");render();}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status");
 const name=i=>(latest.players&&latest.players[i]&&latest.players[i].name)||t("player_n",{n:i+1});
 $("title").textContent=t("title");$("rules").textContent=t("rules");
 if(!v){status.textContent=t("waiting");return;}
 $("meta").replaceChildren(...(latest.players||[]).map((p,i)=>{const s=document.createElement("span");s.textContent=t("player_cards",{name:p.name,count:v.counts[i]??0});return s;}),(()=>{const s=document.createElement("span");s.textContent=t("deck_count",{count:v.deckCount});return s;})());
 $("pile").textContent=t("top_card",{card:label(v.top),suit:SUITS[v.suit]});
 const over=latest.status==="over"||v.done;
 if(over)status.textContent=v.winner!==null&&v.winner!==undefined?t("wins",{name:name(v.winner)}):t("tied");
 else if(sentFor===moveCount())status.textContent=t("saving");
 else if(myTurn())status.textContent=t("your_turn",{name:name(latest.acting_for_player_index)});
 else status.textContent=t("waiting_for",{name:name(v.turnIdx)});
 const hand=$("hand");hand.replaceChildren();
 const playable=new Set(v.playable||[]);
 for(const c of (v.hand||[])){
   const b=document.createElement("button");
   b.className="card"+(RED[Math.floor(c/13)]?" red":"")+((myTurn()&&playable.has(c))?" ok":"");
   b.textContent=label(c);
   b.disabled=!myTurn()||sentFor===moveCount()||over||!playable.has(c);
   b.onclick=()=>{if(b.disabled)return;if((c%13+1)===8){pending8=c;render();}else send({card:c});};
   hand.append(b);
 }
 const actions=$("actions");actions.replaceChildren();
 if(myTurn()&&!over){
   if(pending8!==null){
     const prompt=document.createElement("span");prompt.textContent=t("name_suit");actions.append(prompt);
     SUITS.forEach((s,si)=>{const b=document.createElement("button");b.className="act";b.textContent=s;b.onclick=()=>send({card:pending8,chosenSuit:si});actions.append(b);});
   }else{
     const d=document.createElement("button");d.className="act";d.textContent=t("draw");d.disabled=sentFor===moveCount();d.onclick=()=>send("draw");actions.append(d);
   }
 }
}
addEventListener("message",e=>{
 if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;
 // The portal refreshes this authoritative state after a rejection too;
 // its move count stays unchanged, but the player must be able to retry.
 applyLocale(e.data);latest=e.data;sentFor=-1;pending8=null;render();
});
</script></body></html>
