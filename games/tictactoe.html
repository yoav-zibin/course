<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 16px; font-family: Inter, sans-serif; background: #101114; color: #eee; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #status { margin-bottom: 12px; min-height: 20px; }
  #board { display: grid; grid-template-columns: repeat(3, 72px); gap: 6px; }
  #board button {
    width: 72px; height: 72px; font-size: 40px; font-weight: 700; background: #1d1f24;
    color: #eee; border: 1px solid #444; border-radius: 6px; cursor: pointer;
  }
  #board button:disabled { cursor: default; }
  #board button.win { background: #2d4a2d; }
  .players { margin-top: 12px; font-size: 13px; color: #aaa; }
  .players .turn { color: #fff; font-weight: 700; }
</style>
</head>
<body>
<h1 id="title">Tic-tac-toe</h1>
<div id="status" role="status" aria-live="polite">Waiting for the platform…</div>
<div id="board"></div>
<div class="players" id="players"></div>

<script type="application/json" id="i18n-strings">
{
  "title": "Tic-tac-toe",
  "waiting_platform": "Waiting for the platform…",
  "replay": "Viewing move {index} of {total} · read only",
  "wins": "{name} wins!",
  "draw": "It's a draw.",
  "over": "The match is over.",
  "your_move": "Your move, {name}.",
  "waiting_for": "Waiting for {names}.",
  "player_label": "{name} ({mark})",
  "cell": "Row {row}, column {column}: {mark}",
  "cell_empty": "Row {row}, column {column}: empty",
  "player_line": "{mark}: {name}",
  "player_line_you": "{mark}: {name} — you"
}
</script>
<script>
"use strict";

// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  strings = message.strings ? { ...SOURCE_STRINGS, ...message.strings } : SOURCE_STRINGS;
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}

// ---- UI only: the rules live in tictactoe.server.js, on the server. ----
// state_changed carries this player's view (the board, the winner, the
// winning line); a click sends {type: "make_move", move: {cell}} and the
// server validates and applies it. Computers move on the server, so the
// client never acts for anyone but the viewer.
if (typeof window !== "undefined" && window.document) {
  const MARKS = ["X", "O"];
  let latest = null; // the last state_changed message
  let moveSent = false; // at most one make_move per state_changed

  const $ = (id) => document.getElementById(id);
  const view = () => latest.view ?? latest.state;
  $("status").textContent = t("waiting_platform");

  function render() {
    const state = view();
    const acting = latest.status === "ongoing" ? latest.acting_for_player_index : null;
    const myTurn = !latest.replay && acting !== null && acting === latest.my_player_index;
    const name = (seat) => t("player_label", { name: latest.players[seat].name, mark: MARKS[seat] });

    let status;
    if (latest.replay) status = t("replay", { index: latest.replay.index, total: latest.replay.total });
    else if (state.winner !== null) status = t("wins", { name: name(state.winner) });
    else if (state.draw) status = t("draw");
    else if (latest.status === "over") status = t("over");
    else if (myTurn) status = t("your_move", { name: name(acting) });
    else status = t("waiting_for", { names: latest.turn_of_player_indices.map((seat) => name(seat)).join(", ") });
    $("title").textContent = t("title");
    $("status").textContent = status;

    $("board").replaceChildren(...state.board.map((mark, cell) => {
      const button = document.createElement("button");
      button.textContent = mark;
      const where = { row: Math.floor(cell / 3) + 1, column: cell % 3 + 1 };
      button.setAttribute("aria-label", mark ? t("cell", { ...where, mark }) : t("cell_empty", where));
      button.disabled = !myTurn || mark !== "";
      if (state.line && state.line.includes(cell)) button.className = "win";
      button.addEventListener("click", () => {
        if (moveSent || !myTurn || mark !== "") return;
        moveSent = true;
        window.parent.postMessage({ type: "make_move", move: { cell } }, "*");
      });
      return button;
    }));

    $("players").replaceChildren(...latest.players.slice(0, 2).map((player) => {
      const div = document.createElement("div");
      const line = { mark: MARKS[player.player_index], name: player.name };
      if (player.player_index === latest.my_player_index) div.textContent = t("player_line_you", line);
      else div.textContent = t("player_line", line);
      if (latest.turn_of_player_indices && latest.turn_of_player_indices.includes(player.player_index)) div.className = "turn";
      return div;
    }));
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.type !== "state_changed") return;
    applyLocale(message);
    latest = message;
    moveSent = false;
    render();
  });
}
</script>
</body>
</html>
