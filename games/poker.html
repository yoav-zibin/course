<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 12px 16px; font-family: Inter, sans-serif; background: #0f1a14; color: #eee; font-size: 14px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: #9aa; }
  #status { margin: 6px 0 10px; min-height: 20px; font-weight: 600; }
  .card {
    display: inline-block; min-width: 30px; padding: 4px 4px; margin: 0 2px; text-align: center;
    background: #fafafa; color: #111; border-radius: 4px; font-size: 18px; font-weight: 700;
  }
  .card.red { color: #c00; }
  .card.back { background: #345; color: #9ab; }
  #board { margin: 6px 0; min-height: 34px; }
  table { border-collapse: collapse; margin: 8px 0; }
  td, th { padding: 4px 10px; border-bottom: 1px solid #2a3a30; text-align: left; white-space: nowrap; }
  th { color: #9aa; font-weight: 600; font-size: 12px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.turn td { background: #1f3a28; }
  tr.out td { color: #677; }
  #controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 8px 0; min-height: 34px; }
  button { font: inherit; padding: 6px 12px; border-radius: 4px; border: 1px solid #5a7; background: #234; color: #eee; cursor: pointer; }
  button:hover { background: #345; }
  input { font: inherit; width: 90px; padding: 5px; background: #111; color: #eee; border: 1px solid #5a7; border-radius: 4px; }
  #previous { margin-top: 10px; padding: 8px; background: #16261c; border-radius: 4px; }
  #log { margin-top: 8px; font-size: 12px; color: #9aa; white-space: pre-line; }
</style>
</head>
<body>
<h1 id="title">Texas hold'em</h1>
<div class="muted" id="info"></div>
<div id="status">Waiting for the platform…</div>
<div id="board"></div>
<table id="table"></table>
<div id="controls"></div>
<div id="previous" hidden></div>
<div id="log"></div>

<script type="application/json" id="i18n-strings">
{
  "title": "Texas hold'em",
  "waiting_platform": "Waiting for the platform…",
  "waiting_deal": "Waiting for the first deal…",
  "info": "Hand #{number} · blinds {small}/{big} · pot {pot}",
  "game_winner": "{name} wins the game!",
  "over": "The match is over.",
  "your_turn": "Your turn, {name}.",
  "waiting_for": "Waiting for {name}.",
  "waiting_next": "Waiting for the next player.",
  "player_you": "{name} (you)",
  "note_dealer": "dealer",
  "note_folded": "folded",
  "note_all_in": "all in",
  "note_joins": "joins next hand",
  "note_out": "out",
  "head_player": "Player",
  "head_chips": "Chips",
  "head_bet": "Bet",
  "head_cards": "Cards",
  "fold": "Fold",
  "check": "Check",
  "call": "Call {amount}",
  "bet": "Bet",
  "raise_to": "Raise to",
  "all_in": "All in ({amount})",
  "last_hand": "Last hand (#{number}): {description}",
  "shown_player": "{name}:",
  "seat": "Seat {number}",
  "won_amount": "{name} won {amount}"
}
</script>
<script>
"use strict";

// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings) strings = { ...SOURCE_STRINGS, ...message.strings };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}

// ---- UI only: the rules live in poker.server.js, on the server. ----
// state_changed carries this player's view: the public table, the
// viewer's own hole cards (everyone else's are null), and — on the
// viewer's turn — the legal actions. A click sends the action as the
// move; the server validates and applies it, and moves computers itself.
if (typeof window !== "undefined" && window.document) {
  const SUIT_SYMBOLS = { s: "♠", h: "♥", d: "♦", c: "♣" };
  const cardText = (card) => `${card[0] === "T" ? "10" : card[0]}${SUIT_SYMBOLS[card[1]]}`;
  let latest = null; // the last state_changed message
  let moveSent = false; // at most one make_move per state_changed

  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...children) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  };
  const view = () => latest.view ?? latest.state;
  $("status").textContent = t("waiting_platform");

  function cardNode(card) {
    if (!card) return el("span", { className: "card back", textContent: "🂠" });
    const red = card[1] === "h" || card[1] === "d";
    return el("span", { className: `card${red ? " red" : ""}`, textContent: cardText(card) });
  }

  function play(action) {
    if (moveSent) return;
    moveSent = true;
    window.parent.postMessage({ type: "make_move", move: action }, "*");
  }

  function render() {
    const s = view();
    if (!s) {
      $("status").textContent = t("waiting_deal");
      return;
    }
    const acting = latest.status === "ongoing" ? latest.acting_for_player_index : null;
    const players = latest.players;
    const me = latest.my_player_index;
    const pot = s.contributed.reduce((a, b) => a + b, 0);
    $("title").textContent = t("title");
    $("info").textContent = t("info", { number: s.hand_number, small: s.small_blind, big: s.big_blind, pot });

    if (s.winner !== null) $("status").textContent = t("game_winner", { name: players[s.winner].name });
    else if (latest.status === "over") $("status").textContent = t("over");
    else if (acting !== null) $("status").textContent = t("your_turn", { name: players[acting].name });
    else if (players[s.to_act]) $("status").textContent = t("waiting_for", { name: players[s.to_act].name });
    else $("status").textContent = t("waiting_next");

    $("board").replaceChildren(...s.board.map(cardNode));

    const rows = players.map((player, seat) => {
      let cards = "";
      if (s.hole[seat]) {
        cards = el("span", {}, ...s.hole[seat].map(cardNode));
      } else if (s.hole[seat] === null && s.in_hand[seat]) {
        cards = el("span", {}, cardNode(null), cardNode(null));
      }
      const notes = [];
      if (seat === s.dealer) notes.push(t("note_dealer"));
      if (s.dealt_in[seat] && !s.in_hand[seat]) notes.push(t("note_folded"));
      if (s.in_hand[seat] && s.chips[seat] === 0) notes.push(t("note_all_in"));
      if (!s.dealt_in[seat] && s.chips[seat] > 0 && s.winner === null) notes.push(t("note_joins"));
      if (s.chips[seat] === 0 && !s.in_hand[seat]) notes.push(t("note_out"));
      const label = seat === me ? t("player_you", { name: player.name }) : player.name;
      return el("tr", { className: seat === s.to_act ? "turn" : !s.in_hand[seat] ? "out" : "" },
        el("td", { textContent: label }),
        el("td", { className: "num", textContent: s.chips[seat] }),
        el("td", { className: "num", textContent: s.bets[seat] || "" }),
        el("td", {}, cards),
        el("td", { className: "muted", textContent: notes.join(", ") }));
    });
    $("table").replaceChildren(
      el("tr", {}, ...[t("head_player"), t("head_chips"), t("head_bet"), t("head_cards"), ""].map((text) => el("th", { textContent: text }))),
      ...rows);

    const controls = [];
    if (acting !== null && acting === me && s.to_act === acting && s.legal) {
      const options = s.legal;
      if (options.canFold) controls.push(el("button", { textContent: t("fold"), onclick: () => play({ type: "fold" }) }));
      if (options.canCheck) controls.push(el("button", { textContent: t("check"), onclick: () => play({ type: "check" }) }));
      else if (!options.canCheck && options.callAmount > 0) controls.push(el("button", { textContent: t("call", { amount: options.callAmount }), onclick: () => play({ type: "call" }) }));
      if (options.minRaiseTo !== null) {
        const amount = el("input", { type: "number", min: options.minRaiseTo, max: options.maxRaiseTo, step: 1, value: options.minRaiseTo });
        controls.push(
          el("button", { textContent: s.current_bet === 0 ? t("bet") : t("raise_to"), onclick: () => play({ type: "raise", to: Number(amount.value) }) }),
          amount,
          el("button", { textContent: t("all_in", { amount: options.maxRaiseTo }), onclick: () => play({ type: "raise", to: options.maxRaiseTo }) }));
      }
    }
    $("controls").replaceChildren(...controls);

    const previous = s.previous_hand;
    $("previous").hidden = !previous;
    if (previous) {
      const shown = previous.shown.map(({ seat, cards, hand }) =>
        el("div", {}, t("shown_player", { name: players[seat]?.name ?? t("seat", { number: seat + 1 }) }), " ", ...cards.map(cardNode), ` ${hand}`));
      $("previous").replaceChildren(
        el("div", { className: "muted", textContent: t("last_hand", { number: previous.hand_number, description: previous.description }) }),
        el("div", {}, ...previous.board.map(cardNode)),
        ...shown,
        el("div", { textContent: previous.won.map(({ seat, amount }) => t("won_amount", { name: players[seat]?.name ?? seat, amount })).join(", ") }));
    }
    $("log").textContent = s.log.join("\n");
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.type !== "state_changed") return;
    applyLocale(message);
    latest = message;
    moveSent = false;
    render();
  });
}
</script>
</body>
</html>
