<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 12px 16px; font-family: Inter, sans-serif; background: #0f1a14; color: #eee; font-size: 14px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: #9aa; }
  #status { margin: 6px 0 10px; min-height: 20px; font-weight: 600; }
  .card {
    display: inline-block; min-width: 30px; padding: 4px 4px; margin: 0 2px; text-align: center;
    background: #fafafa; color: #111; border-radius: 4px; font-size: 18px; font-weight: 700;
  }
  .card.red { color: #c00; }
  .card.back { background: #345; color: #9ab; }
  #board { margin: 6px 0; min-height: 34px; }
  table { border-collapse: collapse; margin: 8px 0; }
  td, th { padding: 4px 10px; border-bottom: 1px solid #2a3a30; text-align: left; white-space: nowrap; }
  th { color: #9aa; font-weight: 600; font-size: 12px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.turn td { background: #1f3a28; }
  tr.out td { color: #677; }
  #controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 8px 0; min-height: 34px; }
  button { font: inherit; padding: 6px 12px; border-radius: 4px; border: 1px solid #5a7; background: #234; color: #eee; cursor: pointer; }
  button:hover { background: #345; }
  input { font: inherit; width: 90px; padding: 5px; background: #111; color: #eee; border: 1px solid #5a7; border-radius: 4px; }
  #previous { margin-top: 10px; padding: 8px; background: #16261c; border-radius: 4px; }
  #log { margin-top: 8px; font-size: 12px; color: #9aa; white-space: pre-line; }
</style>
</head>
<body>
<h1>Texas hold'em</h1>
<div class="muted" id="info"></div>
<div id="status">Waiting for the platform…</div>
<div id="board"></div>
<table id="table"></table>
<div id="controls"></div>
<div id="previous" hidden></div>
<div id="log"></div>

<script>
"use strict";

// ---- UI only: the rules live in poker.server.js, on the server. ----
// state_changed carries this player's view: the public table, the
// viewer's own hole cards (everyone else's are null), and — on the
// viewer's turn — the legal actions. A click sends the action as the
// move; the server validates and applies it, and moves computers itself.
if (typeof window !== "undefined" && window.document) {
  const SUIT_SYMBOLS = { s: "♠", h: "♥", d: "♦", c: "♣" };
  const cardText = (card) => `${card[0] === "T" ? "10" : card[0]}${SUIT_SYMBOLS[card[1]]}`;
  let latest = null; // the last state_changed message
  let moveSent = false; // at most one make_move per state_changed

  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...children) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  };
  const view = () => latest.view ?? latest.state;

  function cardNode(card) {
    if (!card) return el("span", { className: "card back", textContent: "🂠" });
    const red = card[1] === "h" || card[1] === "d";
    return el("span", { className: `card${red ? " red" : ""}`, textContent: cardText(card) });
  }

  function play(action) {
    if (moveSent) return;
    moveSent = true;
    window.parent.postMessage({ type: "make_move", move: action }, "*");
  }

  function render() {
    const s = view();
    const players = latest.players ?? [];
    const me = latest.my_player_index;
    if (!s) {
      // No hand yet (the match has not started, or its first state is
      // still on its way): show who is seated instead of an empty table.
      $("status").textContent = me === null
        ? "Waiting for the game to start."
        : "You're seated. Waiting for the game to start.";
      if (players.length) {
        $("table").replaceChildren(
          el("tr", {}, el("th", { textContent: "Player" }), el("th", { textContent: "" })),
          ...players.map((player, seat) => el("tr", {},
            el("td", { textContent: `${player.name}${seat === me ? " (you)" : ""}` }),
            el("td", { className: "muted", textContent: "seated" }))));
      }
      return;
    }
    const acting = latest.status === "ongoing" ? latest.acting_for_player_index : null;
    const pot = s.contributed.reduce((a, b) => a + b, 0);
    $("info").textContent =
      `Hand #${s.hand_number} · blinds ${s.small_blind}/${s.big_blind} · pot ${pot}` +
      (me === null ? " · You are watching this match" : "");

    if (s.winner !== null) $("status").textContent = `${players[s.winner].name} wins the game!`;
    else if (latest.status === "over") $("status").textContent = "The match is over.";
    else if (acting !== null) $("status").textContent = `Your turn, ${players[acting].name}.`;
    else $("status").textContent = `Waiting for ${players[s.to_act]?.name ?? "the next player"}.`;
    // A player who joined mid-hand is seated but not dealt in yet: say
    // so plainly instead of leaving them to decode the table.
    if (me !== null && latest.status === "ongoing" && s.winner === null &&
        !s.dealt_in[me] && s.chips[me] > 0) {
      $("status").textContent = "You've joined this match — you'll be dealt in from the next hand.";
    }

    $("board").replaceChildren(...s.board.map(cardNode));

    const rows = players.map((player, seat) => {
      let cards = "";
      if (s.hole[seat]) {
        cards = el("span", {}, ...s.hole[seat].map(cardNode));
      } else if (s.hole[seat] === null && s.in_hand[seat]) {
        cards = el("span", {}, cardNode(null), cardNode(null));
      }
      const notes = [];
      if (seat === s.dealer) notes.push("dealer");
      if (s.dealt_in[seat] && !s.in_hand[seat]) notes.push("folded");
      if (s.in_hand[seat] && s.chips[seat] === 0) notes.push("all in");
      if (!s.dealt_in[seat] && s.chips[seat] > 0 && s.winner === null) notes.push("joins next hand");
      if (s.chips[seat] === 0 && !s.in_hand[seat]) notes.push("out");
      const label = `${player.name}${seat === me ? " (you)" : ""}`;
      return el("tr", { className: seat === s.to_act ? "turn" : !s.in_hand[seat] ? "out" : "" },
        el("td", { textContent: label }),
        el("td", { className: "num", textContent: s.chips[seat] }),
        el("td", { className: "num", textContent: s.bets[seat] || "" }),
        el("td", {}, cards),
        el("td", { className: "muted", textContent: notes.join(", ") }));
    });
    $("table").replaceChildren(
      el("tr", {}, ...["Player", "Chips", "Bet", "Cards", ""].map((t) => el("th", { textContent: t }))),
      ...rows);

    const controls = [];
    if (acting !== null && acting === me && s.to_act === acting && s.legal) {
      const options = s.legal;
      if (options.canFold) controls.push(el("button", { textContent: "Fold", onclick: () => play({ type: "fold" }) }));
      if (options.canCheck) controls.push(el("button", { textContent: "Check", onclick: () => play({ type: "check" }) }));
      else if (!options.canCheck && options.callAmount > 0) controls.push(el("button", { textContent: `Call ${options.callAmount}`, onclick: () => play({ type: "call" }) }));
      if (options.minRaiseTo !== null) {
        const amount = el("input", { type: "number", min: options.minRaiseTo, max: options.maxRaiseTo, step: 1, value: options.minRaiseTo });
        controls.push(
          el("button", { textContent: s.current_bet === 0 ? "Bet" : "Raise to", onclick: () => play({ type: "raise", to: Number(amount.value) }) }),
          amount,
          el("button", { textContent: `All in (${options.maxRaiseTo})`, onclick: () => play({ type: "raise", to: options.maxRaiseTo }) }));
      }
    }
    $("controls").replaceChildren(...controls);

    const previous = s.previous_hand;
    $("previous").hidden = !previous;
    if (previous) {
      const shown = previous.shown.map(({ seat, cards, hand }) =>
        el("div", {}, `${players[seat]?.name ?? `Seat ${seat + 1}`}: `, ...cards.map(cardNode), ` ${hand}`));
      $("previous").replaceChildren(
        el("div", { className: "muted", textContent: `Last hand (#${previous.hand_number}): ${previous.description}` }),
        el("div", {}, ...previous.board.map(cardNode)),
        ...shown,
        el("div", { textContent: previous.won.map(({ seat, amount }) => `${players[seat]?.name ?? seat} won ${amount}`).join(", ") }));
    }
    $("log").textContent = s.log.join("\n");
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.type !== "state_changed") return;
    latest = message;
    moveSent = false;
    render();
  });
}
</script>
</body>
</html>
