<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brazilian Truco</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}.hand{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.card{min-width:52px;min-height:68px;padding:6px;border-radius:8px;border:1px solid #64748b;background:#f8fafc;color:#0f172a;font-weight:700;font-size:18px;cursor:pointer}.card.red{color:#dc2626}.card.trump{outline:3px solid #f59e0b}.card:disabled{cursor:default;opacity:.5}.table{display:flex;gap:6px;margin:8px 0;min-height:68px;align-items:center}.meta{font-size:14px;color:#bec9dc}button.act{font:inherit;min-height:48px;padding:0 18px;border:1px solid #64748b;border-radius:8px;background:#25344e;color:white;cursor:pointer;margin:4px 6px 4px 0}button.act.raise{background:#b45309;font-weight:700}button.act:disabled{opacity:.5;cursor:default}.rules{font-size:14px;color:#bec9dc;max-width:500px}</style></head><body><h1 id="title"></h1><p class="rules" id="rules"></p><div id="status" role="status" aria-live="polite"></div><div class="meta" id="meta"></div><div id="trickLabel"></div><div class="table" id="trick"></div><div id="handLabel"></div><div class="hand" id="hand"></div><div id="actions"></div><script type="application/json" id="i18n-strings">
{
"title": "Brazilian Truco",
"rules": "A team trick-taking game (seats 1&3 vs 2&4). The face-up card (vira) sets the manilhas: the next rank up is trump, strongest by suit ♦ ♠ ♥ ♣. Win two tricks to take the hand. Call Truco to raise the stakes (1→3→6→9→12); your opponents may accept, run, or raise back. First team to 12 points wins.",
"waiting_platform": "Waiting for the platform…",
"waiting": "Waiting…",
"player_n": "Player {n}",
"trick_label": "Trick in progress:",
"hand_label": "Your hand:",
"team_n": "Team {n}",
"tied": "tied",
"none_yet": "none yet",
"meta_scores": "Hand {hand} · {team1} {score1} pts · {team2} {score2} pts · hand is worth {value}",
"meta_vira": "Vira: {vira} → manilhas are {rank}s · tricks: {tricks}",
"last_hand_none": "Last hand: no score ({how})",
"last_hand_team": "Last hand: {team} +{points} ({how})",
"stakes_line": "Stakes: {value} — {result}",
"cards_item": "{name} {count}",
"cards_line": "Cards: {list}",
"team1_wins": "🏆 Team 1 (seats 1 & 3) wins the match!",
"team2_wins": "🏆 Team 2 (seats 2 & 4) wins the match!",
"raised": "Truco! Stakes raised to {to} — accept, run, or raise back?",
"saving": "Saving move…",
"play_a_card": "{name} — play a card",
"waiting_for": "Waiting for {names}",
"no_cards_yet": "(no cards yet)",
"accept": "Accept ({to})",
"run": "Run (fold)",
"raise_back": "Raise back!",
"call_truco": "Call Truco! (raise to {to})"
}
</script>
<script>
"use strict";

// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}


let latest=null,sentFor=-1;
const $=id=>document.getElementById(id);
$('status').textContent=t('waiting_platform');
const RANKS=["4","5","6","7","Q","J","K","A","2","3"];
const SUITS={D:"♦",S:"♠",H:"♥",C:"♣"};
const trumpRank=t=>RANKS[(RANKS.indexOf(t.slice(0,-1))+1)%RANKS.length];
const isTrump=(c,t)=>c.slice(0,-1)===trumpRank(t);
const lbl=c=>c.slice(0,-1)+(SUITS[c.slice(-1)]||"");
const red=c=>c.endsWith("H")||c.endsWith("D");
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function send(move){if(sentFor===moveCount())return;sentFor=moveCount();parent.postMessage({type:"make_move",move},"*");render();}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status");
 const name=i=>(latest.players&&latest.players[i]&&latest.players[i].name)||t("player_n",{n:i+1});
 $("title").textContent=t("title");$("rules").textContent=t("rules");$("trickLabel").textContent=t("trick_label");$("handLabel").textContent=t("hand_label");
 if(!v||v.empty){status.textContent=t("waiting");return;}
 const teamOf=i=>t("team_n",{n:(i%2)+1});
 const over=latest.status==="over"||(v.winner!==null&&v.winner!==undefined);
 const trickList=v.tricks.map(tr=>tr.side===-1?t("tied"):teamOf(tr.seat)).join(", ");
 const lines=[t("meta_scores",{hand:v.hand_no,team1:teamOf(0),score1:v.scores[0],team2:teamOf(1),score2:v.scores[1],value:v.value}),
   t("meta_vira",{vira:lbl(v.turned),rank:trumpRank(v.turned),tricks:trickList||t("none_yet")})];
 if(v.last_hand)lines.push(v.last_hand.side===null?t("last_hand_none",{how:v.last_hand.how}):t("last_hand_team",{team:teamOf(v.last_hand.side===0?0:1),points:v.last_hand.points,how:v.last_hand.how}));
 if(v.raise_log)lines.push(t("stakes_line",{value:v.raise_log.value,result:v.raise_log.result}));
 const cardList=(latest.players||[]).map((p,i)=>t("cards_item",{name:p.name,count:v.hand_counts[i]??0})).join(" · ");
 lines.push(t("cards_line",{list:cardList}));
 $("meta").replaceChildren(...lines.map(l=>{const d=document.createElement("div");d.textContent=l;return d;}));
 if(over)status.textContent=v.winner===0?t("team1_wins"):t("team2_wins");
 else if(v.raise&&myTurn())status.textContent=t("raised",{to:v.raise.to});
 else if(sentFor===moveCount())status.textContent=t("saving");
 else if(myTurn())status.textContent=t("play_a_card",{name:name(latest.acting_for_player_index)});
 else{const turn=latest.turn_of_player_indices||latest.turn;status.textContent=turn&&turn.length?t("waiting_for",{names:turn.map(name).join(", ")}):t("waiting");}
 const trick=$("trick");trick.replaceChildren();
 for(const p of (v.trick||[])){
   const d=document.createElement("button");d.className="card"+(red(p.card)?" red":"")+(isTrump(p.card,v.turned)?" trump":"");
   d.textContent=lbl(p.card);d.disabled=true;d.title=name(p.seat);trick.append(d);
   const who=document.createElement("span");who.className="meta";who.textContent=name(p.seat);trick.append(who);
 }
 if(!(v.trick||[]).length)trick.textContent=t("no_cards_yet");
 const hand=$("hand");hand.replaceChildren();
 for(const c of (v.hand||[])){
   const b=document.createElement("button");
   b.className="card"+(red(c)?" red":"")+(isTrump(c,v.turned)?" trump":"");
   b.textContent=lbl(c);
   b.disabled=!myTurn()||over||!!v.raise||sentFor===moveCount();
   b.onclick=()=>send({type:"play",card:c});
   hand.append(b);
 }
 const actions=$("actions");actions.replaceChildren();
 if(!over&&myTurn()){
   if(v.raise){
     const acc=document.createElement("button");acc.className="act";acc.textContent=t("accept",{to:v.raise.to});acc.onclick=()=>send({type:"accept"});actions.append(acc);
     const run=document.createElement("button");run.className="act";run.textContent=t("run");run.onclick=()=>send({type:"run"});actions.append(run);
     if(v.raise.to<12){const rr=document.createElement("button");rr.className="act raise";rr.textContent=t("raise_back");rr.onclick=()=>send({type:"raise"});actions.append(rr);}
   }else if(v.can_raise){
     const r=document.createElement("button");r.className="act raise";r.textContent=t("call_truco",{to:{1:3,3:6,6:9,9:12}[v.value]||""});r.disabled=sentFor===moveCount();r.onclick=()=>send({type:"raise"});actions.append(r);
   }
 }
}
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;applyLocale(e.data);latest=e.data;render();});
</script></body></html>
