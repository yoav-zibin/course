<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#04170e;color:#fff;min-height:100vh}
header{max-width:900px;margin:auto;padding:14px 12px 0;text-align:center}
h1{margin:0;font-size:24px;letter-spacing:.3px}
h1 span{color:#ff6b81}
.sub{font-size:13px;opacity:.85;margin-top:4px}
#status{max-width:900px;margin:10px auto 0;padding:10px 14px;background:#0b3d24;border:1px solid #1f7a48;border-radius:12px;font-size:14px;text-align:center}
#scores{max-width:900px;margin:10px auto 0;display:flex;gap:8px;padding:0 12px;flex-wrap:wrap}
.score{flex:1;min-width:150px;background:#0d4a2b;border:2px solid transparent;border-radius:12px;padding:8px 10px}
.score.turn{border-color:gold;box-shadow:0 0 0 2px gold}
.score .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .pts{font-size:13px;margin-top:2px}
#tableWrap{max-width:900px;margin:10px auto;padding:0 12px}
#table{background:radial-gradient(ellipse at center,#1a8a46 0%,#10602f 55%,#073d1c 100%);border:10px solid #4a2c14;border-radius:28px;min-height:520px;box-shadow:inset 0 0 80px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.5);overflow:hidden;padding:12px;display:grid;grid-template-columns:132px 1fr 132px;grid-template-rows:auto 1fr auto;grid-template-areas:"top top top" "left center right" "bottom bottom bottom";gap:8px}
.seat{width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:0}
.seat-bottom{grid-area:bottom}
.seat-top{grid-area:top}
.seat-left{grid-area:left}
.seat-right{grid-area:right}
.seat .pname{font-size:12px;font-weight:800;background:rgba(0,0,0,.65);display:inline-block;padding:3px 10px;border-radius:20px;max-width:128px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;order:0}
.seat.turn .pname{background:gold;color:#111}
.seat-top .slot{order:0}
.seat-top .pname{order:1}
.seat-top .taken-line{order:2}
.seat-top .backs{order:3}
.slot{width:92px;height:128px;border-radius:12px;border:2px dashed rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,.8);background:rgba(0,0,0,.15);order:1;flex-shrink:0}
.slot.filled{border:none;background:none}
.slot .count{font-size:12px}
.taken-line{min-height:18px;order:2}
.backs{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;min-height:4px;order:3}
#center{grid-area:center;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;min-height:140px}
#center .big{font-size:18px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#center .small2{font-size:13px;opacity:.95;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.pcard{width:88px;height:124px;background:#fff;color:#111;border-radius:10px;position:relative;box-shadow:0 5px 14px rgba(0,0,0,.5);border:1px solid #999;flex-shrink:0;user-select:none}
.pcard.red{color:#c1121f}
.pcard .corner{position:absolute;font-weight:900;line-height:1;text-align:center;width:26px}
.pcard .corner .r{font-size:17px;display:block}
.pcard .corner .s{font-size:15px;display:block}
.pcard .corner.tl{left:5px;top:5px}
.pcard .corner.br{right:5px;bottom:5px;transform:rotate(180deg)}
.pcard .pip{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pcard .pip .bigS{font-size:46px;line-height:1}
.pcard .pip .bigR{font-size:18px;font-weight:900;margin-top:2px}
.slot .pcard{width:88px;height:124px}
#handWrap{max-width:900px;margin:0 auto 24px;padding:0 12px}
#handLabel{font-size:14px;margin:10px 2px 6px}
#hand{display:flex;align-items:flex-end;padding:16px 12px;background:rgba(0,0,0,.45);border-radius:16px;overflow-x:auto;min-height:152px;gap:0}
#hand .pcard{margin-left:-28px;cursor:default}
#hand .pcard:first-child{margin-left:0}
#hand .pcard.playable{cursor:pointer;box-shadow:0 0 0 3px gold,0 8px 18px rgba(0,0,0,.6)}
#hand .pcard.playable:hover{transform:translateY(-16px)}
#hand .pcard.dim{opacity:.5}
.back{width:18px;height:26px;background:linear-gradient(135deg,#1e4ed8,#0f2a86);border:1px solid #fff;border-radius:4px}
.taken{font-size:11px;background:rgba(0,0,0,.55);border-radius:10px;display:inline-block;padding:2px 8px}
@media(max-width:600px){#table{grid-template-columns:92px 1fr 92px;min-height:460px}.pcard{width:72px;height:102px}.slot{width:76px;height:106px}.slot .pcard{width:72px;height:102px}.pcard .pip .bigS{font-size:36px}#hand .pcard{margin-left:-32px}}
</style></head>
<body>
<header><h1 id="title"></h1><div class="sub" id="subtitle"></div></header>
<div id="status" role="status" aria-live="polite"></div>
<div id="scores"></div>
<div id="tableWrap"><div id="table">
<div class="seat seat-top" id="seat2"><div class="pname"></div><div class="slot"></div><div class="taken-line"><span class="taken"></span></div><div class="backs"></div></div>
<div class="seat seat-left" id="seat1"><div class="pname"></div><div class="slot"></div><div class="taken-line"><span class="taken"></span></div><div class="backs"></div></div>
<div id="center"><div class="big"></div><div class="small2"></div></div>
<div class="seat seat-right" id="seat3"><div class="pname"></div><div class="slot"></div><div class="taken-line"><span class="taken"></span></div><div class="backs"></div></div>
<div class="seat seat-bottom" id="seat0"><div class="pname"></div><div class="slot"></div><div class="taken-line"><span class="taken"></span></div><div class="backs"></div></div>
</div></div>
<div id="handWrap"><div id="handLabel"></div><div id="hand"></div></div>
<script type="application/json" id="i18n-strings">
{
"title": "♥ Hearts — One Hand",
"subtitle": "1 round only • 13 tricks • Q♠ = 13 • ♥ = 1 • lowest wins • no passing",
"waiting": "Waiting…",
"shuffling": "Shuffling…",
"tie": "Tie: {names} with {low} pts",
"winner": "{name} wins with {low} pts",
"game_over": "Game over — one hand done! 🏆 {result} [{taken}]",
"with_moon": "{text} • 🌙 {name} SHOT THE MOON!",
"status_turn": "Trick {trick}/13 • {name}'s turn",
"status_turn_you": "Trick {trick}/13 • {name}'s turn — YOUR TURN!",
"with_broken": "{text} • ♥ broken",
"with_not_broken": "{text} • ♥ not broken",
"with_first_trick": "{text} • 2♣ leads, no points",
"name_you": "{name} (you)",
"taken_pts": "Taken {count} ♥",
"cards_count": "{count} cards",
"final_line": "Final: {list}",
"first_lead": "2♣ to lead",
"trick_of": "Trick {trick} of 13",
"hearts_broken": "Hearts broken",
"hearts_not_broken": "Hearts not broken",
"spectating": "Spectating:",
"spectator_note": "Spectator — hands are hidden. Cards on the table above.",
"done_took": "Done! You took {points} pts.",
"hand_label_play": "Your hand ({count}) — gold = playable, click to play",
"hand_label_wait": "Your hand ({count}) — waiting for {name}"
}
</script>
<script>

// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}


let latest=null;
function el(tag,text,cls,parent){const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=text;if(cls)e.className=cls;if(parent)parent.appendChild(e);return e}
document.getElementById('status').textContent=t('waiting');
const SYM={C:'♣',D:'♦',S:'♠',H:'♥'};
function suit(c){return c.slice(-1)}
function rankStr(c){return c.slice(0,-1)}
function isRed(c){return suit(c)==='H'||suit(c)==='D'}
function cardEl(c){const d=el('div',null,'pcard'+(isRed(c)?' red':''));const r=rankStr(c),s=SYM[suit(c)];const tl=el('div',null,'corner tl',d);el('span',r,'r',tl);el('span',s,'s',tl);const pip=el('div',null,'pip',d);el('span',s,'bigS',pip);el('span',r,'bigR',pip);const br=el('div',null,'corner br',d);el('span',r,'r',br);el('span',s,'s',br);return d}
function play(card){parent.postMessage({type:'make_move',move:{card:card}},'*')}
function render(){
 const m=latest,st=m.view,players=m.players,my=m.my_player_index,acting=m.acting_for_player_index;
 const status=document.getElementById('status'),scoresEl=document.getElementById('scores'),handEl=document.getElementById('hand'),label=document.getElementById('handLabel');
 document.getElementById('title').textContent=t('title');document.getElementById('subtitle').textContent=t('subtitle');
 handEl.replaceChildren();scoresEl.replaceChildren();
 if(!st){status.textContent=t('shuffling');label.textContent='';return}
 const n=players.length;
 const cur=st.phase==='over'?-1:st.cur;
 const low=Math.min(...st.taken), winners=players.filter((_,i)=>st.taken[i]===low).map(p=>p.name);
 const result=winners.length>1?t('tie',{names:winners.join(' & '),low:low}):t('winner',{name:winners[0],low:low});
 if(st.phase==='over'){let text=t('game_over',{result:result,taken:st.taken.join(', ')});if(st.shooter>=0)text=t('with_moon',{text:text,name:players[st.shooter].name});status.textContent=text}
 else{const q={name:players[cur]?players[cur].name:'?',trick:st.trickNum+1};let text=cur===my?t('status_turn_you',q):t('status_turn',q);text=st.heartsBroken?t('with_broken',{text:text}):t('with_not_broken',{text:text});if(st.trickNum===0)text=t('with_first_trick',{text:text});status.textContent=text}
 for(let i=0;i<n;i++){const d=el('div',null,'score'+(i===cur&&st.phase!=='over'?' turn':''),scoresEl);el('div',i===my?t('name_you',{name:players[i].name}):players[i].name,'nm',d);el('div',t('taken_pts',{count:st.taken[i]})+(st.shooter===i?' 🌙':''),'pts',d)}
 const myIdx=my===null?0:my;
 for(let pos=0;pos<4;pos++){
  const pi=(myIdx+pos)%n;const seat=document.getElementById('seat'+pos);
  const pn=seat.querySelector('.pname'),slot=seat.querySelector('.slot'),tk=seat.querySelector('.taken'),backs=seat.querySelector('.backs');
  slot.replaceChildren();backs.replaceChildren();slot.classList.remove('filled');
  pn.textContent=pi===my?t('name_you',{name:players[pi].name}):players[pi].name;
  seat.classList.toggle('turn',pi===cur&&st.phase!=='over');
  const played=st.trick.find(x=>x.player===pi);
  if(played){slot.classList.add('filled');slot.appendChild(cardEl(played.card))}
  else{el('span',st.phase==='over'?'—':t('cards_count',{count:st.counts[pi]}),'count',slot)}
  tk.textContent='♥ '+st.taken[pi];
  if(pi!==my&&st.phase!=='over'){for(let k=0;k<Math.min(st.counts[pi],7);k++)el('div',null,'back',backs)}
 }
 const cb=document.querySelector('#center .big'),cs=document.querySelector('#center .small2');
 if(st.phase==='over'){cb.textContent='🏆 '+result;cs.textContent=t('final_line',{list:st.taken.join(' • ')})}
 else if(st.trick.length===0){cb.textContent=st.trickNum===0?t('first_lead'):t('trick_of',{trick:st.trickNum+1});cs.textContent=st.heartsBroken?t('hearts_broken'):t('hearts_not_broken')}
 else{cb.textContent='';cs.textContent=''}
 if(my===null){label.textContent=t('spectating');el('span',t('spectator_note'),null,handEl).style.cssText='font-size:13px;opacity:.9';return}
 const myHand=(st.hand||[]).slice();
 if(st.phase==='over'){label.textContent=t('done_took',{points:st.taken[my]});for(const c of myHand)handEl.appendChild(cardEl(c));return}
 const canAct=m.status==='ongoing'&&acting===my;
 const legal=canAct?(st.legal||[]):[];
 const actName=(players[acting]?players[acting].name:'…');
 label.textContent=canAct?t('hand_label_play',{count:myHand.length}):t('hand_label_wait',{count:myHand.length,name:actName});
 for(const c of myHand){const isL=legal.indexOf(c)>=0;const ce=cardEl(c);if(canAct){ce.classList.add(isL?'playable':'dim');if(isL)ce.onclick=function(){play(c)}}else ce.classList.add('dim');handEl.appendChild(ce)}
}
addEventListener('message',function(e){
 if(e.source!==parent||!e.data||e.data.type!=='state_changed')return;
 applyLocale(e.data);latest=e.data;render();
});
</script>
</body>
</html>
