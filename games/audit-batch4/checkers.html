<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f3efe6;color:#222;display:flex;flex-direction:column;align-items:center}
#wrap{width:100%;max-width:520px}
h2{margin:4px 0 2px;text-align:center}
#status{background:#fff;border-radius:10px;padding:10px 12px;text-align:center;min-height:44px;box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
#sub{font-weight:400;font-size:13px;color:#666;margin-top:4px}
#board{width:100%;aspect-ratio:1;margin:12px 0;border:6px solid #6b4a2b;border-radius:8px;overflow:hidden;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:default;user-select:none}
.light{background:#ecdcc0}
.dark{background:#7a5a3a}
.sq.playable.dark{cursor:pointer}
.piece{width:82%;height:82%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,4vw,24px);box-shadow:0 2px 4px rgba(0,0,0,.4), inset 0 2px 3px rgba(255,255,255,.4);pointer-events:none}
.p0{background:radial-gradient(circle at 30% 30%,#ff7b7b,#c81e1e);border:2px solid #7a0f0f}
.p1{background:radial-gradient(circle at 30% 30%,#555,#111);border:2px solid #000;color:#fff}
.sq.sel{outline:3px solid #ffd400;outline-offset:-3px}
.dot{position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(255,212,0,.9);box-shadow:0 0 0 3px rgba(0,0,0,.3);pointer-events:none}
.dot.cap{background:#ff3b30;box-shadow:0 0 0 3px #fff}
.sq.last{box-shadow:inset 0 0 0 4px rgba(255,212,0,.8)}
#info{display:flex;gap:8px;justify-content:space-between;font-size:14px}
.card{flex:1;background:#fff;border-radius:10px;padding:8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.card b{display:block}
.card.active{outline:3px solid #2e9e44}
button{margin-top:10px;padding:6px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer}
.hint{font-size:13px;color:#666;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div id="wrap">
<h2 id="title"></h2>
<div id="status" role="status" aria-live="polite"><span id="msg"></span><div id="sub"></div></div>
<div id="board"></div>
<div id="info"><div class="card" id="c0"></div><div class="card" id="c1"></div></div>
<div class="hint" id="hint"></div>
</div>
<script type="application/json" id="i18n-strings">
{
"title": "⚫ Checkers 🔴",
"waiting_platform": "Waiting for platform…",
"red": "Red",
"black": "Black",
"player_n": "Player {n}",
"pieces": "{count} pieces",
"pieces_to_move": "{count} pieces • to move",
"draw": "Draw! 🤝",
"wins": "{name} wins! 🏆",
"game_over": "Game over.",
"waiting_for": "Waiting for {name}…",
"turn_red": "🔴 {name}'s turn",
"turn_black": "⚫ {name}'s turn",
"turn_red_chain": "🔴 {name}'s turn — keep jumping!",
"turn_black_chain": "⚫ {name}'s turn — keep jumping!",
"capture_mandatory": "Capture is mandatory",
"hint_move": "Tap a highlighted square to move.",
"hint_select": "Tap one of your pieces.",
"server_game_is_over": "Game is over",
"server_not_your_turn": "Not your turn",
"server_bad_move": "Bad move",
"server_off_board": "Off board",
"server_you_must_capture": "You must capture",
"server_illegal_move": "Illegal move"
}
</script>
<script>

// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// A text the game's SERVER wrote (a log line, a hand name in the match state): finds its template
// among the `server_` texts of the table (the most specific that fits, each {name} standing for
// any text) and shows it in the viewer's language with the same values; any other text is
// returned as written.
const SERVER_TEMPLATES = Object.keys(SOURCE_STRINGS)
  .filter((key) => key.startsWith("server_") && SOURCE_STRINGS[key])
  .map((key) => {
    const names = [];
    let literal = 0;
    const source = SOURCE_STRINGS[key]
      .split(/\{(\w+)\}/)
      .map((piece, index) => {
        if (index % 2) { names.push(piece); return "([\\s\\S]+?)"; }
        literal += piece.length;
        return piece.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      })
      .join("");
    return { key, names, literal, pattern: new RegExp("^" + source + "$") };
  })
  .sort((a, b) => b.literal - a.literal || a.names.length - b.names.length || (a.key > b.key ? 1 : a.key === b.key ? 0 : -1));

function tx(text) {
  if (typeof text !== "string") return text;
  for (const template of SERVER_TEMPLATES) {
    const found = template.pattern.exec(text);
    if (found) {
      const params = {};
      template.names.forEach((name, index) => { if (!(name in params)) params[name] = found[index + 1]; });
      return t(template.key, params);
    }
  }
  return text;
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}


let latest=null, selected=null, pending=false;
function actingSeat(){if(!latest||latest.status!=="ongoing"||!latest.turn_of_player_indices?.length)return null;const turn=latest.turn_of_player_indices[0];if(turn===latest.my_player_index)return turn;const humans=(latest.players||[]).filter(p=>p.kind==="human");if(latest.my_player_index!==null&&humans.length===1&&latest.players[turn]?.kind==="computer")return turn;return null;}
function cur(){ return latest && latest.view ? latest.view : null; }
function countPieces(b){ let a=[0,0]; if(!b) return a; for(let r=0;r<8;r++)for(let c=0;c<8;c++) if(b[r][c]) a[b[r][c].c]++; return a; }
document.getElementById("msg").textContent=t("waiting_platform");
function render(){
  if(!latest) return;
  const st=cur();
  if(!st) return;
  document.getElementById("title").textContent=t("title");
  const players=latest.players||[{name:t("red")},{name:t("black")}];
  const acting=actingSeat();
  const toMove=(st.toMove==null?st.turn:st.toMove);
  const boardEl=document.getElementById("board");
  boardEl.replaceChildren();
  const my=latest.my_player_index;
  const flip=my===1;
  const disp=(r,c)=>flip?{r:7-r,c:7-c}:{r,c};
  const moves=(st.moves||[]);
  const destsForSel=selected?moves.filter(m=>m.from.r===selected.r&&m.from.c===selected.c):[];
  const destSet=new Set(destsForSel.map(m=>m.to.r+","+m.to.c));
  for(let dr=0;dr<8;dr++)for(let dc=0;dc<8;dc++){
    const rc=disp(dr,dc); const r=rc.r, c=rc.c;
    const d=document.createElement("div");
    d.className="sq "+(((r+c)%2===1)?"dark":"light");
    if((r+c)%2===1) d.classList.add("playable");
    if(st.lastMove&&((st.lastMove.from.r===r&&st.lastMove.from.c===c)||(st.lastMove.to.r===r&&st.lastMove.to.c===c))) d.classList.add("last");
    if(selected&&selected.r===r&&selected.c===c) d.classList.add("sel");
    const p=st.board[r][c];
    if(p){
      const pe=document.createElement("div");
      pe.className="piece "+(p.c===0?"p0":"p1");
      pe.textContent=p.k?"\u265B":"";
      pe.style.color=p.c===0?"#fff":"#ffd400";
      d.appendChild(pe);
    }
    if(destSet.has(r+","+c)){
      const dot=document.createElement("div");
      const hit=destsForSel.find(m=>m.to.r===r&&m.to.c===c);
      dot.className="dot"+((hit&&hit.cap)?" cap":"");
      d.appendChild(dot);
    }
    d.onclick=()=>onSquare(r,c);
    boardEl.appendChild(d);
  }
  const status=document.getElementById("status");
  const sub=document.getElementById("sub");
  const cnt=countPieces(st.board);
  const n0=players[0]?players[0].name:t("red");
  const n1=players[1]?players[1].name:t("black");
  const over=(st.winner!==null&&st.winner!==undefined)||st.draw;
  const card=(id,mark,name,count,moving)=>{const box=document.getElementById(id);const nm=document.createElement("b");nm.textContent=mark+" "+name;const info=document.createElement("span");info.textContent=moving?t("pieces_to_move",{count}):t("pieces",{count});box.replaceChildren(nm,info);};
  card("c0","\uD83D\uDD34",n0,cnt[0],toMove===0&&!over);
  card("c1","\u26AB",n1,cnt[1],toMove===1&&!over);
  document.getElementById("c0").classList.toggle("active",toMove===0&&!over);
  document.getElementById("c1").classList.toggle("active",toMove===1&&!over);
  let msg="";
  if(st.draw){ msg=t("draw"); }
  else if(st.winner!==null&&st.winner!==undefined){ const w=players[st.winner]?players[st.winner].name:t("player_n",{n:st.winner+1}); msg=t("wins",{name:w}); }
  else if(latest.status==="over"){ msg=t("game_over"); }
  else if(acting===null){
    const t_=(latest.turn_of_player_indices&&latest.turn_of_player_indices.length)?latest.turn_of_player_indices[0]:toMove;
    const tn=players[t_]?players[t_].name:t("player_n",{n:t_+1});
    msg=t("waiting_for",{name:tn});
  }
  else{ const n=players[acting]?players[acting].name:t("player_n",{n:acting+1}); const q={name:n};
    if(acting===0) msg=st.chain?t("turn_red_chain",q):t("turn_red",q);
    else msg=st.chain?t("turn_black_chain",q):t("turn_black",q); }
  document.getElementById("msg").textContent=msg;
  const mustJump=moves.length>0&&!!moves[0].cap;
  sub.textContent=(!over&&mustJump)?t("capture_mandatory"):"";
  let hint="";
  if(!over&&acting!==null){ hint=selected?t("hint_move"):t("hint_select"); }
  document.getElementById("hint").textContent=hint;
}
function onSquare(r,c){
  if(!latest||pending) return;
  const acting=actingSeat();
  if(acting===null) return;
  const st=cur();
  if(!st||st.winner!==null&&st.winner!==undefined||st.draw) return;
  const toMove=(st.toMove==null?st.turn:st.toMove);
  if(toMove!==acting) return;
  const moves=(st.moves||[]);
  if(selected){
    const mv=moves.find(m=>m.from.r===selected.r&&m.from.c===selected.c&&m.to.r===r&&m.to.c===c);
    if(mv){
      const s=selected; selected=null; pending=true; render();
      parent.postMessage({type:"make_move",move:{from:{r:s.r,c:s.c},to:{r:r,c:c}}},"*");
      return;
    }
  }
  const p=st.board[r]&&st.board[r][c];
  if(p&&p.c===toMove){
    if(st.chain&&(st.chain.r!==r||st.chain.c!==c)) return;
    const avail=moves.filter(m=>m.from.r===r&&m.from.c===c);
    if(avail.length){ selected={r,c}; render(); return; }
  }
  selected=null; render();
}
addEventListener("message",e=>{
  if(e.source!==parent||!e.data||e.data.type!=="state_changed") return;
  applyLocale(e.data);
  latest=e.data;
  pending=false; // A parent update also acknowledges a rejected move at the same count.
  selected=null;
  render();
});
</script>
</body>
</html>
