<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;background:#f3ead8;color:#3a2a18;margin:0;padding:16px;display:flex;flex-direction:column;align-items:center}
h2{margin:8px 0 4px}
#status{font-weight:700;margin:8px 0;min-height:24px;text-align:center}
#sub{font-size:13px;opacity:.8;margin-bottom:10px;text-align:center}
#board{display:flex;gap:10px;align-items:stretch;background:#a06a35;border-radius:20px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:720px;width:100%;box-sizing:border-box}
.store{flex:0 0 84px;background:#7c4f24;border-radius:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffe9c4;min-height:180px}
.store b{font-size:28px}
.store span{font-size:12px;opacity:.9;text-align:center;padding:0 6px}
.store.highlight{outline:3px solid gold}
#mid{flex:1;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pit{background:#e8c88a;border:2px solid #6b4420;border-radius:50%;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;position:relative;user-select:none}
.pit .n{font-size:22px;font-weight:800}
.pit .dots{font-size:10px;letter-spacing:1px;opacity:.7;max-width:90%;overflow:hidden;white-space:nowrap}
.pit.clickable{background:#fff2c9;cursor:pointer;border-color:#2a7a2a;box-shadow:0 0 0 2px #2a7a2a}
.pit.clickable:hover{transform:scale(1.05)}
.pit.last{outline:3px solid #2a7aff}
.label{font-size:12px;font-weight:700;text-align:center;color:#ffe9c4}
#info{margin-top:10px;font-size:14px;text-align:center;max-width:720px}
#scores{display:flex;gap:16px;justify-content:center;margin-top:6px;font-size:14px}
details{margin-top:10px;max-width:720px;font-size:13px}
button.pit{font-family:inherit;color:inherit}
</style>
</head>
<body>
<h2 id="title"></h2>
<div id="status" role="status" aria-live="polite"></div>
<div id="sub"></div>
<div id="board">
  <div class="store" id="storeLeft"><span id="storeLeftName"></span><b id="storeLeftCount">0</b><span class="storeWord"></span></div>
  <div id="mid">
    <div class="label" id="topLabel"></div>
    <div class="row" id="topRow"></div>
    <div class="row" id="botRow"></div>
    <div class="label" id="botLabel"></div>
  </div>
  <div class="store" id="storeRight"><span id="storeRightName"></span><b id="storeRightCount">0</b><span class="storeWord"></span></div>
</div>
<div id="scores"></div>
<div id="info"></div>
<details><summary id="howto"></summary><p id="howtoText"></p></details>
<script type="application/json" id="i18n-strings">
{
"title": "Mancala",
"waiting_platform": "Waiting for platform…",
"player_n": "Player {n}",
"seat": "P{n}",
"name_you": "{name} (you)",
"store": "store",
"how_to_play": "How to play",
"how_to_text": "Pick up all stones from one of your 6 pits. Sow one by one counterclockwise (toward your store on your end). Skip opponent's store. Last stone in your store = extra turn. Last stone in empty pit on your side = capture that + opposite pit to your store. Game ends when one side is empty; remaining stones go to owner. Most stones wins.",
"tie": "Tie game! {a} – {b}",
"wins": "🏆 {name} wins {a} – {b}!",
"game_over": "Game over {a} – {b}",
"waiting_other": "Waiting for another player…",
"turn": "{name}'s turn",
"turn_you": "{name}'s turn (you)",
"turn_extra": "{name}'s turn — extra turn!",
"turn_you_extra": "{name}'s turn (you) — extra turn!",
"spectating": "Spectating — {a} (bottom) vs {b} (top)",
"you_are_bottom": "You are {name} — bottom side.",
"you_are_top": "You are {name} — top side.",
"with_pick": "{text} Pick a highlighted pit.",
"with_waiting": "{text} Waiting for {name}…",
"stores_line": "Stores — {a}: {sa}  |  {b}: {sb}  |  Total stones: {total}",
"last_store": "Last: {name} → store ({pos}).",
"last_pit": "Last: {name} → pit {pit}.",
"last_store_captured": "Last: {name} → store ({pos}) captured {count}.",
"last_pit_captured": "Last: {name} → pit {pit} captured {count}.",
"direction": "Counterclockwise: bottom sows left→right, top sows right→left.",
"stones": "{count} stones",
"pit_title": "Pit {pit} ({count})",
"server_not_seated": "not seated",
"server_game_over": "game over",
"server_pick_a_pit": "pick a pit",
"server_that_is_not_your_pit": "that is not your pit",
"server_pit_is_empty": "pit is empty"
}
</script>
<script>

// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// A text the game's SERVER wrote (a log line, a hand name in the match state): finds its template
// among the `server_` texts of the table (the most specific that fits, each {name} standing for
// any text) and shows it in the viewer's language with the same values; any other text is
// returned as written.
const SERVER_TEMPLATES = Object.keys(SOURCE_STRINGS)
  .filter((key) => key.startsWith("server_") && SOURCE_STRINGS[key])
  .map((key) => {
    const names = [];
    let literal = 0;
    const source = SOURCE_STRINGS[key]
      .split(/\{(\w+)\}/)
      .map((piece, index) => {
        if (index % 2) { names.push(piece); return "([\\s\\S]+?)"; }
        literal += piece.length;
        return piece.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      })
      .join("");
    return { key, names, literal, pattern: new RegExp("^" + source + "$") };
  })
  .sort((a, b) => b.literal - a.literal || a.names.length - b.names.length || (a.key > b.key ? 1 : a.key === b.key ? 0 : -1));

function tx(text) {
  if (typeof text !== "string") return text;
  for (const template of SERVER_TEMPLATES) {
    const found = template.pattern.exec(text);
    if (found) {
      const params = {};
      template.names.forEach((name, index) => { if (!(name in params)) params[name] = found[index + 1]; });
      return t(template.key, params);
    }
  }
  return text;
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}


let latest=null, pending=false;
function getView(){ if(!latest) return null; return latest.view!==undefined?latest.view:latest.state; }
function norm(s){
  if(!s||!Array.isArray(s.pits)||s.pits.length!==12||!Array.isArray(s.stores)) return {pits:[4,4,4,4,4,4,4,4,4,4,4,4],stores:[0,0],lastPos:null,lastPlayer:-1,extraTurn:false,captured:0,winner:null,gameOver:false};
  return s;
}
function pname(i,players){ if(players&&players[i]) return players[i].name||t("player_n",{n:i}); return t("player_n",{n:i}); }
function pnameYou(i,players,my){ return i===my?t("name_you",{name:pname(i,players)}):pname(i,players); }
function setStatic(){ document.getElementById("title").textContent=t("title"); document.getElementById("howto").textContent=t("how_to_play"); document.getElementById("howtoText").textContent=t("how_to_text"); document.querySelectorAll(".storeWord").forEach(function(e){e.textContent=t("store");}); }
document.getElementById("status").textContent=t("waiting_platform");
function trySend(pit){
  if(!latest||pending||latest.status!=="ongoing")return;
  if(latest.acting_for_player_index==null)return;
  pending=true;
  parent.postMessage({type:"make_move",move:{pit:pit}},"*");
}
function render(){
  setStatic();
  if(!latest)return;
  let st=norm(getView());
  let players=latest.players||[{name:"P0"},{name:"P1"}];
  while(players.length<2)players.push({name:t("seat",{n:players.length})});
  let my=latest.my_player_index;
  let bottom=(my===0||my===1)?my:0;
  let top=1-bottom;
  let acting=latest.status==="ongoing"?latest.acting_for_player_index:null;
  let statusEl=document.getElementById("status");
  let sub=document.getElementById("sub");
  let over=latest.status==="over"||st.gameOver;
  if(over){
    let w=st.winner;
    if(w===-1)statusEl.textContent=t("tie",{a:st.stores[0],b:st.stores[1]});
    else if(w===0||w===1)statusEl.textContent=t("wins",{name:pname(w,players),a:st.stores[w],b:st.stores[1-w]});
    else statusEl.textContent=t("game_over",{a:st.stores[0],b:st.stores[1]});
    sub.textContent="";
  }else{
    if(acting==null)statusEl.textContent=t("waiting_other");
    else{
      const q={name:pname(acting,players)};
      if(acting===my)statusEl.textContent=st.extraTurn?t("turn_you_extra",q):t("turn_you",q);
      else statusEl.textContent=st.extraTurn?t("turn_extra",q):t("turn",q);
    }
    if(my==null)sub.textContent=t("spectating",{a:pname(0,players),b:pname(1,players)});
    else{
      let text=my===bottom?t("you_are_bottom",{name:pname(my,players)}):t("you_are_top",{name:pname(my,players)});
      if(acting===my)text=t("with_pick",{text:text});
      else if(acting!=null)text=t("with_waiting",{text:text,name:pname(acting,players)});
      sub.textContent=text;
    }
  }
  let leftPlayer=top,rightPlayer=bottom;
  document.getElementById("storeLeftName").textContent=pnameYou(leftPlayer,players,my);
  document.getElementById("storeRightName").textContent=pnameYou(rightPlayer,players,my);
  document.getElementById("storeLeftCount").textContent=st.stores[leftPlayer];
  document.getElementById("storeRightCount").textContent=st.stores[rightPlayer];
  document.getElementById("storeLeft").className="store"+((st.lastPos===(leftPlayer===0?"s0":"s1"))?" highlight":"");
  document.getElementById("storeRight").className="store"+((st.lastPos===(rightPlayer===0?"s0":"s1"))?" highlight":"");
  document.getElementById("topLabel").textContent=pnameYou(top,players,my);
  document.getElementById("botLabel").textContent=pnameYou(bottom,players,my);
  let topOrder=bottom===0?[6,7,8,9,10,11]:[5,4,3,2,1,0];
  let botOrder=bottom===0?[0,1,2,3,4,5]:[11,10,9,8,7,6];
  buildRow("topRow",topOrder,st,acting,my,over);
  buildRow("botRow",botOrder,st,acting,my,over);
  document.getElementById("scores").textContent=t("stores_line",{a:pname(0,players),sa:st.stores[0],b:pname(1,players),sb:st.stores[1],total:st.stores[0]+st.stores[1]+st.pits.reduce((a,b)=>a+b,0)});
  const infoLines=[];
  if(st.lastPlayer>=0&&st.lastPos){
    const q={name:pname(st.lastPlayer,players),pos:st.lastPos,pit:st.lastPos.slice(1),count:st.captured};
    const store=st.lastPos[0]==="s";
    if(st.captured>0)infoLines.push(store?t("last_store_captured",q):t("last_pit_captured",q));
    else infoLines.push(store?t("last_store",q):t("last_pit",q));
  }
  if(latest.status==="ongoing"&&acting!=null)infoLines.push(t("direction"));
  document.getElementById("info").replaceChildren(...infoLines.map(function(line){const d=document.createElement("div");d.textContent=line;return d;}));
}
function buildRow(rowId,order,st,acting,my,over){
  let row=document.getElementById(rowId);
  row.replaceChildren();
  for(let pit of order){
    let b=document.createElement("button");
    b.className="pit";
    let cnt=st.pits[pit];
    let dots=cnt<=10?"\u25CF".repeat(cnt):t("stones",{count:cnt});
    const nEl=document.createElement("div");nEl.className="n";nEl.textContent=String(cnt);
    const dEl=document.createElement("div");dEl.className="dots";dEl.textContent=dots;
    b.append(nEl,dEl);
    b.title=t("pit_title",{pit:pit,count:cnt});
    if(st.lastPos==="p"+pit)b.classList.add("last");
    let canPlay=!over&&latest.status==="ongoing"&&acting!=null&&acting===my&&((acting===0&&pit<6)||(acting===1&&pit>=6))&&cnt>0;
    if(canPlay){b.classList.add("clickable");b.disabled=false;b.onclick=()=>trySend(pit);}
    else{b.disabled=true;b.style.cursor="default";}
    row.appendChild(b);
  }
}
addEventListener("message",(e)=>{
  if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;
  applyLocale(e.data);
  latest=e.data;
  pending=false; // Parent updates include same-count rejection acknowledgements.
  render();
});
</script>
</body>
</html>
