<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quoridor</title><style>body{margin:0;padding:16px;background:#101827;color:#edf2ff;font:16px system-ui}*{box-sizing:border-box}h1{font-size:23px;margin:0 0 8px}#status{font-weight:650;margin:12px 0;color:#8ee7cd}.grid{display:grid;gap:2px}.cell{display:grid;place-items:center;background:#25344e;border-radius:3px;font-size:19px}.cell.dest{outline:3px solid #22c55e;cursor:pointer}.wslot{background:#1d2942;border-radius:2px}.wslot.on{background:#fcd34d}.wslot.pick{cursor:pointer}.wslot.pick:hover{background:#fcd34d88}.anchor{background:transparent;border:0;padding:0}.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}button{font:inherit;min-height:44px;padding:0 16px;border:1px solid #64748b;border-radius:8px;background:#25344e;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}button.on{outline:3px solid #fcd34d}.meta{font-size:14px;color:#bec9dc}.rules{font-size:14px;color:#bec9dc;max-width:480px}</style></head><body><h1 id="title"></h1><p class="rules" id="rules"></p><div id="status" role="status" aria-live="polite"></div><div class="meta" id="meta"></div><div class="row"><button id="modeMove"></button><button id="modeWall"></button><button id="orient"></button></div><div class="grid" id="grid"></div><script type="application/json" id="i18n-strings">
{
"title": "Quoridor",
"rules": "Race your pawn to the far row. Each turn either move one square (jumping over your opponent when you meet) or place one of your 10 walls to slow them down — a wall may never block the last path. Player 1 (bottom) heads up; Player 2 (top) heads down.",
"waiting_platform": "Waiting for the platform…",
"waiting": "Waiting…",
"player_n": "Player {n}",
"move_pawn": "Move pawn",
"place_wall": "Place wall",
"wall_horizontal": "Wall: horizontal",
"wall_vertical": "Wall: vertical",
"walls_left": "Walls left — {name0}: {walls0} · {name1}: {walls1}",
"wins": "{name} wins! 🏆",
"saving": "Saving move…",
"your_turn_move": "{name} — your turn (move your pawn)",
"your_turn_wall": "{name} — your turn (place a wall — click an intersection)",
"waiting_for": "Waiting for {name}…"
}
</script>
<script>
"use strict";

// Translation helper (docs/game-translation.md). Needs the i18n-strings block before it.
const SOURCE_STRINGS = JSON.parse(document.getElementById("i18n-strings").textContent);
let strings = SOURCE_STRINGS;

// The text for a key in the viewer's language, with {name}-style placeholders filled in.
function t(key, params) {
  const text = strings[key] ?? SOURCE_STRINGS[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (match, name) => (params && name in params ? params[name] : match));
}

// Call this first in the state_changed handler, before drawing anything: the platform sends
// the viewer's translations (message.strings), language and writing direction with it.
function applyLocale(message) {
  if (message.strings || message.locale) strings = { ...SOURCE_STRINGS, ...(message.strings || {}) };
  if (message.locale) document.documentElement.lang = message.locale;
  if (message.direction) document.documentElement.dir = message.direction;
}


let latest=null,sentFor=-1,mode="move",orient="H";
const $=id=>document.getElementById(id);
$("status").textContent=t("waiting_platform");
function moveCount(){return latest?(latest.move_count??latest.moveCount??0):0;}
function myTurn(){return latest&&latest.status==="ongoing"&&latest.acting_for_player_index!==null&&latest.acting_for_player_index!==undefined;}
function blocked(walls,r1,c1,r2,c2){
 for(const w of walls){
  if(c1===c2&&w.o==='H'&&w.r===Math.min(r1,r2)&&(w.c===c1||w.c===c1-1))return true;
  if(r1===r2&&w.o==='V'&&w.c===Math.min(c1,c2)&&(w.r===r1||w.r===r1-1))return true;
 }
 return false;
}
function hasPath(walls,pawn,goal){
 const queue=[[pawn.r,pawn.c]],seen=new Set([pawn.r+','+pawn.c]);
 for(let h=0;h<queue.length;h++){
  const [r,c]=queue[h];if(r===goal)return true;
  for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
   const nr=r+dr,nc=c+dc,key=nr+','+nc;
   if(nr<0||nr>8||nc<0||nc>8||seen.has(key)||blocked(walls,r,c,nr,nc))continue;
   seen.add(key);queue.push([nr,nc]);
  }
 }
 return false;
}
function wallFits(v,r,c,o){
 if(!v||!Number.isInteger(r)||!Number.isInteger(c)||r<0||r>7||c<0||c>7||(o!=='H'&&o!=='V')||!(v.wallsLeft[v.turnIdx]>0))return false;
 for(const w of v.walls){
  if(w.r===r&&w.c===c)return false;
  if(o==='H'&&w.o==='H'&&w.r===r&&Math.abs(w.c-c)===1)return false;
  if(o==='V'&&w.o==='V'&&w.c===c&&Math.abs(w.r-r)===1)return false;
 }
 const walls=v.walls.concat([{r,c,o}]);
 return hasPath(walls,v.pawns[0],0)&&hasPath(walls,v.pawns[1],8);
}
function send(move){if(!myTurn()||sentFor===moveCount())return;
 const v=latest.view;if(!v||v.winner!=null)return;
 if(move.type==="wall"){if(!wallFits(v,move.r,move.c,move.o))return;}
 else if(move.type!=="pawn"||!(v.legalMoves||[]).some(m=>m[0]===move.r&&m[1]===move.c))return;
 sentFor=moveCount();parent.postMessage({type:"make_move",move},"*");render();}
function render(){
 if(!latest)return;
 const v=latest.view,status=$("status"),grid=$("grid");
 const name=i=>(latest.players&&latest.players[i]&&latest.players[i].name)||t("player_n",{n:i+1});
 $("title").textContent=t("title");$("rules").textContent=t("rules");
 $("modeMove").textContent=t("move_pawn");$("modeWall").textContent=t("place_wall");
 if(!v){status.textContent=t("waiting");return;}
 const over=latest.status==="over"||(v.winner!==null&&v.winner!==undefined);
 $("meta").textContent=t("walls_left",{name0:name(0),walls0:v.wallsLeft[0],name1:name(1),walls1:v.wallsLeft[1]});
 if(over)status.textContent=t("wins",{name:name(v.winner)});
 else if(sentFor===moveCount())status.textContent=t("saving");
 else if(myTurn()){const who={name:name(latest.acting_for_player_index)};if(mode==="move")status.textContent=t("your_turn_move",who);else status.textContent=t("your_turn_wall",who);}
 else status.textContent=t("waiting_for",{name:name(v.turnIdx)});
 $("modeMove").className=mode==="move"?"on":"";$("modeWall").className=mode==="wall"?"on":"";
 $("orient").textContent=orient==="H"?t("wall_horizontal"):t("wall_vertical");
 $("modeMove").disabled=!myTurn()||over;$("modeWall").disabled=!myTurn()||over;
 $("orient").disabled=!myTurn()||over||mode!=="wall";
 const wallSet=new Set(v.walls.map(w=>w.r+","+w.c+","+w.o));
 const segOn=(r,c,o)=>wallSet.has(r+","+c+","+o);
 grid.replaceChildren();
 grid.style.gridTemplateColumns="repeat(17,1fr)";grid.style.maxWidth="470px";
 const legal=new Set((myTurn()&&mode==="move")?(v.legalMoves||[]).map(m=>m[0]+","+m[1]):[]);
 for(let gr=0;gr<17;gr++)for(let gc=0;gc<17;gc++){
   const d=document.createElement("div");
   const cellR=gr/2,cellC=gc/2;
   if(gr%2===0&&gc%2===0){
     d.className="cell";d.style.height="40px";
     const p0=v.pawns[0].r===cellR&&v.pawns[0].c===cellC,p1=v.pawns[1].r===cellR&&v.pawns[1].c===cellC;
     d.textContent=p0?"🔵":p1?"🔴":"";
     if(legal.has(cellR+","+cellC)){d.classList.add("dest");d.onclick=()=>send({type:"pawn",r:cellR,c:cellC});}
   }else if(gr%2===0){ // vertical wall segment between (r, c) and (r, c+1): belongs to wall V at (r, gc/2 floor) rows gr/2-? segment rows
     const r=gr/2,c=Math.floor(gc/2);
     const on=segOn(r,c,"V")||segOn(r-1,c,"V");
     d.className="wslot"+(on?" on":"");
   }else if(gc%2===0){ // horizontal wall segment
     const r=Math.floor(gr/2),c=gc/2;
     const on=segOn(r,c,"H")||segOn(r,c-1,"H");
     d.className="wslot"+(on?" on":"");
   }else{ // intersection: wall anchor (r,c) = (floor(gr/2), floor(gc/2))
     const r=Math.floor(gr/2),c=Math.floor(gc/2);
     d.className="wslot anchor"+(wallSet.has(r+","+c+",H")||wallSet.has(r+","+c+",V")?" on":"");
     if(myTurn()&&sentFor!==moveCount()&&mode==="wall"&&!over&&wallFits(v,r,c,orient)){d.classList.add("pick");d.onclick=()=>send({type:"wall",r,c,o:orient});}
   }
   grid.append(d);
 }
}
$("modeMove").onclick=()=>{mode="move";render();};
$("modeWall").onclick=()=>{mode="wall";render();};
$("orient").onclick=()=>{orient=orient==="H"?"V":"H";render();};
addEventListener("message",e=>{if(e.source!==parent||!e.data||e.data.type!=="state_changed")return;applyLocale(e.data);latest=e.data;sentFor=-1;render();});
</script></body></html>
