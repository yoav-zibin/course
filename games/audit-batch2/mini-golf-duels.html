<!doctype html>
<html>
<head><meta charset="utf-8"><style>body{font-family:sans-serif;padding:12px;max-width:680px;background:#101820}h2{color:#fff;margin:0}canvas{border:3px solid #0c2b1d;border-radius:10px;display:block;touch-action:none;background:#123}#ui{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:14px}.pill{background:#fff;border-radius:12px;padding:4px 10px;border:1px solid #999}.b0{color:#1a56db;font-weight:bold}.b1{color:#c2410c;font-weight:bold}button{font-size:15px;padding:6px 14px;margin:4px}#ui2{color:#fff}#msg{color:#cbd5e1;font-size:13px}</style></head>
<body>
<h2>Mini Golf Duels (2P, 5 holes)</h2>
<div id="ui"><span class="pill" id="hole">Hole -</span><span class="pill" id="par">Par -</span><span class="pill" id="turn">Waiting…</span></div>
<div id="ui2" style="display:flex;gap:12px;margin-bottom:6px;font-size:14px"><span id="s0"></span><span id="s1"></span></div>
<canvas id="cv" width="640" height="400"></canvas>
<p id="msg">Drag back from your ball and release to putt.</p>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const COLORS=['#2563eb','#f97316'];const MAXS=8,HOLES=5,RB=7,W2=96;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function holeDef(){return V().course;}
function decor(i){const R=rng(5000+i*331);const t=[];for(let k=0;k<22;k++)t.push({x:R()*640,y:R()*400,s:4+R()*7,c:['#0d4d2a','#14532d','#1a6b3c'][Math.floor(R()*3)]});const f=[];for(let k=0;k<10;k++)f.push({x:30+R()*580,y:30+R()*340,c:['#fff','#ffd6e8','#fff7a8'][Math.floor(R()*3)],s:2+R()*2});return{t,f};}
let DECOR=[0,1,2,3,4].map(decor);
function fallbackState(){return{hole:0,pos:[[80,200],[90,200]],sunk:[false,false],cur:[0,0],tot:[0,0],hist:[[],[]],par:2};}
let latest=null,view=fallbackState(),aim=null,animBall=null,dragging=false;
function V(){return view||fallbackState();}
let animSeat=null,animationGeneration=0,lastAnimationKey=null;
function animateShot(shot,key){if(!shot||key===lastAnimationKey||shot.hole!==V().hole)return;lastAnimationKey=key;const generation=++animationGeneration,frames=shot.frames||[];let k=0;animSeat=shot.seat;function step(){if(generation!==animationGeneration)return;if(k<frames.length){animBall=frames[k++];requestAnimationFrame(step);}else{animBall=null;animSeat=null;}}step();}
function myTurn(){if(!latest||latest.status!=='ongoing')return -1;const a=latest.acting_for_player_index;return a==null?-1:a;}
function canHumanShoot(s){return latest&&latest.status==='ongoing'&&latest.acting_for_player_index===s&&latest.my_player_index===s&&latest.players[s].kind==='human'&&!V().sunk[s]&&!dragging;}
function mouse(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*400/r.height];}
function posToDraw(s){if(animBall&&animSeat===s)return animBall;return V().pos[s];}
function path(poly){ctx.beginPath();ctx.moveTo(poly[0][0],poly[0][1]);for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i][0],poly[i][1]);ctx.closePath();}
function arrow(x1,y1,x2,y2,col){const a=Math.atan2(y2-y1,x2-x1);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-10*Math.cos(a-0.4),y2-10*Math.sin(a-0.4));ctx.lineTo(x2-10*Math.cos(a+0.4),y2-10*Math.sin(a+0.4));ctx.fill();}
cv.addEventListener('pointerdown',e=>{const a=myTurn();if(a<0||!canHumanShoot(a)||animBall)return;const m=mouse(e),p=V().pos[a];if(Math.hypot(m[0]-p[0],m[1]-p[1])<32){dragging=true;aim={x:m[0],y:m[1]};try{cv.setPointerCapture(e.pointerId);}catch(_){}}});
cv.addEventListener('pointermove',e=>{if(dragging)aim={x:mouse(e)[0],y:mouse(e)[1]};});
cv.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;const a=myTurn();const m=mouse(e);const p=V().pos[a].slice();let vx=(p[0]-m[0])*0.06,vy=(p[1]-m[1])*0.06;const sp=Math.hypot(vx,vy);if(sp<0.5||!canHumanShoot(a)){aim=null;return;}if(sp>14){vx*=14/sp;vy*=14/sp;}aim=null;parent.postMessage({type:'make_move',move:{vx:vx,vy:vy}},'*');});
function draw(t){const st=V(),hi=Math.min(st.hole,HOLES-1),d=holeDef(hi);if(!d){requestAnimationFrame(draw);return;}
 let g=ctx.createLinearGradient(0,0,0,400);g.addColorStop(0,'#0e3a5d');g.addColorStop(1,'#0a2418');ctx.fillStyle=g;ctx.fillRect(0,0,640,400);
 const dc=DECOR[hi];for(const tr of dc.t){ctx.fillStyle=tr.c;ctx.beginPath();ctx.arc(tr.x,tr.y,tr.s,0,7);ctx.fill();}
 ctx.strokeStyle='rgba(120,200,255,0.25)';ctx.lineWidth=2;for(let i=0;i<3;i++){let y=(t/40+i*130)%480-40;ctx.beginPath();ctx.moveTo(0,y);ctx.quadraticCurveTo(160,y+12,320,y);ctx.quadraticCurveTo(480,y-12,640,y);ctx.stroke();}
 ctx.lineJoin='round';ctx.lineCap='round';
 path(d.fair);ctx.fillStyle='#35a24e';ctx.fill();ctx.save();path(d.fair);ctx.clip();
 ctx.fillStyle='rgba(255,255,255,0.06)';for(let i=0;i<8;i++)ctx.fillRect(0,i*50,640,20);
 ctx.fillStyle='rgba(0,0,0,0.08)';const R=rng(99);for(let i=0;i<60;i++)ctx.fillRect(25+R()*590,25+R()*350,3,3);
 for(const f of dc.f){ctx.fillStyle=f.c;ctx.beginPath();ctx.arc((f.x%600)+20,(f.y%340)+30,f.s,0,7);ctx.fill();}
 for(const s of d.sands){path(s);ctx.fillStyle='#e7d27a';ctx.fill();ctx.strokeStyle='#b89b4a';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#8a6d2b';ctx.font='11px sans-serif';ctx.fillText('SAND',s[0][0]-12,s[0][1]);}
 for(const ic of d.ices){path(ic);ctx.fillStyle='rgba(180,230,255,0.9)';ctx.fill();ctx.strokeStyle='#7ec8f0';ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.moveTo(ic[0][0],ic[0][1]);ctx.lineTo(ic[2][0],ic[2][1]);ctx.stroke();ctx.fillStyle='#2a7aa0';ctx.font='11px sans-serif';ctx.fillText('ICE',ic[0][0]-8,ic[0][1]);}
 ctx.fillStyle='#3fbf5a';ctx.beginPath();ctx.arc(d.cup[0],d.cup[1],22,0,7);ctx.fill();
 ctx.fillStyle='#111';ctx.beginPath();ctx.arc(d.cup[0],d.cup[1],9,0,7);ctx.fill();
 const wv=Math.sin((t||0)/300)*4;ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(d.cup[0],d.cup[1]);ctx.lineTo(d.cup[0],d.cup[1]-42);ctx.stroke();
 ctx.fillStyle='#e11d48';ctx.beginPath();ctx.moveTo(d.cup[0],d.cup[1]-42);ctx.lineTo(d.cup[0]+26+wv,d.cup[1]-34);ctx.lineTo(d.cup[0],d.cup[1]-26);ctx.fill();
 if(d.port){for(const P of [d.port.a,d.port.b]){ctx.fillStyle='#a855f7';ctx.beginPath();ctx.arc(P.x,P.y,P.r+3,0,7);ctx.fill();ctx.fillStyle='#22d3ee';ctx.beginPath();ctx.arc(P.x,P.y,P.r-2+Math.sin(t/200)*1.5,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(P.x,P.y,4,0,7);ctx.fill();}}
 ctx.restore();
 path(d.fair);ctx.strokeStyle='#7c4a21';ctx.lineWidth=8;ctx.stroke();
 for(const w of d.walls){path(w);ctx.fillStyle='#7a7d85';ctx.fill();ctx.strokeStyle='#3f4147';ctx.lineWidth=2;ctx.stroke();}
 for(let i=0;i<2;i++){if(st.sunk[i]&&animSeat!==i)continue;const p=posToDraw(i);ctx.beginPath();ctx.arc(p[0]+2,p[1]+3,7,0,7);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fill();ctx.beginPath();ctx.arc(p[0],p[1],7,0,7);ctx.fillStyle=COLORS[i];ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();}
 const a=myTurn();
 if(aim&&a>=0){const p=V().pos[a];const shotx=p[0]-aim.x,shoty=p[1]-aim.y;const sp=Math.min(14,Math.hypot(shotx*0.06,shoty*0.06));const col=sp>10?'#ef4444':sp>6?'#facc15':'#22ff88';
  ctx.save();ctx.setLineDash([6,5]);ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(aim.x,aim.y);ctx.stroke();ctx.restore();
  arrow(p[0],p[1],aim.x,aim.y,'rgba(255,255,255,0.9)');
  const L=20+sp*10,n=Math.hypot(shotx,shoty)||1;arrow(p[0],p[1],p[0]+shotx/n*L,p[1]+shoty/n*L,col);}
 requestAnimationFrame(draw);}
requestAnimationFrame(draw);
addEventListener('message',event=>{if(event.source!==parent||!event.data||event.data.type!=='state_changed')return;
 latest=event.data;view=(latest.view&&latest.view.pos)?latest.view:fallbackState();
 const st=V(),hi=Math.min(st.hole,4),d=holeDef(hi);if(!d)return;
 const animationKey=String(latest.move_count??latest.moveCount??0)+":"+hi;if(animationKey!==lastAnimationKey){animationGeneration++;animBall=null;animSeat=null;animateShot(st.lastShot,animationKey);}
 document.getElementById('hole').textContent='Hole '+(hi+1)+' / '+HOLES;
 document.getElementById('par').textContent='Par '+(st.par||d.par)+(d.port?' • Portal':'');
 document.getElementById('s0').innerHTML='<b class="b0">●</b> P1 ('+st.cur[0]+', total '+st.tot[0]+')'+(st.sunk[0]?' ✔':'');
 document.getElementById('s1').innerHTML='<b class="b1">●</b> P2 ('+st.cur[1]+', total '+st.tot[1]+')'+(st.sunk[1]?' ✔':'');
 if(latest.status==='over'){
  const w=st.winner!==undefined?st.winner:(st.tot[0]===st.tot[1]?-1:(st.tot[0]<st.tot[1]?0:1));
  document.getElementById('turn').textContent=w===-1?'Tie!':((latest.players[w]&&latest.players[w].name)||('P'+(w+1)))+' wins!';
  document.getElementById('msg').textContent='Final: '+st.tot[0]+' – '+st.tot[1]+(st.hist[0]&&st.hist[0].length?' (holes '+st.hist[0].join(',')+' vs '+st.hist[1].join(',')+')':'');}
 else{const a=latest.acting_for_player_index;
  document.getElementById('turn').textContent=(a===null||a===undefined)?'Waiting…':((latest.players[a]&&latest.players[a].name)||('P'+(a+1)))+"'s turn";
  document.getElementById('msg').textContent=(latest.my_player_index===a)?'Your shot: pull back and release. Ice=slippery, purple=teleport.':'Waiting for '+((a!==null&&a!==undefined&&latest.players[a]&&latest.players[a].name)||'other')+'…';}});
</script>
</body>
</html>
